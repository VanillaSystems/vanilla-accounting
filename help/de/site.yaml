phases:
  take-stock: Überblick
  assemble: Zusammentragen
  book: Buchen
  file: Abrechnen

quarter:
  quarter_ends:
    name: Ein Quartal endet.
    text: Die MWST wird pro Quartal abgerechnet, mit dem Saldosteuersatz pro Halbjahr.
  board:
    name: Sehen, was fehlt.
    text: Die App zählt, welche Zahlungen noch einen Beleg brauchen und welche Belege noch keine Zahlung haben.
  collect:
    name: Belege sammeln.
    text: Aus den Mails, von Portalen, vom Handy und auf Papier. Was die App selbst holen kann, holt sie.
  intake:
    name: Belege ablegen.
    text: Die App liest jeden Beleg, legt ihn im Quartal ab und merkt sich Betrag, Datum, Firma und MWST.
  banks:
    name: Kontoauszüge einlesen.
    text: Ein camt.053 aus dem E-Banking, eine CSV oder das PDF des Auszugs.
  evidence:
    name: Belege und Zahlungen paaren.
    text: Zuerst nach Regeln, dann mit der KI. Was offen bleibt, steht unter «Offen».
  booking:
    name: Buchen.
    text: Jede Zahlung bekommt mindestens eine Buchung mit Konto und MWST-Code.
  review_rules:
    name: Bestätigen, was das Quartal gelehrt hat.
    text: Vorgeschlagene Regeln behalten oder ersetzen, offene Fragen beantworten.
  filing:
    name: Die MWST-Abrechnung einreichen.
    text: Die App erzeugt die Datei für «MWST abrechnen» der ESTV. Danach ist das Quartal gesperrt.
  last_quarter:
    name: War es das letzte Quartal des Jahres?
    text: Wenn nicht, beginnt das nächste Quartal.
  quarter_done:
    name: Das Quartal ist abgeschlossen.
    text: Was darin gebucht ist, bleibt so, wie es eingereicht wurde.
  year:
    name: Das Jahr abschliessen.
    text: Fremdwährungskonten bewerten, den Abschluss prüfen, die Saldi ins neue Jahr vortragen.
  year_done:
    name: Das Jahr ist abgeschlossen.
    text: Das neue Jahr beginnt mit den vorgetragenen Saldi.
