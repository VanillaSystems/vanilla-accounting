# The German help site (tools/help/build.ts): its words, its sections in the order the menu shows
# them, and the words for each step of processes/quarter-close.flow.yaml. The build fails while a
# step of the flow has no words here, or a step named here is no longer in the flow.
title: Hilfe zu Vanilla Accounting

sections:
  - { id: start, title: Loslegen }
  - { id: faelle, title: Häufige Fälle }
  - { id: nachschlagen, title: Nachschlagen }

