# The compensation fund (Ausgleichskasse) an employer is affiliated with: AHV/IV/EO, ALV and
# family allowances. Which fund, and its bank text, is the company's: knowledge/authorities/.

id: ausgleichskasse
name: Ausgleichskasse (AHV compensation fund)
match:
  # The fund is the payee: its name starts the bank's counterparty (or the merchant of the text). Never
  # `tx`, which matches anywhere in the text: a fiduciary's or payroll provider's invoice names the fund
  # too, and needs its receipt (#362). A company's own file of its fund wins over this one.
  payee: [ "ausgleichskasse", "kantonale ausgleichskasse", "ahv-ausgleichskasse", "sozialversicherungsanstalt", "SVA St. Gallen", "SVA St.Gallen", "SVA Zürich", "SVA Aargau", "caisse de compensation", "caisse cantonale de compensation", "cassa di compensazione", "cassa cantonale di compensazione" ]

facts:
  - id: shares
    fact: AHV/IV/EO and ALV contributions are paid half by the employee and half by the employer; the employer withholds the employee's half from the salary and pays both
    source: AHVG Art. 14 Abs. 1
  - id: akonto
    fact: during the year the employer pays provisional contributions (Akontobeiträge) on the expected salary sum, monthly, or quarterly when the annual salary sum is at most CHF 200,000
    source: AHVV Art. 34; AHVV Art. 35
  - id: akonto-due
    fact: contributions are due at the end of each payment period and are paid within 10 days
    source: AHVV Art. 34
  - id: salary-report
    fact: after the year ends, the employer reports each employee's salary (Lohnbescheinigung) by 30 January; the fund then bills or refunds the difference to the Akonto payments
    source: AHVV Art. 36

steps:
  evidence.guide.yaml#rules:
    rules:
      - id: ev-ausgleichskasse-notice
        when: a payment to or from the compensation fund
        then: "booked at once, without waiting for a receipt: the payment settles the fund's contribution invoice, kept with the payroll documents. The invoice (an Akonto bill) is still paired with the payment that names its number"
        apply: { receipt: none, pairs: true }
        why: it carries no input tax, so no receipt changes its booking (issue #29); the bill tells the employees' share from the employer's (issue #456)
        source: decision 2026-10-21, owner
    precedents: []
