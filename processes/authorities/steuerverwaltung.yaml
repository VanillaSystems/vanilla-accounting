# The cantonal tax office: the profit and capital tax of a GmbH, and the direct federal tax it
# collects for the Confederation. Which canton, and its bank text, is the company's.

id: steuerverwaltung
name: Kantonale Steuerverwaltung (cantonal tax office)
match:
  tx: [ "kantonale steuerverwaltung", "steueramt" ]

facts:
  - id: federal-tax
    fact: the canton assesses and collects the direct federal tax together with its own taxes
    source: DBG Art. 2
  - id: federal-rate
    fact: the direct federal tax on the profit of a GmbH or AG is 8.5% of the net profit
    source: DBG Art. 68
  - id: tax-return
    fact: a legal entity files one tax return per business year, with its signed annual accounts attached
    source: DBG Art. 125 Abs. 2
  - id: federal-due
    fact: the direct federal tax of a year falls due on 1 March of the following year and is paid within 30 days
    source: DBG Art. 161 Abs. 1; DBG Art. 163 Abs. 1
  - id: instalments
    fact: cantonal and communal taxes are billed provisionally in instalments during the year; due dates, interest and discounts are set by each canton's own tax law
    source: StHG Art. 1 Abs. 3

steps:
  evidence.guide.yaml#rules:
    rules:
      - id: ev-steuerverwaltung-notice
        when: a payment to or from the tax office
        then: "booked at once, without waiting for a receipt: the payment settles a tax bill or instalment, filed apart"
        apply: { receipt: none }
        why: it carries no input tax, so no receipt changes its booking (issue #29)
        source: decision 2026-10-21, owner
    precedents: []

  booking.guide.yaml#purchase_vat:
    rules:
      - id: pv-steuerverwaltung-no-input-tax
        when: a payment to or from the tax office
        then: "no input tax: a tax is no supply, its bill carries no VAT"
        why: "taxes are outside VAT; a tax bill read as a receipt must not bring input tax onto its payment (issue #456)"
        apply: { inputTax: none }
        source: MWSTG Art. 28 Abs. 1
    precedents: []
