# Knowledge for bank-import.flow.yaml.

process: bank-import

steps:
  read:
    goal: Read a statement that comes without camt.053 (a PDF, a scan, a photo, a bank's CSV) into its movements and balances, checked to the cent.
    rules:
      - id: bnk-read-as-printed
        when: the AI reads a statement PDF, scan or photo
        then: every movement once, as printed (money out negative), the balances and carry-overs apart; it computes nothing, code checks opening + movements = closing and each page's carry-over
        source: docs/0.4.0/intake.md
      - id: bnk-read-gap
        when: the check shows a gap
        then: nothing is imported; the person corrects the line the gap's page points to (often a misread digit) until it adds up
        source: docs/0.4.0/intake.md
      - id: bnk-read-known
        when: a line is a payment the books hold already (same account, day, direction, amount)
        then: it is not added again; its camt.053 and the read statement are one payment
        source: docs/0.4.0/intake.md
      - id: bnk-read-structured
        when: a statement PDF arrives for an account that has a camt.053 or a bank CSV in the books (#254)
        then: it is kept as its statement without a question, whatever days it shows and whenever it comes; it is read only when its own words do not name the account and days, and «Bewegungen aus dem PDF einlesen» reads it on request
        source: docs/0.4.0/intake.md
      - id: bnk-read-asked
        when: a statement PDF arrives for an account without camt.053 or CSV
        then: it is kept as its statement at once and its question (read its movements in, or keep it as the statement alone) waits in the books with the table, answered in the drop dialog or under Kontoauszüge; the account's first camt.053 or CSV closes it as kept
        source: docs/0.4.0/intake.md
      - id: bnk-read-covered
        when: a camt.053 or CSV of the account covers days of a statement read from a PDF
        then: a line on those days is imported only as the payment the books hold of its day and amount, never as a new one (a value date or a day misread would double a payment); when they cover every day there is nothing to read in
        source: docs/0.4.0/intake.md
      - id: bnk-read-replaced
        when: the account's first camt.053 or CSV arrives after movements were read from PDFs for its days
        then: a read movement of the same day and amount is its payment, under the read's ref with the bank's references and IBANs, its bookings and receipt links kept, the payee deciding between equal amounts; one the bank shows within seven days for the same amount takes the bank's day, the app's bookings with it; one the bank holds otherwise (a few Rappen off, in parts, split, a tie, or booked by a person and moving) asks «Ist das dieselbe Zahlung?» and holds the bank's movement from every run until answered; one it lacks stays as a movement of its own, marked for the person to keep or remove; nothing of a filed period changes, and a read movement of a filed day booked there asks about the bank's movement of the same payee within seven days, whatever days the bank's file covers, and «Ja, dieselbe» marks it as booked there and books only the difference to the exchange difference account
        source: docs/0.4.0/intake.md
      - id: bnk-read-csv
        when: a bank's CSV is dropped
        then: the person names its columns once; the mapping is kept per account in knowledge/bank-csv.yaml and reads the next CSV of that header
        source: docs/0.4.0/intake.md
    precedents: []

  relink:
    goal: Re-attach journal entries and mappings whose transaction ref changed on re-import.
    rules:
      - id: bnk-match-old-ref
        when: an entry or mapping points at a ref that no longer exists
        then: find the new transaction with the same date, amount and description and re-point it; never delete the entry
        source: src/cli/restamp-fx-rates.ts (split refs ref~…)
    precedents: []

  investigate:
    goal: Explain a month-end gap between ledger and bank, in the account's own currency.
    rules:
      - id: bnk-missing-export
        when: the gap equals a run of transactions in one period
        then: a camt053 month is missing — download it again (monthly files, not year-to-date)
        source: src/cli/reconcile-balances.ts
      - id: bnk-doubled
        when: the gap equals one transaction amount
        then: look for the same entry imported twice under two refs
        source: proposed 2026-10-07 by Claude — confirm or replace
        status: proposed
    precedents: []
