# Knowledge for evidence.flow.yaml, one section per step.
#
# Decide by: rules (first match wins) → precedents → ask_human_when → new_case.
# Add knowledge here, not in the flow and not in chat. See processes/README.md.

process: evidence

steps:
  rules:
    goal: >
      Link what can be linked without judgment, and settle transactions that need no receipt. A rule links only when exactly one candidate fits.
    reads: [ transactions, receipts with kind and amount, mappings, proposals incl. rejected pairs ]
    gates:
      - id: ev-human-wins
        status: proposed
        when: a person already linked, unlinked, rejected or marked the item
        then: leave it exactly as it is
        why: a person's answer is never overwritten by a machine
        source: proposed 2026-10-07 by Claude — confirm or replace
        test: human-answered
      - id: ev-closed
        when: the transaction is dated on or before config.closedThrough
        then: do not touch its mappings
        source: AGENTS.md § Period close
        test: closed-period
      - id: ev-exempt-separate-fee
        when: "the transaction is a fee row of the bank: the fee of another payment, debited as a movement of its own (a fee row that names the payment it charges for), or the bank's fee for the account itself (the statement's code for charges, no other party)"
        then: settled, exempt — the bank statement is the evidence
        source: definition
        test: wise-fee
      - id: ev-exempt-own-transfer
        status: proposed
        when: money moves between two of our own accounts (bank ↔ bank, one currency account ↔ another)
        then: settled, exempt — both statements are the evidence
        source: proposed 2026-10-07 by Claude — confirm or replace
        test: own-transfer
    rules:
      - id: ev-pair-chain
        when: "on every intake run, «Zahlung suchen» and «Beleg suchen»: a receipt nothing is linked to and a payment without one, whichever came first"
        then: "code scores the candidates (src/intake/pairing.ts WEIGHTS: amount, the bank's original amount, day, vendor name, document number) within BOUNDS; a clear pair (CLEAR: score and margin both ways) is checked by the model in batches and linked as «code, checked by the model», or without a model by code when it also names the vendor, carries a number or the bank's original amount; a payment without a receipt of its own (marked, own transfer, booked onto the owner, exempted by a rule) and a filed payment another receipt points at are never candidates; a short list (up to 5) is the model's to choose at 0.8 or more; the rest is the person's with the candidates. A filed payment's receipt is pointed at it (filedPayment), never linked; a pair a person unlinked is never paired again (notPaidBy); a pair the model doubted is not asked again (pairDoubted)"
        why: "a receipt that came before its statement was matched only once, at its own intake (#187); npm run eval:pairing measures the chain on the books' own links"
        source: decision 2026-10-26, owner
      - id: ev-reference
        status: proposed
        when: "the receipt prints the payment reference of exactly one open transaction: the whole reference, a 16+ digit QR reference anywhere, or a 6+ digit invoice number standing on its own"
        then: link it, whatever the amount or currency; fee rows, statements and credit notes against outgoing payments never qualify. An existing link the reference contradicts is reported, and moved only when the amount agrees too
        why: "a payment in another currency than its invoice, and an invoice linked to the wrong payment, are found only this way"
        source: proposed 2026-10-08 by Claude — confirm or replace
      - id: ev-card-hold
        status: proposed
        when: "one card ref has a debit and a credit of the same merchant within a few days (split into ref~date-DBIT/CRDT legs): a pay-at-pump or deposit pre-authorisation"
        then: "if debit − credit equals the receipt (in the original currency the description prints), link the receipt to BOTH legs. If the credit equals the debit (a hold released in full), settle both legs with noReceipt: hold and release, net 0"
        why: "a pay-at-pump station reserves an amount first and refunds the unused part, so one fill-up is two or three bank rows"
        source: proposed 2026-10-08 by Claude — confirm or replace
      - id: ev-exempt-authorities
        status: proposed
        when: payment to or from the ESTV, AHV/SVA, the tax office, or salary
        then: "settled, exempt — the authority's or the payroll document is filed separately. ESTV: link its invoice or reminder if one exists; a VAT refund or payment equals a filed return's payableTax in filings/<year>/ (negative = credit refunded) — name that file in the noReceipt reason"
        why: "a VAT refund or payment is the payableTax of one filed return"
        source: proposed 2026-10-07 by Claude — confirm or replace
      - id: ev-exempt-bank-fees
        when: "our own bank's fee for the account or for payments, a row the bank itself coded as its charge (bank transaction code ACMT or PMNT with the sub-family CHRG or FEES; «Gebührenbelastung Kontoführung», «Abschlussbetreffnis», a card's annual fee)"
        then: "settled, exempt — the bank statement is the evidence. Code books it before any model is asked: the bank-charges account (6940 Bankspesen) without a VAT code, a fee paid back the other way; a company rule that matches the row decides it instead. A row under the bank's name without such a code (a loan's amortisation, a mortgage's interest) and a custody fee (SECU) are the model's or the person's"
        why: a bank's services for the account and for payments are exempt without credit (MWSTG Art. 21 Abs. 2 Ziff. 19), so there is no input tax and no code
        source: decision 2026-11-12, owner
      - id: ev-exempt-cash-withdrawal
        when: a cash withdrawal from a bank account at a cash machine or a counter
        then: "booked at once, without waiting for a receipt: the money moves onto the cash box (1000), a money account, without a VAT code. What the cash pays for has its own receipt, booked from the cash box. A company rule that asks about withdrawals (booking.guide.yaml#classify) still asks"
        apply: { receipt: none, text: "Bancomat|Postomat|Geldautomat|\\bATM\\b|Bargeld|Barbezug|\\bRetrait\\b|\\bPrelievo\\b" }
        why: "a withdrawal is a transfer between two money accounts: no purchase, no VAT, no receipt of its own (issue #99)"
        source: docs/0.4.0/money-movements.md
      - id: ev-exempt-wages
        when: a wage paid to an employee (the owner too, when employed by the company), on a firm whose setup says it has staff or an employed owner
        then: "booked at once, without waiting for a receipt: a wage has no supplier's receipt, its evidence is the payslip of the payroll, filed apart; no VAT code (booking.guide.yaml#classify cls-salary). Read off the payment's own text, never the counterparty's name: the wage word at its start, or followed by a month, a period or a year («Lohn Juli 2026», «Salaire septembre»), and not beside an invoice, a subscription, a licence, bookkeeping, a firm's legal form, social insurance or tax, nor in a compound («Lohn- und Finanzbuchhaltung»). It is freed from the wait only: a receipt that matches it is still paired, and the payment is booked again from it"
        apply: { receipt: none, firm: employer, text: '^\s*(?:(?:13\.\s*)?(?:Monats|Netto|Stunden)?l[oö]hne?|Lohnzahlung(?:en)?|Salär|Gehalt|Gehälter|Salaires?|Salario|Salari|Stipendio|Stipendi|Salary|Salaries)(?![\w-])|(?<![\w-])(?:(?:13\.\s*)?(?:Monats|Netto|Stunden)?l[oö]hne?|Lohnzahlung(?:en)?|Salär|Gehalt|Gehälter|Salaires?|Salario|Salari|Stipendio|Stipendi|Salary|Salaries)\s+(?:(?:Jan(?:uar|vier|uary)?|Gennaio|Feb(?:ruar|ruary)?|F[eé]vrier|Febbraio|M[aä]rz|Maerz|Mars|Marzo|March|Apr(?:il|ile)?|Avril|Mai|Maggio|May|Juni?|Juin|Giugno|June|Juli?|Juillet|Luglio|July|Aug(?:ust)?|Ao[uû]t|Agosto|Sept?(?:ember|embre)?|Settembre|Okt(?:ober)?|Oct(?:ober|obre)?|Ottobre|Nov(?:ember|embre)?|Dez(?:ember)?|D[eé]c(?:ember|embre)?|Dicembre)\b|\d{1,2}[./]\d{2,4}|(?:19|20)\d{2}\b|Q[1-4]\b)', not: 'Rechnung|\bRg\b|Faktura|Facture|Fattura|Invoice|\bAbo|Abbonamento|Subscription|Lizenz|Licen[cs]e|Licenza|Buchhaltung|Treuhand|Fiduciaire|Fiduciaria|Software|Gestion|\b(?:AHV|ALV|BVG|UVG|KTG|SVA|AVS|LPP|LAA|EO|IV)\b|Pensionskasse|Ausgleichskasse|Beitr[aä]g|Cotisation|Contribut|Steuer|\bImp[oô]t|Imposta|\bTax|\b(?:AG|GmbH|SA|S[aà]rl|Sagl)\b' }
        why: "wages carry no VAT, so no receipt changes their booking; held back for one, the wages of a whole quarter stayed unbooked after the first statement. A temp agency's bill, payroll software or a payroll office is a purchase with VAT, so the wording is narrow and never ends the search for a receipt"
        source: "AGENTS.md § Rules the app carries out (issue #340)"
      - id: ev-unique-amount
        status: proposed
        when: exactly one transaction has the same amount and currency within 10 days of the receipt date, and no other receipt claims it
        then: link it
        source: proposed 2026-10-07 by Claude — confirm or replace
      - id: ev-receipt-set
        when: "several receipts of one vendor (its UID, else its name) owe one open payment exactly: to the centime, in the payment's currency, dated up to a month before it or a week after, together with the receipts linked to it already"
        then: "link them all when no other set fits that payment and none of the receipts fits another payment (src/intake/receipt-sets.ts); the payment is then booked one line per receipt, each with its own account and VAT. A sum off by a centime, or two sets that fit, is a proposal on the payment's line, never a link"
        why: "a marketplace's or courier's several invoices are paid in one charge (issue #27)"
        source: decision 2026-10-23, owner
      - id: ev-duplicate
        status: proposed
        when: two receipts of the same vendor, amount and date, or the same invoice number
        then: mark the later one duplicate of the earlier
        source: proposed 2026-10-07 by Claude — confirm or replace
    precedents: []

  ai:
    goal: For what the rules left open, find the candidates and say how sure it is.
    reads: [ the item, its 20 nearest candidates by date and amount, the vendor's guide rules ]
    rules:
      - id: ai-grouped
        when: "the counterparty is marked grouped: true"
        then: "match as a set: all of the counterparty's invoices and charges in the month at once, each charge equal to the sum of the invoices assigned to it; confident only when every sum matches"
        why: AliExpress, Amazon and FedEx bundle several invoices into one charge
        source: docs/runbooks/receipt-collection.md § Matching Notes
      - id: ai-threshold
        when: always
        then: confident at 0.8 or above, and only if no rejected pair is involved; otherwise unsure with the top 3 candidates and the reason
        source: src/cli/match.ts MAPPING_THRESHOLD
    precedents: []

  coverage:
    goal: Whether the linked receipts add up to the transaction.
    rules:
      - id: cov-tolerance
        status: proposed
        when: the receipts sum to the amount within 1% or CHF 1, in the transaction's currency
        then: settled
        source: proposed 2026-10-07 by Claude — confirm or replace
      - id: cov-fx
        status: proposed
        when: receipts and transaction are in different currencies
        then: compare via the original amount the bank statement prints, else at the ESTV rate of the payment date with 3% tolerance
        source: proposed 2026-10-07 by Claude — confirm or replace
    precedents: []

  queue:
    goal: >
      A person answers what the machine could not. Each answer is one of a fixed set and is stored where the next run reads it.
    answers:
      link: link the shown candidate (mapping.by = human)
      reject: this candidate is wrong (stored; never proposed again)
      noise: not a receipt (receipt.kind = noise)
      duplicate: duplicate of another receipt
      supporting: supporting document of another receipt
      paid_privately: an Auslage → a manual transaction is created and linked
      private: private, not business — no booking
      no_receipt: no receipt will exist — the reason is required and becomes the evidence (books at the 0-code)
      chase: a receipt should exist — goes to collection
    rules:
      - id: q-recurring
        status: proposed
        when: the same answer for the same vendor a second time
        then: propose a rule for this guide through new-case
        why: the third time should not reach a person
        source: proposed 2026-10-07 by Claude — confirm or replace
    precedents: []

  unmatched:
    goal: Every invoice or sales record supports a transaction or is marked.
    rules:
      - id: um-small-no-tx
        when: a small receipt (Coop, petrol, parking) with no card transaction
        then: offer paid_privately first
        why: usually Auslagen
        source: decision 2026-10-07, owner
    precedents: []
