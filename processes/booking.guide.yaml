# Knowledge for booking.flow.yaml, one section per step.
#
# An agent executing a step reads its section and decides by: rules (first match
# wins) → precedents → ask_human_when → otherwise the step's new_case exit.
# Rules with `status: open` are questions waiting for an answer: an item they
# match is parked in new-case, not booked by guesswork.
#
# Add knowledge here, not in the flow and not in chat. See processes/README.md.

process: booking

steps:
  classify:
    goal: >
      Turn one settled transaction into the journal entries that describe it, with accounts from the chart of accounts (history/), the VAT code its evidence supports, and the ESTV sell rate of the payment date for foreign amounts.
    reads:
      - the transaction (date, amount, currency, direction, description)
      - its linked receipts with their VAT facts (hasSwissVat, vatSummary, lineItems)
      - its noReceipt reason, if it has one
      - history/ (chart of accounts, 2025 reference entries) and reference/MWST-codes.txt (VAT codes)
    gates:
      - id: cls-closed
        when: the transaction is dated on or before config.closedThrough
        then: do not book; correction.flow.yaml owns it
        why: Periodensperre
        source: AGENTS.md § Period close
        test: closed-period
      - id: cls-unsettled
        when: the transaction's evidence state is not settled
        then: do not book; it stays in the Offen tab
        why: booking on missing evidence gives up input tax silently
        source: decision 2026-10-07, owner
        test: unsettled
    rules:
      - id: cls-fx
        when: the transaction is not in CHF
        then: >
          convert at the ESTV daily SELL rate of the transaction's date (the payment date), via src/accounting/fx-rates.ts; on a day without a rate, the last published one
        why: MWSTG Art. 24, cash basis
        source: docs/adr/0001-foreign-currency-conversion.md
      - id: cls-expense-vs-asset
        when: a purchase under about CHF 150
        then: expense it (6xxx), do not capitalise (1xxx)
        why: not worth an asset record
        source: AGENTS.md § VAT code rules
      - id: cls-separate-fee
        when: the payment's fee is debited as a movement of its own (a fee row that names the payment it charges for)
        then: >
          book the whole payment on its expense, with no fee line; the fee is booked once, on its own movement
        why: a fee line inside the payment books the fee twice and leaves the expense short by it; code removes such a line or refuses the answer (src/booking/separate-fee.ts)
        source: decision 2026-10-21, owner
      - id: cls-salary
        status: proposed
        when: a salary paid to an employee (the owner too, when employed by the company)
        then: "the GROSS salary on 5000: D 5000 / C bank for the net, D 5000 / C 2270 for the employee's deductions on the payslip. No VAT code"
        why: the books reconcile with the Lohnausweis and the Ausgleichskasse only on the gross
        source: AHVG Art. 14 Abs. 1; MWSTG Art. 10 Abs. 1
      - id: cls-social-insurance
        status: proposed
        when: a payment to the Ausgleichskasse, the pension fund (BVG) or the UVG/KTG insurer
        then: "the employee's withheld share clears 2270; the employer's share: 5700 AHV/IV/EO/ALV (FAK 5710), 5720 BVG, 5730 UVG, 5740 KTG. Contributions: no code; an insurer's invoice: I0 (exempt)"
        source: AHVG Art. 14 Abs. 1; BVG Art. 66 Abs. 1; MWSTG Art. 21 Abs. 2 Ziff. 18
      - id: cls-vat-payment
        status: proposed
        when: a VAT payment to (or refund from) the ESTV, for a return or a Korrekturabrechnung (0535)
        then: "D 2201 / C bank (a refund the other way), no VAT code: a code would declare the tax twice"
        source: MWSTG Art. 86 Abs. 1
      - id: cls-owner-account
        status: proposed
        when: an owner's loan or deposit, its repayment, or the refund of the owner's outlays
        then: "2451 Kontokorrent Gesellschafter (GmbH, AG) or 2850 Privat (Einzelfirma), no VAT code; the outlays carry their codes on their own entries"
        source: MWSTG Art. 18 Abs. 2 lit. e
      - id: cls-direct-tax
        status: proposed
        when: a payment of direct taxes (Staats- und Gemeindesteuern, direkte Bundessteuer)
        then: "GmbH, AG: 8900, no VAT code. Einzelfirma: the owner's income tax is private, 2850"
        source: OR 959b Abs. 2 Ziff. 10; MWSTG Art. 18 Abs. 1
      - id: cls-flag-low-confidence
        status: proposed
        when: the accounts or the code are a guess the evidence does not support
        then: book nothing; flag it with the reason, so it reaches manual_entry
        why: a flagged item costs a minute; a wrong code costs a correction later
        source: proposed 2026-10-07 by Claude — confirm or replace
    ask_human_when:
      - the amount is above CHF 1000 and the account is not one used for this vendor before
    precedents: []

  shape:
    goal: Decide whether one journal entry describes the transaction, or one per receipt.
    reads: [ the transaction, its linked receipts ]
    rules:
      - id: shp-several-invoices
        when: "two or more linked receipts are invoices with their own amounts (a counterparty marked grouped: true)"
        then: needs_split
        why: AliExpress, Amazon and FedEx group several invoices into one payment
        source: AGENTS.md § Special cases
      - id: shp-zollrechnung
        when: a courier's Zollrechnung (customs invoice)
        then: needs_split into Zölle (4020), ausl. MWST (4030), Zahlungsabwicklungsspesen / Vorlageprovision (4040)
        why: three different things on one invoice (FedEx, DHL, Post all issue them)
        source: docs/runbooks/receipt-collection.md § FedEx, § DHL Express
      - id: shp-one
        when: otherwise
        then: one_entry
        source: definition
    precedents: []

  split:
    goal: One entry per linked invoice or order, summing to the transaction amount.
    reads: [ the linked receipts' amounts, VAT facts and line items ]
    rules:
      - id: spl-sum
        status: proposed
        when: always
        then: the entries sum to the transaction amount in its currency; a difference (rounding, FX, a platform's deduction) is its own entry, never spread across the others
        source: proposed 2026-10-07 by Claude — confirm or replace
      - id: spl-skonto
        when: the bank paid less than the invoice because a discount (Skonto) was taken at payment
        then: "book what the bank paid: one entry for the payment amount on the expense account with the receipt's VAT code (an invoice less 2 % Skonto: 4400 / bank, M81, on the 98 % the bank paid). Never a separate Skonto row with an empty account; the classifier refuses entries that do not move the bank by the payment amount"
        why: "effective method on cash basis: the discount reduces the consideration, so the expense and the input tax are those of the amount paid (MWSTG Art. 41 Abs. 1); a one-leg Skonto row left the balance sheet off by the discount (persona test misreads, 2026-10-15)"
        source: MWSTG Art. 41 Abs. 1; src/booking/classify.ts paymentRefusal
    precedents: []

  side:
    goal: Purchase or sale decides which evidence sets the VAT code.
    rules:
      - id: sid-direction
        when: direction is DBIT and it is not a refund of a sale
        then: a_purchase
        source: definition
      - id: sid-refund
        when: a CRDT that reverses an earlier purchase (vendor refund)
        then: a_purchase, with the original purchase's code inverted (-I81, -I0)
        why: a refund inverts the original VAT code
        source: AGENTS.md § VAT code rules
      - id: sid-credit-note-names-invoice
        when: a supplier's credit note without its own document whose payment text names an invoice already booked
        then: >
          the invoice's code with the minus (-M81 for an M81 invoice, -I81 for I81), in code
          (src/accounting/credit-note-code.ts creditNoteCodeOf); the booking's reason names the invoice. A credit
          note that names nothing booked keeps the receipt rule (pv-no-receipt, with the minus)
        why: the credit takes back part of the input tax claimed on that invoice, whose receipt shows the tax
        source: decision 2026-10-16, owner
      - id: sid-sale-refund
        status: proposed
        when: a DBIT that pays back all or part of an earlier sale to a customer
        then: a_sale, on the sale's revenue account, with the original sale's code inverted (-V81, -V0)
        why: a reduced consideration reduces the tax owed, in the quarter the money goes back
        source: MWSTG Art. 41 Abs. 1; AGENTS.md § Special cases (-V81)
      - id: sid-sale
        when: CRDT from a sales platform's payout or another customer payment
        then: a_sale
        source: definition
    precedents: []

  purchase_vat:
    goal: The input-tax code the receipt itself supports.
    reads: [ receipt.hasSwissVat, receipt.vatSummary, receipt.vatId, the receipt text ]
    gates:
      - id: pv-no-receipt
        when: no linked receipt (noReceipt reason, or exempt by rule)
        then: zero_rated — I0, or M0 for goods
        why: no receipt, no deduction
        source: AGENTS.md § VAT code rules
        test: no-receipt
      - id: pv-che-but-zero
        when: the receipt shows a CHE number but the rate charged is 0%
        then: zero_rated
        why: a UID is not proof that MWST was charged (thomann.de)
        source: docs/runbooks/receipt-collection.md § Trap
    rules:
      - id: pv-prefix-from-account
        when: always
        then: "the letter follows the account, not the vendor: 4xxx (material, goods, their freight and customs) → M; investments and operating costs (1xxx assets, 5xxx–6xxx) → I"
        why: FedEx 4xxx entries were booked I0 and M0 for the same kind of position
        source: src/llm/prompts.ts CLASSIFY_INSTRUCTIONS § 7a
      - id: pv-charged
        when: the receipt shows Swiss MWST with an explicit amount at 8.1%
        then: >
          charged — M81 for goods and material, I81 for investments and operating costs. In code
          (src/booking/purchase-vat.ts) on the model's one coded purchase line when the receipts show that one
          rate on its whole amount; a receipt that taxes part of the payment stays the model's to split
        source: AGENTS.md § VAT code rules
      - id: pv-import-vat-evv
        when: a courier bill passes on Swiss IMPORT VAT for goods imported for the company, and the BAZG Veranlagungsverfügung MWST (eVV) names the company as importer
        then: "book the import VAT on 4030 without code, then a single-leg entry -/4030 with M81-2 for the eVV's MWST amount → Ziffer 400 (MWSTG Art. 28 Abs. 1 lit. c). File the eVV PDF and link it to the payment. Without the eVV: M0, and get it (how: processes/authorities/bazg.yaml#evv-download)"
        why: "the courier bill is not proof of import VAT; the eVV is (UPS bill page 3 says so)"
        source: owner decision 2026-10-08
      - id: pv-bezugsteuer
        when: a SERVICE (advertising, consulting, software/online service) from a supplier based abroad that is not in the Swiss VAT register and charges no Swiss MWST
        then: "B81-1 on the expense entry (amount = the net paid): Ziffer 383 declares 8.1%, and the same entry deducts it again at 405 — net 0 for business use (on the net tax rate method 383 only, no deduction). From the first franc: NO CHF 10,000 threshold for us. In code (src/accounting/acquisition-tax.ts): the model reads the line's supply (service, goods, exempt) and the supplier's country; code books B81-1 when every linked receipt was read and shows neither Swiss MWST nor a CHE number, and takes the model's B81 back when a fact says otherwise"
        why: "MWSTG Art. 45 Abs. 1 lit. a (foreign service, place = recipient's seat per Art. 8 Abs. 1) + Abs. 2 lit. a (a VAT-registered recipient owes it, no threshold — the CHF 10,000 of lit. b is only for recipients NOT registered) + Art. 28 Abs. 1 lit. b (deductible as input tax). eCH-0217 acquisitionTax, always net. Not subject: goods (import VAT instead), services exempt under Art. 21 such as payment processing / Stripe fees (Art. 45a), and foreign suppliers registered in CH that invoice 8.1% themselves (Shopify, Google Commerce, OpenAI → I81)"
        source: owner decision 2026-10-08
      - id: pv-otherwise
        when: otherwise
        then: >
          zero_rated. In code (src/booking/purchase-vat.ts): the model's rate code falls to the zero code of its
          account when no linked purchase document shows Swiss VAT and every one was read (a receipt not read yet
          decides nothing)
        source: AGENTS.md § VAT code rules
    ask_human_when:
      - the receipt shows a reduced rate (2.6%) or a special rate (3.8%)
    precedents: []

  sale_vat:
    goal: The output-tax code, from the order — the payout does not know the customer.
    reads: [ "the order page's Taxes line", the delivery country ]
    rules:
      - id: sv-service-abroad
        status: proposed
        when: the payment of the company's own invoice for a SERVICE (not goods) to a recipient with its seat abroad
        then: >
          V0-E: no Swiss tax, declared in Ziffer 200 and deducted again in Ziffer 221 (Leistungen im Ausland). The invoice says the place of supply is the recipient's ('Leistungsort beim Empfänger'). Not V0 (export, Ziffer 220), which is for goods. A service the law places elsewhere (real estate, passenger transport, restaurant, events: Art. 8 Abs. 2) → new_case
        why: the place of a service is the recipient's seat, so Swiss MWST does not apply
        source: MWSTG Art. 8 Abs. 1; ESTV form 0550 Ziffer 221
      - id: sv-order-tax
        when: always
        then: "the code follows the tax the order or invoice itself states: Swiss 8.1% → swiss (V81); no Swiss tax and delivered abroad → export (V0) with the country as the recorded reason; anything else → new_case"
        source: booking.flow.yaml sale_vat expect
      - id: sv-payout-orders
        when: a payment provider's payout with the order documents it holds linked (each names the payout by date and amount)
        then: >
          in code (src/booking/payout-orders.ts), by the payout rule's accounts (its `fees`) or the firm's payout answer:
          each order's gross on the sales account, delivered in the VAT territory at the firm's sale code, abroad at
          V0; a refund deducted from the payout with the code's minus; what the provider kept as its fees. The lines
          add up to the payout. Orders that do not add up to it, or an order whose tax line disagrees with its
          delivery (sv-order-tax), book nothing: the payout waits for the person, as without its documents. The
          match step links the documents to the one payout they add up to (src/intake/order-links.ts)
        why: one payout mixes domestic orders and exports, which no single code fits (issue #26)
        source: decision 2026-10-22, owner
      - id: sv-no-invoice
        when: a customer payment with no invoice or order linked
        then: >
          the app's proposal, in code (src/accounting/sales-without-vat.ts saleCodeOf): the books' currency from an IBAN of the
          VAT territory (Switzerland and Liechtenstein, modules/ch/invoicing.yaml territory) or with no IBAN named → V81;
          a foreign currency or a foreign IBAN → V0. Never V0 for want of a paper. The owner confirms it once (the
          app's question under Aufgaben), and her answer or her correction becomes a rule for the payer
        why: "the output tax is owed on a domestic supply whether or not an invoice exists (MWSTG Art. 18); «no receipt, zero code» is the input-tax rule"
        source: decision 2026-10-16, owner
      - id: sv-card-terminal
        when: a payout of a card terminal or payment provider (SumUp, Payrexx, Worldline, TWINT)
        then: >
          the card sales at the company's own place of business are domestic sales: the GROSS sales on the revenue
          account with V81 (another rate only when the report shows it), a refund with -V81, the provider's fees as
          their own row on the bank-fee account with I0 (payment processing is exempt, Art. 21: no Bezugsteuer).
          Without the payout report: the whole payout with V81 until the report is linked
        why: the payout report rarely shows MWST, yet the sales were made in Switzerland
        source: proposed 2026-10-16 by Claude — confirm or replace
      - id: sv-place-abroad
        when: the sale's invoice shows no Swiss MWST and names the place of supply abroad (modules/ch/invoicing.yaml placeAbroad)
        then: V0-E (Ziffer 221), in code; not V0, which is the export of goods
        source: MWSTG Art. 8 Abs. 1
      - id: sv-unregistered
        when: the books are not registered for VAT
        then: no VAT code on any sale
        source: MWSTG Art. 10
    ask_human_when:
      - a sale with no order or invoice of its own (a private sale of equipment)
    precedents: []

  private:
    goal: Whether part of the expense is private, so the input tax on that part is given back.
    rules:
      - id: prv-known
        when: the item or vendor is listed as partly private in precedents
        then: partly_private, at the recorded share
        source: processes/README.md § How a step decides
    ask_human_when:
      - devices or subscriptions a person could also use privately, not yet in precedents
    precedents: []

  eigenverbrauch:
    goal: Give back the input tax on the private share.
    rules:
      - id: eig-entry
        when: always
        then: "D 2451 / C <expense account>, VAT code K81-B (Ziffer 415), matched by entry id"
        source: reference/MWST-codes.txt (K81-B, Ziffer 415)
    precedents: []

  fix_codes:
    goal: Make a booked code agree with the receipt facts the audit reports against.
    rules:
      - id: fix-receipt-wins
        when: the audit says code and receipt facts disagree
        then: the receipt wins; rebook through the step's rules above, not by hand
        source: AGENTS.md § VAT code rules
    ask_human_when:
      - the receipt facts themselves look wrong (re-run extract-vat first)
    precedents: []

  find_imbalance:
    goal: Find why the books do not balance, without plugging the difference.
    rules:
      - id: imb-duplicates
        when: the difference equals one transaction amount
        then: look for a transaction booked twice (re-imported ref, manual + bank)
        source: definition
    precedents: []

  manual_entry:
    goal: Book what classify flagged, using the flag's reason.
    rules:
      - id: man-record
        status: proposed
        when: always
        then: >
          if the reason will recur (a vendor, an account, a pattern), it goes through new-case so it becomes a rule — a manual entry that teaches nothing will be manual again next quarter
        source: proposed 2026-10-07 by Claude — confirm or replace
    precedents: []
