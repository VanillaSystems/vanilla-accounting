# Wise is a bank: card charges and transfers reach the books through its
# statements (camt053 and the monthly PDF). What is true of Wise for every
# company that banks with it is here; the accounts are the company's binding
# (knowledge/suppliers/wise.yaml).

id: wise
name: Wise
match:
  tx: [ "wise charges for" ]

steps:
  booking.guide.yaml#classify:
    rules:
      - id: wise-card-fee
        when: "a Wise card charge whose text names a fee («(fee: … EUR)»)"
        then: >
          the fee is not part of the charge: Wise debits it as a movement of its own
          (FEE-CARD-…, «Wise Charges for: CARD-…»), and the charge's amount is without it.
          Book the whole charge on its expense, with no fee line (cls-separate-fee); the fee
          is booked once, on its own movement, on the bank-fee account without VAT (I0)
        why: the fee named in the charge's text was split out of the charge and then booked again on its own movement
        source: decision 2026-10-21, owner
      - id: wise-split
        when: a Wise card charge took money from several currency accounts
        then: >
          one entry per debited account leg; the charge currency first, then other foreign currencies, CHF last
        why: that is how Wise funds a card payment
        source: AGENTS.md § Special cases
    precedents: []

  booking.guide.yaml#find_imbalance:
    rules:
      - id: wise-fx-legs
        when: the difference sits on a Wise foreign-currency account
        then: look for a currency-split leg booked once instead of per account
        source: AGENTS.md § Special cases
    precedents: []

  evidence.guide.yaml#rules:
    rules:
      - id: wise-original-amount
        when: a receipt in a currency other than the Wise account that paid it
        then: match on the original-currency amount shown on the Wise monthly statement
        why: that amount appears nowhere else
        source: AGENTS.md § Special cases
      - id: wise-transfer-reference
        when: a receipt prints the reference of a Wise transfer
        then: the transfer's reference is on the Wise monthly statement PDF, not in the Wise camt053; the table of that PDF (the AI's read, or entered by hand on the statement) puts it on the payment (#243)
        source: AGENTS.md § Special cases
    precedents: []
