# Vendor facts about Coop Pronto, true for every customer. A company's accounts
# and booking rules for it live in its workspace (knowledge/suppliers/coop-pronto.yaml).
#
# Not matched by UID: CHE-116.311.185 is the Coop group's and is also printed
# on other Coop group retailers' receipts (the lint refuses it). CHE-312.150.257 is Coop Pronto's own.

id: coop-pronto
name: Coop Pronto
match:
  tx: [ "coop pronto" ]
  uid: [ "CHE-312.150.257" ]
  file: [ '^\d{8}-coop-pronto' ]

facts:
  - id: coop-pronto-vat
    fact: a Swiss retailer of the Coop group, registered for Swiss VAT; its receipts show MWST, mostly at the normal rate of 8.1 % (fuel, shop goods), food at the reduced rate of 2.6 %
    source: MWSTG Art. 25
