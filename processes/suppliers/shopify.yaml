# Shopify is both a supplier (app and payment fees) and the sales platform.
# Its payouts may arrive as "Received money from Stripe … with
# reference Shopify …": the bank names Stripe, not Shopify. Code takes a payout
# whose reference begins with a provider's tx word ("shopify") for that provider's
# when the payer is no business of the books and the bank names no payer or one of
# the provider's `processors` (src/booking/providers.ts providerOfMoneyIn): a
# customer's own transfer «Shopify Bestellung 1001» is no payout. The app file does
# not route Stripe here, because a firm that takes Stripe payments of its own would
# see them booked as Shopify's. When the bank names neither and a sales report finds
# no payout of Shopify among the bank's payments of its days, the report waits in
# its row («Trotzdem übernehmen» books it); the payout's name belongs into the
# company's file: knowledge/suppliers/shopify.yaml
#   match: { tx: [ "<the payer's name as the bank shows it>" ] }
# and `provider.account` there names the bank account Shopify pays into, the only
# one that check then looks at.
# As a payment provider (#203) its payout settles its clearing account: code books
# it bank / clearing account without VAT; the sales come from its order export and
# the fees from its payments export, both CSV (src/booking/sales-report.ts). The
# company's file names the accounts and its cut-over day (from it on, nothing before it changes):
# provider: { clearing, since, revenue, fees: { account, vat }, foreignTax }.
# `foreignTax` is the account for the foreign VAT an export order shows in its Taxes
# column (IOSS, for example): the report books the net at V0 onto revenue and the tax onto it
# without a code; without it such an order waits for the person (#206).

id: shopify
name: Shopify
match:
  tx: [ "shopify" ]
  uid: [ "CHE-153.004.184" ]
  file: [ '^\d{8}[-_]shopify' ]

provider:
  reports:
    # Shopify Admin › Bestellungen › Exportieren (CSV): one row per line of an order, the order's figures on its first.
    sales:
      order: Name
      date: Paid at
      ordered: Created at
      shipTo: Shipping Country
      gross: Total
      tax: Taxes
      refunded: Refunded Amount
      currency: Currency
      gateway: Payment Method
    # Shopify Admin › Finanzen › Shopify Payments › Transaktionen exportieren (CSV): one row per charge with the fee kept.
    fees:
      date: Transaction Date
      fee: Fee
      order: Order
      currency: Currency
  # The orders Shopify Payments collected: only they are paid out through Shopify. PayPal, manual
  # payment (bank transfer, cash on delivery), a gift card and the test gateway (Bogus) are not, and
  # are never booked onto the clearing account; the row counts them.
  gateways: [ "Shopify Payments" ]
  # Stripe pays Shopify Payments' payouts under its own name (see the top of this file).
  processors: [ "stripe" ]
  payoutDays: 7

facts:
  - id: payout-settles
    fact: >
      A Shopify Payments payout pays out what Shopify collected for the shop's orders, less its fees and the
      refunds it deducted, within days. It is a settlement of what Shopify holds for the shop, not a sale: code
      books it bank / the company's clearing account, and the order export books each order's sale onto that
      account (src/booking/sales-report.ts). An order page names its order by number: code links it to that
      order's sale as proof of the delivery, never to the payout
    source: docs/runbooks/receipt-collection.md § Shopify order pages

steps:
  receipt-collection.guide.yaml#scrape:
    rules:
      - id: col-shopify
        when: Shopify
        then: three scrapes — order pages, monthly billing statements, Payments invoices ("Tax forms")
        procedure: docs/runbooks/receipt-collection.md § Shopify
        source: AGENTS.md § Shopify billing
    precedents: []

  receipt-intake.guide.yaml#kind:
    rules:
      - id: kind-shopify-order
        when: a Shopify order page
        then: sales_record
        source: docs/runbooks/receipt-collection.md § Shopify order pages
    precedents: []

  evidence.guide.yaml#rules:
    rules:
      - id: ev-shopify-order
        when: a sales-record order page
        then: proof of the order's delivery country; code links it to the order's sale booked from the order export, never to the payout (shopify#payout-settles)
        source: decision 2026-10-27, owner
    precedents: []

  booking.guide.yaml#purchase_vat:
    rules:
      - id: pv-shopify-fees
        when: Webshop Gebühren
        then: >
          the fees come onto the clearing account from the payments export at the company's fee code (provider.fees: I0 while no bill shows Shopify's Swiss VAT); the month's Vorsteuer is one single-leg entry — empty Soll / C 6580 / M81-2, amount = fees × 8.1 / 108.1
        why: the proof is the monthly Shopify bill, not the payout
        apply: { inputTax: none, direction: in }
        source: docs/runbooks/booking-patterns.md § Shopify
    precedents: []

  booking.guide.yaml#sale_vat:
    rules:
      - id: sv-delivery-decides
        when: always
        then: the DELIVERY (shipping) address decides Swiss or export — never the billing address. If the order’s Taxes line disagrees with the delivery country (Swiss MwSt on a delivery abroad, or no Swiss MwSt on a delivery to Switzerland), new_case. A foreign Taxes line on a delivery abroad is no disagreement (sv-eu-vat)
        why: "an order billed to an address abroad but delivered in Switzerland carries Swiss VAT, correctly"
        source: decision 2026-10-07, owner
      - id: sv-swiss
        when: "the order page's Taxes line reads MwSt 8.1% (Swiss delivery)"
        then: swiss — V81
        source: docs/runbooks/receipt-collection.md § Shopify order pages
      - id: sv-export
        when: the order page has no Taxes line (rest of world)
        then: export — V0, with the delivery country as the recorded reason
        source: docs/runbooks/receipt-collection.md § Shopify order pages
      - id: sv-eu-vat
        when: "the Taxes line names a foreign VAT on a delivery abroad (e.g. DE MwSt 19%, GB VAT 20%)"
        then: >
          export — V0 on the net (the gross less the foreign tax). The foreign tax is the shop's own debt to the destination state (IOSS on a consignment into the EU): the sales report books it apart, onto the company's account named by provider.foreignTax (a balance-sheet account the IOSS return is paid from), without a code, and leaves it out of the Swiss return; a refund the same reversed, the tax in the sale's share. Without that account the order waits for the person, never booked gross at V0. Shopify Payments collects that tax in the price and pays it out with the order (what it keeps is its fee of a few percent): the shop, not Shopify, owes it abroad. What the shop pays abroad for it under DDP (the courier's import VAT) is its own expense entry without Swiss input tax.
        why: "an export is exempt (MWSTG Art. 23); a foreign VAT is not Swiss turnover tax, so it neither holds the order nor makes it taxable in Switzerland. A strict reading of Art. 24 Abs. 1 may count it in Ziffer 200 and deduct it in 220, with no tax effect either way; that is a firm's choice to confirm with its fiduciary, and the app keeps it out of the return (owner decision 2026-10-27, booking.guide.yaml#sale_vat sv-order-tax)"
        source: MWSTG Art. 23 Abs. 2 Ziff. 1, Art. 24 Abs. 1; decision 2026-10-22, owner; issue #206, owner decision 2026-10-27 (the foreign tax apart, out of the return)
    precedents: []
