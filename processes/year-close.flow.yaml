# Closing a year and opening the next one.
#
# npm run year:close computes every item (preconditions, Kursdifferenz, VAT
# check, guided year-end entries, closing balance sheet), books the Kursdifferenz
# and closes the year; npm run year:open opens the next one from the closed books.
# The owner's version: docs/year-end.md.

id: year-close
name: Close the year
noun: year
discharge: >
  the year is closed, balanced and signed off, and the new year opens with
  carried-forward balances where Aktiven equal Passiven

phases: [revalue, close, open]

steps:
  - id: q4_filed
    name: The year's last quarter is filed, not closed
    note: npm run seal refuses Q4; year:close closes and seals it after the 31.12. entries
    kind: start
    phase: revalue
    duration: day 0

  - id: revalue
    name: Revalue the foreign-currency accounts at the 31.12 rate
    with: { guide: year-close.guide.yaml#revalue }
    icon: calculator
    uses: npm:year:close
    note: "Kursdifferenz: native balance × ESTV rate of 31.12. against the CHF book value; --dry-run previews"
    needs: [q4_filed]
    phase: revalue
    duration: 1h

  - id: book_diff
    name: Book the exchange difference and the year-end entries
    kind: human
    note: year:close books the Kursdifferenz to 6960 (replacing its own entry on a rerun); the guided entries in the Jahresabschluss tab, each booked or marked not needed
    needs: [revalue]
    phase: revalue
    duration: 20m

  - id: reports
    name: Produce the balance sheet and the income statement
    icon: file-output
    note: "the Jahresabschluss tab's closing balance sheet (VAT split off by code), and the tabs Bilanz, Erfolgsrechnung, Kontenblätter"
    needs: [book_diff, find.rebook]
    phase: close
    duration: 5m

  - id: balanced
    name: Do Aktiven equal Passiven?
    outcomes: [balanced, differs]
    needs: [reports]
    phase: close

  - id: find
    name: Find the difference — do not absorb it
    with: { guide: year-close.guide.yaml#find }
    kind: human
    outcomes: [rebook]
    needs: [balanced.differs]
    phase: close
    duration: 1 – 8h

  - id: signoff
    name: The accountant signs off the annual accounts
    facts: [ estv#finalisation, steuerverwaltung#tax-return, ausgleichskasse#salary-report ]
    with: { guide: year-close.guide.yaml#signoff }
    icon: signature
    kind: human
    outcomes: [signed, questions]
    needs: [balanced.balanced, answer.answered]
    phase: close
    duration: 2 – 6 weeks

  - id: answer
    name: Answer the accountant
    with: { guide: year-close.guide.yaml#answer }
    kind: human
    outcomes: [answered]
    needs: [signoff.questions]
    phase: close
    duration: days

  - id: banana_close
    name: Close the year (npm run year:close), or in Banana Accounting
    kind: human
    note: "year:close: closedThrough → 31.12., Q4 sealed, the close recorded and committed; Banana produces buchhaltung-<year>.Konten.xml"
    needs: [signoff.signed]
    phase: close
    duration: 1h

  - id: opening
    name: Derive the new year's opening balances
    produces: openingBalances
    expect: >
      Aktiven equal Passiven, and any difference is explained rather than
      plugged into a rounding account.
    icon: import
    uses: npm:year:open
    note: balance-sheet accounts carry forward, P&L accounts reset to zero, the result to 2970; from Banana instead npm run import-opening
    outcomes: [ties_out, differs]
    needs: [banana_close, explain.resolved]
    phase: open
    duration: 5m

  - id: explain
    name: Explain the difference, do not plug it
    with: { guide: year-close.guide.yaml#explain }
    kind: human
    note: a P&L cross-check gap from year-end FX is the usual cause
    outcomes: [resolved]
    needs: [opening.differs]
    phase: open
    duration: 1 – 4h

  - id: rates
    name: Fetch the new year's ESTV rates
    icon: download
    uses: npm:fetch-rates
    needs: [opening.ties_out]
    phase: open
    duration: 1m

  - id: opened
    name: The new year is open
    kind: end
    needs: [rates]
    phase: open
    duration: done
