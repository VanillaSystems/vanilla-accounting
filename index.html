<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Vanilla Accounting</title>
  </head>
  <body>
    <script>
      // The stored theme and zoom before the first paint (src/app/shell/prefs.ts keeps them).
      (function() {
        var t = null, z = 1;
        try { t = localStorage.getItem('theme'); z = Number(localStorage.getItem('zoom')) || 1; } catch (e) {}
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        if (z > 0 && z <= 3 && z !== 1) { root.style.zoom = String(z); root.style.setProperty('--z', String(z)); }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
