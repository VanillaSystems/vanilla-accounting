ziffern: {}
payable: 0
rules: [ev-exempt-bank-fees]
law:
  - MWSTG Art. 21 Abs. 2 Ziff. 19 (banking and payment services are exempt)
why: >
  Banking services are exempt, so there is no MWST to deduct and the line carries no VAT code, as
  code books the bank's own fee row (ev-exempt-bank-fees). No receipt is needed beyond the statement.
pitfalls:
  - Card foreign-currency fees are bank fees too, not part of the purchase they came with.
