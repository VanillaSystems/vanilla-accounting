id: webshop-payout-swiss
rank: 27
segment: goods
title: Webshop order to a Swiss customer, paid out by the payment provider
applies: >
  A webshop sells goods to a customer in Switzerland with 8.1% MWST. The payment provider keeps
  its fee and pays out the rest, so one payout carries the sale, the fee and the transfer.
receipt:
  swissVat: true
  text: |
    Webshop Bestellung #1201, M. Muster, Bern, Schweiz
    Artikel total CHF 1081.00 inkl. MWST 8.1% 81.00
    Gebühren Zahlungsanbieter 33.70, Auszahlung 1047.30
transaction:
  amount: 1047.3
  currency: CHF
  direction: CRDT
  description: Zahlungsanbieter Auszahlung
  account: "1020"
date: 2026-08-17
lines:
  - { debit: "1093", credit: "3200", amount: 1081, vatCode: V81, description: "Webshop Bestellung #1201, M. Muster, Schweiz" }
  - { debit: "6580", credit: "1093", amount: 33.7, vatCode: I0, description: "Webshop Gebühren #1201" }
  - { debit: "1020", credit: "1093", amount: 1047.3, description: "Zahlungsanbieter, Auszahlung #1201" }
ziffern: { "200": 1081, "299": 1081, "303": 1081, "399": 81 }
payable: 81
rules: [sv-order-tax]
law:
  - MWSTG Art. 25 Abs. 1 (8.1%) and Art. 40 Abs. 1 lit. b (cash basis)
why: >
  The sale is the full order amount at V81 on the clearing account, the fee leaves it as an
  expense, and the payout empties it into the bank. The order states the tax, not the payout.
pitfalls:
  - Booking only the payout as revenue hides the fee and understates the turnover.
signals:
  kind: platform
  keywords: [bestellung, payout, auszahlung, stripe, shopify]
