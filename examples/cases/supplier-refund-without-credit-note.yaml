id: supplier-refund-without-credit-note
rank: 26
segment: services
title: Refund of a purchase without a credit note
applies: >
  A supplier pays money back for a purchase booked earlier (a returned item, a cancelled order)
  and sends no credit note of its own. The purchase, Bürohaus Meier's invoice of 04.08.2026 over
  CHF 432.40, was booked I81 with its receipt; CHF 216.20 of it comes back.
receipt: none
transaction:
  amount: 216.2
  currency: CHF
  direction: CRDT
  description: Bürohaus Meier Rückerstattung
  account: "1020"
date: 2026-08-20
lines:
  - { debit: "1020", credit: "6500", amount: 216.2, vatCode: -I81, description: "Bürohaus Meier, Rückerstattung zum Einkauf vom 04.08.2026" }
ziffern: { "405": -16.2, "479": -16.2 }
payable: 16.2
rules: [sid-refund]
law:
  - MWSTG Art. 41 Abs. 2 (a corrected consideration paid corrects the input tax when the correction is booked or paid)
why: >
  The refund takes back the input tax claimed on the purchase it refunds: the purchase's code with
  the minus (-I81), on the purchase's account, on the refund's own date. A part refunded is taken
  back at the purchase's rate. A purchase booked I0 is refunded -I0. The app finds the purchase
  from the same supplier, no later, for at least the amount (the refund's text naming its invoice
  picks it among several); when it finds none, or more than one could be it, it books the zero code
  with the minus and says so, and the person changes it by hand.
pitfalls:
  - Not -I0 because there is no credit note. No document is needed to take input tax back, only to claim it.
  - Never change the purchase itself, least of all in a filed quarter. The refund is booked in the open period, on its own date, without corrects.
  - Not V81. The money is no sale.
signals:
  kind: supplier-ch
  keywords: [rückerstattung, rückzahlung, refund, retoure, storno]
