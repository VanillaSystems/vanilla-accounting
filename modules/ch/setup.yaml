# The accounts a new workspace gets from the setup's answers (src/workspace/scaffold.ts), on the
# chart of accounts.yaml.

bankAccounts:
  # The chart's bank account per currency; a further one takes the next free number of its range.
  byCurrency: { CHF: "1020", EUR: "1021", USD: "1022" }
  nextFree: { bank: 1023, card: 2101 }
  # Where an added account goes, by the class of its number.
  byClass:
    "1": { type: asset, line: fluessige-mittel }
    otherwise: { type: liability, line: kurzfristig-verzinslich }

# The owner's private payments: the private account of an Einzelfirma, else a current account.
owner:
  Einzelfirma: { account: "2850", label: Privat }
  otherwise: { account: "2451", label: Kontokorrent }

# The bank's own fee row of a statement (its fee for the account itself, of no other party) is booked
# by code on this account, without a VAT code: banking services are exempt without credit (MWSTG
# Art. 21 Abs. 2 Ziff. 19), so there is no input tax (src/booking/bank-fee.ts, #359). A company rule
# that matches the row still decides it; a chart without this account leaves the row to the person.
bankCharges: { account: "6940" }

# The wage account: a wage is no supply, so a booking on it carries no VAT code (MWSTG Art. 10
# Abs. 1; processes/booking.guide.yaml cls-salary). A rule for the wages (src/saving/wage-rule.ts)
# books here, and a rule on it asks no rate (src/booking/rule-vat.ts); the hand form proposes it for
# a wage without a booking of hers to follow (#382). Books that carry wages with their deductions
# (on `deductions`) get no proposal: the payslip's lines are the person's to book. `contributions`: the
# employer's social insurance contributions (AHV/IV/EO/ALV, FAK, BVG), no supply either (cls-social-insurance):
# no VAT code on them; an insurer's premium (UVG, KTG) is an exempt supply and keeps its zero code.
# `payees`: the business files that collect contributions together with the employees' share withheld
# from the wages (the compensation fund): a payment to one is told what `deductions` holds on its day,
# as is a payment to a business booked on these accounts before (src/booking/withheld.ts, #426).
# `shared`: the contribution accounts the employees share in (AHV/IV/EO/ALV, BVG), not FAK (5710),
# which the employer pays alone.
# `withholds`: the words a payslip names each deduction by, per kind. The kinds are keyed by a business file's
# id (`ausgleichskasse`, processes/authorities/): a payment routed to that business clears what its kind's rows
# withheld; a key no business file has (pension, accident, …) only tells those rows apart. A company's own file of
# its fund under another id is not read so: its payment gets the open item's «Arbeitnehmeranteil abziehen» instead.
# When every payslip behind `deductions` reads so and its rows add up to what its wage put there, code knows
# the employees' share a payment to that business clears (#476).
wages:
  account: "5000"
  deductions: "2270"
  contributions: ["5700", "5710", "5720"]
  payees: [ausgleichskasse]
  shared: ["5700", "5720"]
  withholds:
    ausgleichskasse: [AHV, IV, EO, ALV, AVS, APG, AC, IPG, AD]
    pension: [BVG, Pensionskasse, LPP, "caisse de pension", "cassa pensione"]
    accident: [UVG, NBU, NBUV, LAA, AANP, AINF]
    sickness: [KTG, Krankentaggeld, IJM, IGM]
    tax: [Quellensteuer, "impôt à la source", "imposta alla fonte"]
  # The account a kind's deductions are owed on until its collector is paid, where it is not `deductions`:
  # the withholding tax (Quellensteuer) is owed to the canton on 2279 (DBG Art. 88), not to a fund
  # (docs/specs/payroll.md §10.2 A4). A business file that says `collects: [tax]` clears it.
  withholdsTo: { tax: "2279" }
  # The employer's own contribution account of a kind (src/booking/withheld.ts contributionLines): where code
  # books what a payment to its collector pays beyond the employees' share when no model splits the bill and
  # no earlier payment to the same collector says where it goes. The family allowances (5710) are billed with
  # the compensation fund's contributions; a model or the person books them apart.
  employer: { ausgleichskasse: "5700", pension: "5720" }
  # What the collector of a kind leaves the employer of what was withheld: the withholding tax's collection
  # commission (Bezugsprovision, DBG Art. 88 Abs. 4: 1 to 2 %, a canton at its own rate). A payment that
  # clears the tax owed less at most `upTo` percent of it books the rest here, as a lower administration
  # cost; a payment short by more is no commission, and code books only what it pays.
  commission: { tax: { account: "6500", upTo: 5 } }
  # How a payslip another program or a fiduciary issued names its figures (src/booking/payslip.ts, docs/specs/
  # payroll.md §10.2 A2), in de/fr/it/en; the deductions by `withholds` above. The gross, the net paid out,
  # the family allowances paid with the wage (the fund pays them back on its bill: booked onto `deductions`,
  # §16 decision 10) and the expenses (each kind on its account; the flat ones first, «Pauschalspesen» is no
  # «Spesen»). A payslip reads when gross − deductions + allowances + expenses is its net to the cent.
  payslip:
    gross: [Bruttolohn, Bruttogehalt, Bruttosalär, Total brutto, Lohn brutto, Salaire brut, Salario lordo, Retribuzione lorda, Gross salary, Gross pay, Gross wage]
    net: [Nettolohn, Nettogehalt, Nettosalär, Auszahlung, Auszahlungsbetrag, Salaire net, Montant versé, Salario netto, Importo versato, Net salary, Net pay, Net wage]
    allowances: [Kinderzulage, Kinderzulagen, Familienzulage, Familienzulagen, Ausbildungszulage, Ausbildungszulagen, Allocation familiale, Allocations familiales, Allocation pour enfant, Allocations pour enfants, Assegno familiare, Assegni familiari, Assegno per i figli, Family allowance, Family allowances, Child allowance]
    expenses:
      - { account: "5830", words: [Pauschalspesen, Spesenpauschale, Spesen pauschal, Frais forfaitaires, Spese forfettarie, Flat expenses, Expense allowance] }
      - { account: "5820", words: [Spesen, Spesenersatz, Spesenvergütung, Spesenentschädigung, Frais effectifs, Rimborso spese, Expenses, Expense refund] }


# What the setup's «private use» names, by the account its costs are booked on: a share of it the person
# named in the setup («öppe d Hälfti» of the phone) is offered as a rule with a private share on the first
# payment booked there (src/saving/share-rule.ts, #402).
privateUse: { phone: "6510", car: "6200" }

# Accounts an answer adds to the chart.
answers:
  payouts:
    accounts: ["1093", "6580"]
    # A payout report's split when no rule names the provider (src/booking/classify.ts payoutDefault): the gross
    # sales on the revenue account of what the firm sells (sells below), here when it sells more than one kind,
    # at its sale code; the fees here, the code only where the form takes it.
    sales: { otherwise: "3400" }
    fees: { account: "6580", vat: I0 }
    # The clearing account a provider's first report proposes (src/intake/sales-report-import.ts proposalOf),
    # named after the provider; a further provider takes the next free number of its ten.
    clearing: { account: "1093", name: "Durchlaufkonto {provider}" }
  imports: ["4020", "4030", "4040"]

# «Was verkauft ihr?» (src/workspace/sells.ts, #46): the default accounts of each kind, any combination.
# Purchases: material for the firm's own products, goods bought for resale. Sales: each kind's revenue.
sells:
  made: { purchase: "4000", sales: "3000" }
  traded: { purchase: "4200", sales: "3200" }
  services: { sales: "3400" }
