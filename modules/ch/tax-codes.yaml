# The MWST codes (Banana's names, reference/MWST-codes.txt) and the boxes each feeds.
# "-" before a code reverses it (a refund). On M, I and B codes the suffix -1 means the amount is
# net, -2 that it is the tax itself; without a suffix it is gross.

negativePrefix: "-"
amountSuffix:
  families:
    - M
    - I
    - B
  net: "-1"
  tax: "-2"
