  mailBody: { de: "Guten Tag\n\nIm Anhang die Lohnabrechnung {month}. Das PDF ist mit Ihrem Passwort geschützt.\n\nFreundliche Grüsse\n{firm}", fr: "Bonjour\n\nVous trouverez ci-joint le décompte de salaire {month}. Le PDF est protégé par votre mot de passe.\n\nMeilleures salutations\n{firm}", it: "Buongiorno\n\nIn allegato il conteggio dello stipendio {month}. Il PDF è protetto dalla sua password.\n\nCordiali saluti\n{firm}", en: "Hello\n\nAttached is your payslip for {month}. The PDF is protected with your password.\n\nKind regards\n{firm}" }
  holidaysMinimum: { de: "ohne Ferientage im Vertrag: gesetzliches Minimum {weeks} Wochen (OR Art. 329a)", fr: "sans jours de vacances au contrat : minimum légal {weeks} semaines (CO art. 329a)", it: "senza giorni di vacanza nel contratto: minimo legale {weeks} settimane (CO art. 329a)", en: "no holiday days in the contract: the legal minimum of {weeks} weeks (OR Art. 329a)" }
  holidays: { de: "Ferien: Saldo {balance} Tage (Anspruch bis Monatsende {earned}, bezogen {taken})", fr: "Vacances : solde {balance} jours (droit à la fin du mois {earned}, pris {taken})", it: "Vacanze: saldo {balance} giorni (diritto a fine mese {earned}, godute {taken})", en: "Holidays: balance {balance} days (earned by the month's end {earned}, taken {taken})" }
  # What a payslip and a Lohnausweis are computed from, said neutrally: the owner who runs the payroll himself
  # reads it as well as a fiduciary (docs/specs/payroll.md §22 decision 47). {year}: the year of the federal figures.
  disclaimer: { de: "Berechnet aus den erfassten Sätzen und den Bundeswerten {year}.", fr: "Calculé à partir des taux saisis et des valeurs fédérales {year}.", it: "Calcolato dalle aliquote registrate e dai valori federali {year}.", en: "Computed from the rates entered and the federal figures {year}." }
  # Where a line's rate comes from, printed under it: the law's figure (its source), the insurer's solution, the pension certificate.
  sourceFederal: { de: "Bundeswert {year}", fr: "Valeur fédérale {year}", it: "Valore federale {year}", en: "Federal figure {year}" }
  sourceSolution: { de: "Lösung {code}", fr: "solution {code}", it: "soluzione {code}", en: "solution {code}" }
  sourceCertificate: { de: Vorsorgeausweis, fr: Certificat de prévoyance, it: Certificato di previdenza, en: Pension certificate }
  sourceTariff: { de: "Tarif {region} {year} vom {date} · {code} · satzbestimmend {income}", fr: "Barème {region} {year} du {date} · {code} · revenu déterminant {income}", it: "Tariffa {region} {year} del {date} · {code} · reddito determinante {income}", en: "Tariff {region} {year} of {date} · {code} · rate-determining {income}" }

# The Lohnausweis (Form 11, ESTV/SSK Wegleitung 2026): its numbered fields in print order, each with its
# label in the person's language. `sum`: computed from other fields (8 = 1 to 7; 11 = 8 less 9 and 10);
# `deduction`: summed from deduction lines (their amount as withheld). The firm's Lohnarten name the field
# they are summed into (`lohnausweis`); a field no Lohnart names prints empty.
lohnausweis:
  title: { de: Lohnausweis, fr: Certificat de salaire, it: Certificato di salario, en: Wage statement }
  replaces: { de: "Ersetzt den Lohnausweis vom {date}", fr: "Remplace le certificat de salaire du {date}", it: "Sostituisce il certificato di salario del {date}", en: "Replaces the wage statement of {date}" }
  corrects: { de: "Korrigiert den Lohnausweis vom {date}", fr: "Corrige le certificat de salaire du {date}", it: "Corregge il certificato di salario del {date}", en: "Corrects the wage statement of {date}" }
  expenseRules: { de: "Spesenreglement durch Kanton {canton} am {date} genehmigt", fr: "Règlement des frais approuvé par le canton {canton} le {date}", it: "Regolamento spese approvato dal Cantone {canton} il {date}", en: "Expense regulations approved by canton {canton} on {date}" }
  letters:
    B: { de: Rentenbescheinigung, fr: Attestation de rentes, it: Attestazione di rendite, en: Pension statement }
    C: { de: AHV-Nr., fr: No AVS, it: N. AVS, en: AHV no. }
    born: { de: Geburtsdatum, fr: Date de naissance, it: Data di nascita, en: Date of birth }
    D: { de: Jahr, fr: Année, it: Anno, en: Year }
    E: { de: von – bis, fr: du – au, it: dal – al, en: from – to }
    F: { de: Unentgeltliche Beförderung zwischen Wohn- und Arbeitsort, fr: Transport gratuit entre le domicile et le lieu de travail, it: Trasporto gratuito tra domicilio e luogo di lavoro, en: Free transport between home and work }
    G: { de: Kantinenverpflegung / Lunch-Checks, fr: Repas à la cantine / chèques-repas, it: Pasti alla mensa / buoni pasto, en: Canteen meals / lunch vouchers }
    I: { de: Ort und Datum, fr: Lieu et date, it: Luogo e data, en: Place and date }
  fields:
    - { key: "1", label: { de: "Lohn soweit nicht unter Ziffer 2–7 aufzuführen", fr: "Salaire qui ne concerne pas les chiffres 2 à 7", it: "Salario che non concerne le cifre da 2 a 7", en: "Wage not shown under 2 to 7" } }
    - { key: "2.1", label: { de: "Gehaltsnebenleistungen: Verpflegung, Unterkunft", fr: "Prestations salariales accessoires : pension, logement", it: "Prestazioni accessorie al salario: vitto, alloggio", en: "Fringe benefits: meals, housing" } }
    - { key: "2.2", label: { de: "Privatanteil Geschäftsfahrzeug", fr: "Part privée voiture de service", it: "Quota privata automobile di servizio", en: "Private use of the company car" } }
    - { key: "2.3", label: { de: "Andere Gehaltsnebenleistungen", fr: "Autres prestations salariales accessoires", it: "Altre prestazioni accessorie", en: "Other fringe benefits" } }
    - { key: "3", label: { de: "Unregelmässige Leistungen", fr: "Prestations non périodiques", it: "Prestazioni non periodiche", en: "Irregular payments" } }
    - { key: "4", label: { de: "Kapitalleistungen", fr: "Prestations en capital", it: "Prestazioni in capitale", en: "Capital payments" } }
    - { key: "5", label: { de: "Beteiligungsrechte gemäss Beiblatt", fr: "Droits de participation selon annexe", it: "Diritti di partecipazione secondo allegato", en: "Participation rights (annex)" } }
    - { key: "6", label: { de: "Verwaltungsratsentschädigungen", fr: "Indemnités des membres de l'administration", it: "Indennità dei membri dell'amministrazione", en: "Board fees" } }
    - { key: "7", label: { de: "Andere Leistungen", fr: "Autres prestations", it: "Altre prestazioni", en: "Other benefits" } }
    - { key: "8", sum: { plus: ["1", "2.1", "2.2", "2.3", "3", "4", "5", "6", "7"] }, label: { de: "Bruttolohn total / Rente", fr: "Salaire brut total / Rente", it: "Salario lordo totale / Rendita", en: "Gross wage, total / pension" } }
    - { key: "9", deduction: true, label: { de: "Beiträge AHV/IV/EO/ALV/NBUV", fr: "Cotisations AVS/AI/APG/AC/AANP", it: "Contributi AVS/AI/IPG/AD/AINP", en: "AHV/IV/EO/ALV/NBUV contributions" } }
    - { key: "10.1", deduction: true, label: { de: "Berufliche Vorsorge: ordentliche Beiträge", fr: "Prévoyance professionnelle : cotisations ordinaires", it: "Previdenza professionale: contributi ordinari", en: "Occupational pension: ordinary contributions" } }
    - { key: "10.2", deduction: true, label: { de: "Berufliche Vorsorge: Beiträge für den Einkauf", fr: "Prévoyance professionnelle : cotisations pour le rachat", it: "Previdenza professionale: contributi per il riscatto", en: "Occupational pension: buy-in contributions" } }
    - { key: "11", sum: { plus: ["8"], minus: ["9", "10.1", "10.2"] }, label: { de: "Nettolohn / Rente", fr: "Salaire net / Rente", it: "Salario netto / Rendita", en: "Net wage / pension" } }
    - { key: "12", deduction: true, label: { de: "Quellensteuerabzug", fr: "Retenue de l'impôt à la source", it: "Ritenuta d'imposta alla fonte", en: "Tax withheld at source" } }
    - { key: "13.1.1", label: { de: "Effektive Spesen: Reise, Verpflegung, Übernachtung", fr: "Frais effectifs : voyage, repas, nuitées", it: "Spese effettive: viaggio, vitto, alloggio", en: "Actual expenses: travel, meals, lodging" } }
    - { key: "13.1.2", label: { de: "Effektive Spesen: übrige", fr: "Frais effectifs : autres", it: "Spese effettive: altre", en: "Actual expenses: other" } }
    - { key: "13.2.1", label: { de: "Pauschalspesen: Repräsentation", fr: "Frais forfaitaires : représentation", it: "Spese forfettarie: rappresentanza", en: "Flat expenses: entertainment" } }
    - { key: "13.2.2", label: { de: "Pauschalspesen: Auto", fr: "Frais forfaitaires : voiture", it: "Spese forfettarie: automobile", en: "Flat expenses: car" } }
    - { key: "13.2.3", label: { de: "Pauschalspesen: übrige", fr: "Frais forfaitaires : autres", it: "Spese forfettarie: altre", en: "Flat expenses: other" } }
    - { key: "13.3", label: { de: "Beiträge an die Weiterbildung", fr: "Contributions au perfectionnement", it: "Contributi per il perfezionamento", en: "Training contributions" } }
    - { key: "14", label: { de: "Weitere Gehaltsnebenleistungen", fr: "Autres prestations salariales accessoires", it: "Altre prestazioni accessorie al salario", en: "Further fringe benefits" } }
    - { key: "15", deduction: true, remark: true, label: { de: "Bemerkungen", fr: "Observations", it: "Osservazioni", en: "Remarks" } }
  # Rz 74: the cantons whose tax office wants a copy from the employer (LU voluntary).
  copyToTaxOffice: [BS, BE, FR, JU, NE, SO, VD, VS]
