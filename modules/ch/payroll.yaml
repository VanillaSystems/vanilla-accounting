# Swiss payroll as data (docs/specs/payroll.md §5.3, §8.2, §9.4): the Lohnart catalogue, the kinds of
# social insurance with their liability accounts and the rates a firm's document states, the bases a
# Lohnart counts for, and the contributions code computes. The payroll engine (src/payroll/) reads only
# these keys and flags, never a Swiss name: a contribution's rate, ceiling and age rule are named here
# and their figures come from payroll/<year>.yaml (the law) or the firm's Sozialversicherungen
# (payroll.json, from the fund's or insurer's document). A workspace renames a Lohnart, changes its
# accounts and its Lohnausweis field, or copies one (payroll.json `wageTypes`); it never edits this file.
#
# A Lohnart:
#   key          the app's own key; never shown, never deleted once a closed payslip used it
#   group        the group it prints in (groups below)
#   label        de, fr, it, en: the payslip prints the person's language
#   sign         + adds to the payslip, - deducts; an employer line (side: employer) adds to nothing
#   side         employee (default) or employer: an employer contribution, not on the person's payout
#   gross        part of the gross wage (Bruttolohn)
#   cash         false: counts in the gross and the bases but is no money paid (a benefit in kind)
#   bases        the bases it counts for (bases below)
#   lohnausweis  the field of Form 11 it is summed into
#   debit/credit the accounts it books on; { insurance: <kind> } is that insurance's liability account
#   input        how a person enters it: amount, or quantity and rate (hours × hourly wage)
#   hours        the Lohnart an hourly Anstellung is paid by: its hours entered for the month × the hourly wage
#   computes     how code fills it: monthly (the Anstellung's amount), thirteenth (the 13th salary in its
#                payout months), contribution (a row of contributions below); absent: entered by a person
schema: 1

# The social security number (AHVN13, AHVG Art. 153b-153i): how code finds it in a text, so no prompt to
# a model ever carries one (#508; src/llm/mask.ts). Separators may be dots, spaces or none.
socialSecurityNumber:
  pattern: "\\b756[.\\s]?\\d{4}[.\\s]?\\d{4}[.\\s]?\\d{2}\\b"
  masked: "756.****.****.**"

# The groups, in the order a payslip prints them. `stage`: where a group's lines act on the payslip:
# `gross` (they make the Bruttolohn), `deduction` (taken off it: the Nettolohn), `after` (added or taken
# off after the net: the Auszahlung), `employer` (the employer's contributions, on no payout).
groups:
  - { key: lohn, stage: gross, label: { de: Lohn, fr: Salaire, it: Salario, en: Wage } }
  - { key: zulagen, stage: gross, label: { de: Zulagen, fr: Allocations, it: Indennità, en: Allowances } }
  - { key: einmalig, stage: gross, label: { de: Einmalige Zahlungen, fr: Versements uniques, it: Pagamenti unici, en: One-off payments } }
  - { key: natural, stage: gross, label: { de: Naturalleistungen, fr: Prestations en nature, it: Prestazioni in natura, en: Benefits in kind } }
  - { key: ersatz, stage: gross, label: { de: Ersatzleistungen, fr: Prestations de remplacement, it: Prestazioni sostitutive, en: Daily allowances } }
  - { key: abzuege, stage: deduction, label: { de: Abzüge, fr: Déductions, it: Deduzioni, en: Deductions } }
  - { key: quellensteuer, stage: deduction, label: { de: Quellensteuer, fr: Impôt à la source, it: Imposta alla fonte, en: Tax at source } }
  - { key: familienzulagen, stage: after, label: { de: Familienzulagen, fr: Allocations familiales, it: Assegni familiari, en: Family allowances } }
  - { key: spesen, stage: after, label: { de: Spesen, fr: Frais, it: Spese, en: Expenses } }
  - { key: nettoabzuege, stage: after, label: { de: Nettoabzüge, fr: Déductions nettes, it: Deduzioni nette, en: Net deductions } }
  - { key: arbeitgeber, stage: employer, label: { de: Arbeitgeberbeiträge, fr: Cotisations de l'employeur, it: Contributi del datore di lavoro, en: Employer contributions } }

# The bases a Lohnart counts for. Each contribution below takes one of them. `thirteenth: true`: the base
# the 13th salary is a share of.
bases:
  - { key: ahv, label: { de: AHV-Lohn, fr: Salaire AVS, it: Salario AVS, en: AHV wage } }
  - { key: alv, label: { de: ALV-Lohn, fr: Salaire AC, it: Salario AD, en: ALV wage } }
  - { key: uvg, label: { de: UVG-Lohn, fr: Salaire LAA, it: Salario LAINF, en: UVG wage } }
  - { key: uvgz, label: { de: UVGZ-Lohn, fr: Salaire LAAC, it: Salario LAINFC, en: UVGZ wage } }
  - { key: ktg, label: { de: KTG-Lohn, fr: Salaire IJM, it: Salario IGM, en: KTG wage } }
  - { key: bvg, label: { de: BVG-Lohn, fr: Salaire LPP, it: Salario LPP, en: BVG wage } }
  - { key: qst, label: { de: QST-Lohn, fr: Salaire IS, it: Salario IF, en: Tax-at-source wage } }
  - { key: thirteenth, thirteenth: true, label: { de: Basis 13. Monatslohn, fr: Base 13e salaire, it: Base 13a mensilità, en: 13th salary base } }

# The totals a payslip prints; code computes them from the lines.
totals:
  gross: { de: Bruttolohn, fr: Salaire brut, it: Salario lordo, en: Gross wage }
  deductions: { de: Total Abzüge, fr: Total des déductions, it: Totale deduzioni, en: Total deductions }
  net: { de: Nettolohn, fr: Salaire net, it: Salario netto, en: Net wage }
  payout: { de: Auszahlung, fr: Versement, it: Versamento, en: Payout }
  employer: { de: Total Arbeitgeber, fr: Total employeur, it: Totale datore di lavoro, en: Employer total }

# The kinds of social insurance (Löhne › Einstellungen › Sozialversicherungen). `account`: the liability
# account its lines are credited to until the fund or insurer is paid (§7.1, owner 2026-11-19 decision 4).
# `rates`: what the firm's document states per solution, in %, each with its plausible range (a value
# outside it is a warning, never a refusal). `perPerson`: the contribution is a figure of the person's
# certificate (BVG), not a rate of the firm. `required`: every firm with wages has it, so a month without
# it gets the line «unvollständig»; `requiredAbove`: required once the person's yearly wage on `base` passes
# the federal `figure` (below it the line is left out, and the payslip says why). `computed: false`: the app
# does not compute it yet; a person subject to it gets the line «unvollständig» (Quellensteuer until B2).
insurances:
  ahv:
    label: { de: AHV/IV/EO/ALV, fr: AVS/AI/APG/AC, it: AVS/AI/IPG/AD, en: AHV/IV/EO/ALV }
    fund: { de: Ausgleichskasse, fr: Caisse de compensation, it: Cassa di compensazione, en: Compensation fund }
    account: "2271"
    business: ausgleichskasse
    required: true
    rates:
      adminCost: { label: { de: Verwaltungskosten, fr: Frais d'administration, it: Spese amministrative, en: Administration cost }, range: [0, 5], note: "AHVG Art. 69, AHVV Art. 157: at most 5 % of the contributions" }
  fak:
    label: { de: Familienausgleichskasse, fr: Caisse d'allocations familiales, it: Cassa di compensazione per assegni familiari, en: Family compensation fund }
    fund: { de: Familienausgleichskasse, fr: Caisse d'allocations familiales, it: Cassa assegni familiari, en: Family compensation fund }
    account: "2272"
    required: true
    rates:
      employer: { label: { de: FAK-Beitrag, fr: Cotisation CAF, it: Contributo CAF, en: FAK contribution }, range: [0, 4], note: "FamZG Art. 15-16: the canton's and the fund's rate" }
  uvg:
    label: { de: Unfallversicherung (UVG), fr: Assurance-accidents (LAA), it: Assicurazione infortuni (LAINF), en: Accident insurance (UVG) }
    fund: { de: Unfallversicherer, fr: Assureur-accidents, it: Assicuratore infortuni, en: Accident insurer }
    account: "2273"
    required: true
    rates:
      bu: { label: { de: BU-Prämie, fr: Prime AP, it: Premio INP, en: Occupational accident premium }, range: [0, 10] }
      nbu: { label: { de: NBU-Prämie, fr: Prime ANP, it: Premio INP non professionali, en: Non-occupational accident premium }, range: [0, 5] }
      nbuEmployerShare: { label: { de: NBU-Anteil Arbeitgeber, fr: Part ANP employeur, it: Quota INP datore di lavoro, en: Employer's share of the NBU premium }, range: [0, 100], note: "UVG Art. 91 Abs. 2: 0, 50 or 100 % by agreement" }
  uvgz:
    label: { de: UVG-Zusatzversicherung, fr: Assurance complémentaire LAA, it: Assicurazione complementare LAINF, en: Supplementary accident insurance }
    fund: { de: Versicherer, fr: Assureur, it: Assicuratore, en: Insurer }
    account: "2273"
    rates:
      employee: { label: { de: Anteil Arbeitnehmer, fr: Part employé, it: Quota dipendente, en: Employee share }, range: [0, 5] }
      employer: { label: { de: Anteil Arbeitgeber, fr: Part employeur, it: Quota datore di lavoro, en: Employer share }, range: [0, 5] }
  ktg:
    label: { de: Krankentaggeldversicherung, fr: Assurance indemnités journalières maladie, it: Assicurazione indennità giornaliera malattia, en: Sick pay insurance }
    fund: { de: Versicherer, fr: Assureur, it: Assicuratore, en: Insurer }
    account: "2274"
    rates:
      employee: { label: { de: Anteil Arbeitnehmer, fr: Part employé, it: Quota dipendente, en: Employee share }, range: [0, 5] }
      employer: { label: { de: Anteil Arbeitgeber, fr: Part employeur, it: Quota datore di lavoro, en: Employer share }, range: [0, 5] }
  bvg:
    label: { de: Berufliche Vorsorge (BVG), fr: Prévoyance professionnelle (LPP), it: Previdenza professionale (LPP), en: Occupational pension (BVG) }
    fund: { de: Vorsorgeeinrichtung, fr: Institution de prévoyance, it: Istituto di previdenza, en: Pension fund }
    account: "2275"
    perPerson: true
    requiredAbove: { figure: bvgEntryThreshold, base: ahv }
  qst:
    label: { de: Quellensteuer, fr: Impôt à la source, it: Imposta alla fonte, en: Tax at source }
    fund: { de: Kantonale Steuerverwaltung, fr: Administration cantonale des impôts, it: Amministrazione cantonale delle contribuzioni, en: Cantonal tax office }
    account: "2279"
    computed: false

# What code computes on every payslip, in this order. `rate`: a figure of the law (`federal: <key>` of
# payroll/<year>.yaml), a rate of the firm's solution (`insurance: <rate key>`), or the person's
# certificate (`person: employee | employer`, a fixed amount per month). `base`: a base above, or
# `lines: [...]` the sum of earlier contribution lines (the administration cost on the contributions).
# `ceiling`: a yearly maximum of the base (federal key), cumulated month by month. `liable`: from
# 1 January after the birthday of this age (federal key). `pensioner`: past the reference age the base
# is reduced by an allowance per month (`allowance: <federal key>`), or the line ends (`ends`) from the
# month after it. `share`: the rate is split between the sides by a firm rate (the employer's share in %).
# `minHours`: owed only from these weekly hours (federal key).
contributions:
  - { wageType: ahv-an, insurance: ahv, base: ahv, rate: { federal: ahvEmployee }, liable: liableFromAge, pensioner: { allowance: pensionerAllowance } }
  - { wageType: alv-an, insurance: ahv, base: alv, rate: { federal: alvEmployee }, ceiling: alvCeiling, liable: liableFromAge, pensioner: ends }
  - { wageType: nbu-an, insurance: uvg, base: uvg, rate: { insurance: nbu }, share: { employer: nbuEmployerShare }, ceiling: uvgCeiling, minHours: nbuMinHours }
  - { wageType: uvgz-an, insurance: uvgz, base: uvgz, rate: { insurance: employee } }
  - { wageType: ktg-an, insurance: ktg, base: ktg, rate: { insurance: employee } }
  - { wageType: bvg-an, insurance: bvg, base: bvg, rate: { person: employee } }
  - { wageType: quellensteuer, insurance: qst, base: qst, rate: { insurance: tariff } }
  - { wageType: ahv-ag, insurance: ahv, base: ahv, rate: { federal: ahvEmployer }, liable: liableFromAge, pensioner: { allowance: pensionerAllowance } }
  - { wageType: alv-ag, insurance: ahv, base: alv, rate: { federal: alvEmployer }, ceiling: alvCeiling, liable: liableFromAge, pensioner: ends }
  - { wageType: verwaltungskosten, insurance: ahv, base: { lines: [ahv-an, ahv-ag] }, rate: { insurance: adminCost } }
  - { wageType: fak-ag, insurance: fak, base: ahv, rate: { insurance: employer }, liable: liableFromAge, pensioner: { allowance: pensionerAllowance } }
  - { wageType: bu-ag, insurance: uvg, base: uvg, rate: { insurance: bu }, ceiling: uvgCeiling }
  - { wageType: nbu-ag, insurance: uvg, base: uvg, rate: { insurance: nbu }, share: { employer: nbuEmployerShare }, ceiling: uvgCeiling, minHours: nbuMinHours }
  - { wageType: uvgz-ag, insurance: uvgz, base: uvgz, rate: { insurance: employer } }
  - { wageType: ktg-ag, insurance: ktg, base: ktg, rate: { insurance: employer } }
  - { wageType: bvg-ag, insurance: bvg, base: bvg, rate: { person: employer } }

# Rounding of a line (Stammdaten): 0.05 the default (owner 2026-11-14 decision 13), 0.01 a choice.
rounding: [0.05, 0.01]

wageTypes:
  # Lohn
  - { key: monatslohn, group: lohn, label: { de: Monatslohn, fr: Salaire mensuel, it: Salario mensile, en: Monthly salary }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst, thirteenth], lohnausweis: "1", debit: "5000", credit: "1091", computes: monthly }
  - { key: stundenlohn, group: lohn, hours: true, label: { de: Stundenlohn, fr: Salaire horaire, it: Salario orario, en: Hourly wage }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst, thirteenth], lohnausweis: "1", debit: "5000", credit: "1091", input: quantity }
  - { key: taglohn, group: lohn, label: { de: Taglohn, fr: Salaire journalier, it: Salario giornaliero, en: Daily wage }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst, thirteenth], lohnausweis: "1", debit: "5000", credit: "1091", input: quantity }
  - { key: lohn-krankheit, group: lohn, label: { de: Lohn bei Krankheit, fr: Salaire en cas de maladie, it: Salario in caso di malattia, en: Wage during illness }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst, thirteenth], lohnausweis: "1", debit: "5000", credit: "1091" }
  - { key: lohn-unfall, group: lohn, label: { de: Lohn bei Unfall, fr: Salaire en cas d'accident, it: Salario in caso d'infortunio, en: Wage after an accident }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst, thirteenth], lohnausweis: "1", debit: "5000", credit: "1091" }
  - { key: ueberstunden, group: lohn, label: { de: Überstunden 125 %, fr: Heures supplémentaires 125 %, it: Ore straordinarie 125 %, en: Overtime 125 % }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst], lohnausweis: "1", debit: "5000", credit: "1091", input: quantity }
  - { key: ferienentschaedigung, group: lohn, label: { de: Ferienentschädigung, fr: Indemnité de vacances, it: Indennità per vacanze, en: Holiday pay }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst, thirteenth], lohnausweis: "1", debit: "5000", credit: "1091" }
  - { key: feiertagsentschaedigung, group: lohn, label: { de: Feiertagsentschädigung, fr: Indemnité de jours fériés, it: Indennità per giorni festivi, en: Public holiday pay }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst, thirteenth], lohnausweis: "1", debit: "5000", credit: "1091" }
  - { key: unbezahlter-urlaub, group: lohn, label: { de: Unbezahlter Urlaub, fr: Congé non payé, it: Congedo non pagato, en: Unpaid leave }, sign: "-", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst, thirteenth], lohnausweis: "1", debit: "1091", credit: "5000" }
  # Zulagen
  - { key: funktionszulage, group: zulagen, label: { de: Funktionszulage, fr: Allocation de fonction, it: Indennità di funzione, en: Function allowance }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst, thirteenth], lohnausweis: "1", debit: "5000", credit: "1091" }
  - { key: schichtzulage, group: zulagen, label: { de: Schichtzulage, fr: Allocation de travail en équipe, it: Indennità per lavoro a turni, en: Shift allowance }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst], lohnausweis: "1", debit: "5000", credit: "1091" }
  - { key: nachtzulage, group: zulagen, label: { de: Nachtzulage, fr: Allocation de nuit, it: Indennità notturna, en: Night allowance }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst], lohnausweis: "1", debit: "5000", credit: "1091" }
  - { key: sonntagszulage, group: zulagen, label: { de: Sonntagszulage, fr: Allocation du dimanche, it: Indennità domenicale, en: Sunday allowance }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst], lohnausweis: "1", debit: "5000", credit: "1091" }
  # Einmalige Zahlungen
  - { key: dreizehnter, group: einmalig, label: { de: 13. Monatslohn, fr: 13e salaire, it: 13a mensilità, en: 13th salary }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst], lohnausweis: "1", debit: "5000", credit: "1091", computes: thirteenth }
  - { key: bonus, group: einmalig, label: { de: Bonus, fr: Bonus, it: Bonus, en: Bonus }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, qst], lohnausweis: "3", debit: "5000", credit: "1091" }
  - { key: gratifikation, group: einmalig, label: { de: Gratifikation, fr: Gratification, it: Gratifica, en: Gratuity }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, qst], lohnausweis: "3", debit: "5000", credit: "1091" }
  - { key: provision, group: einmalig, label: { de: Provision, fr: Commission, it: Provvigione, en: Commission }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst], lohnausweis: "1", debit: "5000", credit: "1091" }
  - { key: dienstaltersgeschenk, group: einmalig, label: { de: Dienstaltersgeschenk, fr: Cadeau d'ancienneté, it: Regalo per anzianità di servizio, en: Long-service award }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, qst], lohnausweis: "3", debit: "5000", credit: "1091" }
  # Naturalleistungen: in the gross and the bases, no money paid; booked as wage against the cost they relieve.
  - { key: privatanteil-fahrzeug, group: natural, label: { de: Privatanteil Geschäftsfahrzeug, fr: Part privée du véhicule de service, it: Quota privata veicolo aziendale, en: Private use of the company car }, sign: "+", gross: true, cash: false, bases: [ahv, alv, uvg, uvgz, ktg, qst], lohnausweis: "2.2", debit: "5000", credit: "6200", input: quantity }
  - { key: verpflegung, group: natural, label: { de: Verpflegung, fr: Repas, it: Vitto, en: Meals }, sign: "+", gross: true, cash: false, bases: [ahv, alv, uvg, uvgz, ktg, qst], lohnausweis: "2.1", debit: "5000", credit: "5880" }
  - { key: wohnung, group: natural, label: { de: Unterkunft, fr: Logement, it: Alloggio, en: Housing }, sign: "+", gross: true, cash: false, bases: [ahv, alv, uvg, uvgz, ktg, qst], lohnausweis: "2.3", debit: "5000", credit: "5880" }
  # Ersatzleistungen (phase B1: with the Abwesenheiten)
  - { key: taggeld-eo, group: ersatz, label: { de: EO-Entschädigung, fr: Allocation APG, it: Indennità IPG, en: EO allowance }, sign: "+", gross: true, bases: [ahv, alv, uvg, uvgz, ktg, bvg, qst], lohnausweis: "1", debit: "2271", credit: "1091" }
  - { key: taggeld-uvg, group: ersatz, label: { de: UVG-Taggeld, fr: Indemnité journalière LAA, it: Indennità giornaliera LAINF, en: UVG daily allowance }, sign: "+", gross: true, bases: [qst], lohnausweis: "1", debit: "2273", credit: "1091" }
  - { key: taggeld-ktg, group: ersatz, label: { de: KTG-Taggeld, fr: Indemnité journalière maladie, it: Indennità giornaliera malattia, en: Sick pay allowance }, sign: "+", gross: true, bases: [qst], lohnausweis: "1", debit: "2274", credit: "1091" }
  # Abzüge (employee shares); their accounts are the insurance's liability account
  - { key: ahv-an, group: abzuege, label: { de: AHV/IV/EO, fr: AVS/AI/APG, it: AVS/AI/IPG, en: AHV/IV/EO }, sign: "-", bases: [], lohnausweis: "9", debit: "1091", credit: { insurance: ahv }, computes: contribution }
  - { key: alv-an, group: abzuege, label: { de: ALV, fr: AC, it: AD, en: ALV }, sign: "-", bases: [], lohnausweis: "9", debit: "1091", credit: { insurance: ahv }, computes: contribution }
  - { key: nbu-an, group: abzuege, label: { de: NBU, fr: ANP, it: INP, en: NBU }, sign: "-", bases: [], lohnausweis: "9", debit: "1091", credit: { insurance: uvg }, computes: contribution }
  - { key: uvgz-an, group: abzuege, label: { de: UVG-Zusatz, fr: LAA complémentaire, it: LAINF complementare, en: Supplementary accident }, sign: "-", bases: [], lohnausweis: "15", debit: "1091", credit: { insurance: uvgz }, computes: contribution }
  - { key: ktg-an, group: abzuege, label: { de: Krankentaggeld, fr: Indemnités journalières maladie, it: Indennità giornaliera malattia, en: Sick pay insurance }, sign: "-", bases: [], lohnausweis: "15", debit: "1091", credit: { insurance: ktg }, computes: contribution }
  - { key: bvg-an, group: abzuege, label: { de: BVG, fr: LPP, it: LPP, en: BVG }, sign: "-", bases: [], lohnausweis: "10.1", debit: "1091", credit: { insurance: bvg }, computes: contribution }
  - { key: bvg-einkauf, group: abzuege, label: { de: BVG-Einkauf, fr: Rachat LPP, it: Riscatto LPP, en: BVG buy-in }, sign: "-", bases: [], lohnausweis: "10.2", debit: "1091", credit: { insurance: bvg } }
  # Quellensteuer (computed from phase B2; until then «unvollständig» for a person subject to it)
  - { key: quellensteuer, group: quellensteuer, label: { de: Quellensteuer, fr: Impôt à la source, it: Imposta alla fonte, en: Tax at source }, sign: "-", bases: [], lohnausweis: "12", debit: "1091", credit: { insurance: qst }, computes: contribution }
  # Familienzulagen: no gross for AHV, counted for the tax at source; paid with the wage, refunded by the FAK
  - { key: kinderzulage, group: familienzulagen, label: { de: Kinderzulage, fr: Allocation pour enfant, it: Assegno per i figli, en: Child allowance }, sign: "+", bases: [qst], lohnausweis: "1", debit: { insurance: fak }, credit: "1091" }
  - { key: ausbildungszulage, group: familienzulagen, label: { de: Ausbildungszulage, fr: Allocation de formation, it: Assegno di formazione, en: Education allowance }, sign: "+", bases: [qst], lohnausweis: "1", debit: { insurance: fak }, credit: "1091" }
