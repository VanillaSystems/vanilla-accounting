# The funds' and insurers' documents a firm sets its Sozialversicherungen up from (docs/specs/payroll.md §6.1 step 2,
# §10.2 A-2, src/payroll/setup-documents.ts): a document whose first lines name one of `kinds` proposes that kind's
# insurance on a card in Löhne › Einstellungen; code reads what the text states plainly (a number after its label,
# a rate in % on the line of its words), the AI the rest, and nothing counts before the person keeps it. A
# Beitragsverfügung of the compensation fund names the family allowances' rate too: it proposes that insurance
# beside it. `notToModel`: a line with one of these words (a salary, a person's insured wage) is never sent to a model.
setupDocuments:
  kinds:
    ahv: [Beitragsverfügung, Verfügung über die Akontobeiträge, Akontoverfügung, Décision de cotisations, Décision de cotisations d'acomptes, Decisione di contributi, Decisione sui contributi d'acconto]
    bvg: [Vorsorgeausweis, Versicherungsausweis, Persönlicher Ausweis, Certificat de prévoyance, Certificat d'assurance, Certificato di previdenza, Certificato d'assicurazione, Pension certificate]
    uvgz: [UVG-Zusatzversicherung, Zusatzversicherung zum UVG, UVG-Zusatz, Assurance complémentaire LAA, Assicurazione complementare LAINF]
    uvg: [UVG-Police, Police Unfallversicherung, Unfallversicherungspolice, Unfallversicherung nach UVG, Police d'assurance-accidents, Assurance-accidents LAA, Polizza assicurazione infortuni, Assicurazione infortuni LAINF]
    ktg: [Krankentaggeldversicherung, Krankentaggeld-Police, Police Krankentaggeld, Assurance d'indemnités journalières, Indemnités journalières maladie, Assicurazione d'indennità giornaliera, Indennità giornaliera di malattia]
  numbers:
    memberNumber: [Abrechnungsnummer, Abrechnungs-Nr., Abrechnungs-Nr, Mitgliednummer, Mitglied-Nr., Mitgliedernummer, Kassen-Nr., Kundennummer, N° d'affilié, Numéro d'affilié, No d'affilié, N. affiliato, Numero d'affiliazione]
    contractNumber: [Vertragsnummer, Vertrags-Nr., Vertrag Nr., Policennummer, Policen-Nr., Police Nr., Police-Nr., Anschlussvertrag, N° de contrat, N° de police, Numéro de police, N. contratto, N. polizza, Numero di polizza]
  rates:
    ahv: { adminCost: [Verwaltungskosten, Verwaltungskostenbeitrag, Frais d'administration, Spese amministrative, Spese di amministrazione] }
    fak: { employer: [FAK, Familienausgleichskasse, Familienzulagen, CAF, Allocations familiales, Assegni familiari] }
    uvg: { bu: [BU, Berufsunfall, Berufsunfälle, Berufsunfallversicherung, AP, Accidents professionnels, INP, Infortuni professionali], nbu: [NBU, Nichtberufsunfall, Nichtberufsunfälle, Nichtberufsunfallversicherung, ANP, Accidents non professionnels, Infortuni non professionali] }
  # What a model may read of such a document (src/payroll/setup-documents.ts linesForModel), an allow-list: the first two
  # lines (the fund's letterhead), a line with a rate in %, a line naming one of the words above or of `toModel`. Never an
  # amount alone, never a line with a date, never one that holds a word of `notToModel` anywhere (a salary, an insured or
  # coordinated wage, retirement savings, a birth date, a civil status), in any case.
  toModel: [Beitrag, Beiträge, Sparbeitrag, Risikobeitrag, Arbeitnehmer, Arbeitgeber, Versicherte Person, Prämie, Prämiensatz, Lösung, Kategorie, Cotisation, Cotisations, Employé, Employeur, Personne assurée, Prime, Solution, Contributo, Contributi, Dipendente, Datore di lavoro, Persona assicurata, Premio, Soluzione, Contribution, Contributions, Employee, Employer, Insured person, Premium]
  notToModel: [lohn, löhne, gehalt, salär, salaire, salari, salary, wage, verdienst, revenu, reddito, einkommen, income, guthaben, avoir, avere, geb., geboren, geburt, naissance, nascita, birth, zivilstand, état civil, stato civile, civil status, AHV-Nr, No AVS, N. AVS]

# The tax at source (Quellensteuer, docs/specs/payroll.md §3f, phase B2): the employer deducts it by the
# tariff file of the canton, which the ESTV publishes per canton and year as fixed-width records (one per
# tariff code, number of children, church tax and monthly income bracket). The app fetches a file on demand
# into the workspace's data/qst/<year>/ (never git) and keeps every version by its checksum; a payslip
# names the file's date. `file.url`: where the file of a canton and year lies ({year}, {yy}, {canton} in
# lower case); `file.archive`: the zip of every canton for a past year. `rounding`: the tax is rounded
# commercially to 5 Rappen (Arbeitsgruppe Quellensteuern, FAQ KS 45, Frage 5).
# `aperiodic`: the Lohnausweis fields whose amounts are aperiodic (FAQ KS 45, Frage 14: fields 3, 4, 5):
# added to the rate-determining income of the month as they are, never extrapolated; every other line of
# the base is periodic. `partMonth`: a month the person enters or leaves extrapolates the periodic income to
# this many days (KS 45 Ziff. 6.3, FAQ Frage 6 and 15). `provision`: the file's codes of the commission.
# `regions`: each canton with the model it applies (ESTV KS 45 Ziff. 3; Kanton Aargau, «Info
# Quellensteuerverfahren 2021», Ziff. 3): the monthly model in 21 cantons, the annual model in FR, GE, TI,
# VD, VS. The app computes the monthly model; a person of a canton on the annual model gets the line
# «unvollständig» (§22 decision 93). `codeNotes`: what a payslip's tax line and the person's form say beside a
# tariff code that matches `codes` (a pattern on the code the file is read with). The codes L to Q are those of
# a cross-border commuter resident in Germany: the flat 4.5 % (DBA CH-DE Art. 15a Abs. 1) only while the
# employer holds her certificate of residence of the German tax office (Ansässigkeitsbescheinigung, form Gre-1;
# its renewal Gre-2); without it the ordinary tariff applies (DBA CH-DE Art. 15a Abs. 3; ESTV, Merkblatt
# Grenzgänger Deutschland) (§22 decision 123).
taxAtSource:
  file:
    url: "https://www.estv2.admin.ch/qst/{year}/loehne/tar{yy}{canton}.zip"
    archive: "https://www.estv2.admin.ch/qst/archiv/tar{year}.zip"
    page: "https://www.estv.admin.ch/de/quellensteuertarife-import-in-lohnbuchhaltungssysteme"
    format: "ESTV, Aufbau und Recordformate der Quellensteuer-Tarife für den Import in Lohnbuchhaltungssysteme, gültig ab 1.1.2025 (unchanged for 2027)"
  rounding: 0.05
  aperiodic: ["3", "4", "5"]
  partMonth: 30
  provision: { electronic: PEL, paper: PPA }
  codeNotes:
    - codes: "^[L-Q]"
      text:
        de: "Grenzgängertarif 4.5 % nur mit gültiger Ansässigkeitsbescheinigung (Formular Gre-1, Verlängerung Gre-2); ohne sie gilt der ordentliche Tarif"
        fr: "Barème frontalier 4.5 % seulement avec une attestation de résidence valable (formulaire Gre-1, prolongation Gre-2) ; sans elle, le barème ordinaire s’applique"
        it: "Tariffa per frontalieri 4.5 % solo con un certificato di residenza valido (modulo Gre-1, proroga Gre-2); senza, si applica la tariffa ordinaria"
        en: "Cross-border rate 4.5 % only with a valid certificate of residence (form Gre-1, renewal Gre-2); without it the ordinary tariff applies"
  source: "DBG Art. 83-88, QStV (SR 642.118.2), ESTV Kreisschreiben Nr. 45; FAQ KS 45 der Arbeitsgruppe Quellensteuern (2026)"
  regions:
    AG: { model: monthly }
    AI: { model: monthly }
    AR: { model: monthly }
    BE: { model: monthly }
    BL: { model: monthly }
    BS: { model: monthly }
    FR: { model: annual }
    GE: { model: annual }
    GL: { model: monthly }
    GR: { model: monthly }
    JU: { model: monthly }
    LU: { model: monthly }
    NE: { model: monthly }
    NW: { model: monthly }
    OW: { model: monthly }
    SG: { model: monthly }
    SH: { model: monthly }
    SO: { model: monthly }
    SZ: { model: monthly }
    TG: { model: monthly }
    TI: { model: annual }
    UR: { model: monthly }
    VD: { model: annual }
    VS: { model: annual }
    ZG: { model: monthly }
    ZH: { model: monthly }

