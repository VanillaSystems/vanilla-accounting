# What a document is, by its words (src/intake/document-kind.ts), in the languages Swiss receipts
# come in: German, French, Italian and English. Each entry is matched as words, ignoring case; a
# workspace overlay may add its suppliers' words.

receipt:
  title: [Rechnung, Faktura, Quittung, Kassenbon, Kassenzettel, Zollrechnung, Gutschrift, Invoice, Tax invoice, Receipt, Bill, Credit note, Facture, Quittance, Reçu, Note de crédit, Fattura, Ricevuta, Scontrino, Nota di credito]
  total: [Total, Totalbetrag, Gesamtbetrag, Rechnungsbetrag, Endbetrag, zu bezahlen, Summe, Amount due, Amount paid, Grand total, Montant total, Montant à payer, Totale, Importo totale]
  due: [zahlbar bis, zahlbar innert, fällig am, Fälligkeit, Zahlungsfrist, Due date, Payable by, Payment due, Date d'échéance, payable jusqu'au, Scadenza, pagabile entro]
  slip: [Zahlteil, Empfangsschein, Section paiement, Récépissé, Sezione pagamento, Payment part]
  number: [Rechnungsnummer, Rechnungs-Nr., Rechnung Nr., Rechnungsnr., Rechnung, Belegnummer, Beleg-Nr., Quittungsnummer, Invoice number, Invoice No., "Invoice #", Invoice, Receipt number, "Receipt #", Bill number, Numéro de facture, Facture n°, Facture no, Facture, Numero fattura, Fattura n., Fattura nr., Fattura]

supporting:
  order-confirmation: [Auftragsbestätigung, Bestellbestätigung, Bestelleingang, Order confirmation, Confirmation de commande, Confirmation d'ordre, Conferma d'ordine, Conferma dell'ordine]
  # A reminder of an invoice: its number links it to the invoice, it never is a second one to pay.
  reminder: [Zahlungserinnerung, Mahnung, Erste Mahnung, Zweite Mahnung, Letzte Mahnung, Payment reminder, Reminder, Overdue notice, Rappel, Rappel de paiement, Sommation, Sollecito, Sollecito di pagamento, Promemoria di pagamento]
  delivery-note: [Lieferschein, Delivery note, Packing slip, Bulletin de livraison, Bon de livraison, Bolla di consegna, Documento di trasporto]
  # The customs office's assessment: proof beside the carrier's invoice that the carrier is paid for, never paid on its own (customs.assessment below).
  customs-assessment: [Veranlagungsverfügung MWST, Veranlagungsverfügung Zoll, Décision de taxation TVA, Décision de taxation douane, Decisione d'imposizione IVA, Decisione d'imposizione dazio, Assessment decision VAT]

# Newsletter words count anywhere (they stand in the footer); the others where a document names
# what it is, in its first lines.
other:
  newsletter: [Abmelden, Newsletter abbestellen, vom Newsletter abmelden, im Browser ansehen, Unsubscribe, View in browser, View this email in your browser, Se désabonner, Se désinscrire, Voir dans le navigateur, Disiscriviti, Annulla l'iscrizione]
  terms: [Allgemeine Geschäftsbedingungen, AGB, Widerrufsbelehrung, Terms and conditions, Terms of service, General terms, Conditions générales, Conditions générales de vente, Condizioni generali, Condizioni generali di vendita]
  price-list: [Preisliste, Katalog, Prospekt, Broschüre, Produktbroschüre, Price list, Catalogue, Catalog, Brochure, Liste de prix, Listino prezzi, Listino]
  tracking: [Sendungsverfolgung, Sendung verfolgen, Ihr Paket ist unterwegs, Track your parcel, Track your package, Tracking number, Suivi de colis, Suivre mon colis, Tracciamento, Traccia la spedizione]
  no-receipt: [Kein Beleg, Keine Rechnung, Not a receipt, Not an invoice, Pas un justificatif, Pas une facture, Non è un giustificativo, Non è una fattura]

# A bank statement names itself in its first lines, before any receipt word (src/intake/document-kind.ts
# namesStatement): «Kontoauszug», «CHF statement» of a currency account, «Relevé de compte».
statement: [Kontoauszug, Bankauszug, Account statement, Bank statement, Statement, Relevé de compte, Relevé bancaire, Extrait de compte, Estratto conto]

# The balance lines of a statement (src/books/statement-facts.ts): with the title, an IBAN and a
# period they tell a statement among the receipts from an invoice that only mentions one.
balance: [Saldovortrag, Anfangssaldo, Schlusssaldo, Eröffnungssaldo, Endsaldo, Saldo, Opening balance, Closing balance, Balance brought forward, Balance, Solde initial, Solde final, Solde, Saldo iniziale, Saldo finale]

# The title of a credit note in its first lines (src/intake/pairing.ts paysIn): money comes back for
# it, so the matching looks for it among the money that came in.
credit: [Gutschrift, Gutschriftsanzeige, Credit note, Credit memo, Note de crédit, Nota di credito]

# A courier's or forwarder's customs invoice (src/booking/customs-invoice.ts): each of its read lines
# (Receipt.lineItems) is one position by its words, and the position lands on its account of the
# chart (accounts.yaml), processes/booking.guide.yaml#shape shp-zollrechnung. A line takes the
# position of its longest word; a line that names duty and import VAT both, or no position, leaves
# the invoice to the model. The carrier's own Swiss VAT on freight and fees follows the line's rate.
# Import VAT the carrier advanced is deductible only with the customs office's assessment (below),
# never on the carrier's invoice (MWSTG Art. 28 Abs. 1 lit. c, ESTV MWST-Info 09).
customs:
  positions:
    importVat:
      account: "4030"
      words: [Einfuhrsteuer, Einfuhr-MWST, Einfuhr-Mehrwertsteuer, Import-MWST, Einfuhrumsatzsteuer, EUSt, MWST bei der Einfuhr, Import VAT, Import tax, TVA à l'importation, TVA import, Impôt sur les importations, IVA all'importazione, IVA importazione, Imposta sull'importazione]
    duty:
      account: "4020"
      words: [Zoll, Zölle, Zollabgabe, Zollabgaben, Einfuhrzoll, Zollbetrag, Customs duty, Customs duties, Import duty, Duty, Duties, Droits de douane, Droit de douane, Douane, Dazio, Dazi, Dazi doganali]
    fees:
      account: "4040"
      words: [Vorlageprovision, Vorlageprovisionsgebühr, Vorlagegebühr, Vorlagekosten, Auslagenprovision, Aufwendungspauschale, Verzollung, Verzollungsgebühr, Verzollungskosten, Verzollungsspesen, Zollabfertigung, Abfertigungsgebühr, Kontoabwicklungsgebühr, Zusatzleistungen, Bearbeitungsgebühr, Gebühr, Gebühren, Disbursement fee, Advancement fee, Clearance fee, Customs clearance, Handling fee, Fee, Fees, Frais d'avance de fonds, Frais de dédouanement, Dédouanement, Frais de gestion, Frais, Spese di sdoganamento, Sdoganamento, Spese per prepagamento, Spese]
    freight:
      account: "6280"
      words: [Fracht, Frachtkosten, Transport, Transportkosten, Versand, Versandkosten, Porto, Freight, Shipping, Carriage, Fret, Frais de port, Frais de transport, Expédition, Trasporto, Spese di trasporto, Spedizione, Nolo]
  # A line that names only the tax («MWST», «MwSt / TVA / IVA») at no rate of its own: on an invoice
  # whose other lines name duty or import VAT (also lines of 0.00), it is the import VAT the carrier
  # advanced. The carrier's own VAT is charged at a rate on its services, never a line at 0 %.
  # A line that names no position but carries the carrier's Swiss rate (a printed invoice, an extra
  # service) is the carrier's own service: fees. Duty and import VAT never carry Swiss VAT.
  tax: [MWST, MwSt, Mehrwertsteuer, TVA, Taxe sur la valeur ajoutée, IVA, Imposta sul valore aggiunto, VAT, Value added tax]
  # The BAZG's assessment of import VAT (Veranlagungsverfügung MWST): its title, and the label of its
  # total. It proves the deduction when it names the firm's UID. The German words are the BAZG's
  # document; the French, Italian and English ones are its names in those languages, not yet seen
  # on a document.
  assessment:
    title: [Veranlagungsverfügung MWST, Décision de taxation TVA, Decisione d'imposizione IVA, Assessment decision VAT]
    total: [Gesamtbetrag MWST, Montant total TVA, Importo totale IVA, Total amount VAT]
    # Its number (the customs declaration's, such as 26CHEI000000004711), without the version suffix:
    # the courier's invoice cites it, two documents of one number are copies, and a payment to the
    # customs office names it in its text.
    number: '\d{2}CH[A-Z]{1,4}\d{10,14}'
    # Where a courier's invoice says how to fetch the assessment: the label of the access code that
    # comes with the declaration number (in a sentence «Zugangscode: …» or a table's column), and the
    # link beside it (processes/authorities/bazg.yaml#evv-download). Shown on the task «Veranlagungsverfügung fehlt».
    access: [Zugangscode, EVV Code, EVV-Code, eVV-Code, Code d'accès, Codice d'accesso, Access code]
