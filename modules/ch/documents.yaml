# What a document is, by its words (src/intake/document-kind.ts), in the languages Swiss receipts
# come in: German, French, Italian and English. Each entry is matched as words, ignoring case; a
# workspace overlay may add its suppliers' words.

receipt:
  title: [Rechnung, Faktura, Quittung, Kassenbon, Kassenzettel, Zollrechnung, Gutschrift, Invoice, Tax invoice, Receipt, Bill, Credit note, Facture, Quittance, Reçu, Note de crédit, Fattura, Ricevuta, Scontrino, Nota di credito]
  # Found also inside a word («Rechnungstotal»); a bare «Betrag», «Amount», «Montant», «Importo» is no
  # total (it heads a column, names a VAT amount, a discount, an instalment: src/parsers/receipt-text.ts).
  total: [Total, Totalbetrag, Gesamtbetrag, Rechnungsbetrag, Endbetrag, zu bezahlen, zu zahlen, Summe, Amount due, Amount paid, Grand total, Montant total, Montant TTC, Montant à payer, Totale, Importo totale]
  due: [zahlbar bis, zahlbar innert, fällig am, Fälligkeit, Zahlungsfrist, Due date, Payable by, Payment due, Date d'échéance, payable jusqu'au, Scadenza, pagabile entro]
  slip: [Zahlteil, Empfangsschein, Section paiement, Récépissé, Sezione pagamento, Payment part]
  number: [Rechnungsnummer, Rechnungs-Nr., Rechnung Nr., Rechnungsnr., Rechnung, Belegnummer, Beleg-Nr., Quittungsnummer, Invoice number, Invoice No., "Invoice #", Invoice, Receipt number, "Receipt #", Bill number, Numéro de facture, Facture n°, Facture no, Facture, Numero fattura, Fattura n., Fattura nr., Fattura]

# A title or number word of six letters or more also closes a compound that starts a line, as German
# writes a bill's kind into its title («Akontorechnung AK-26-Q3-30871», «Prämienrechnung PR-2026-2210»):
# such a line is the title, and the word after it the bill's number (src/core/modules/words.ts
# compoundLines), only when that word is a number of its own (not a year, not a date: «Erfolgsrechnung 2025»). Never a compound that ends in one of these: a statement or a payslip, a calculation.
notCompound: [Abrechnung, Berechnung, Verrechnung, Hochrechnung, Umrechnung, Proformarechnung]

# A line with a total's word that is no total of the document: a payroll, a sum insured, a limit, a
# turnover, hours, a minimum payment (receipt-text.ts totalLabel).
notTotal: [Lohnsumme, Summe der Löhne, Löhne, Versicherungssumme, Kreditlimite, Limite, Limit, Umsatz, Stunden, Hours, Heures, Ore, Mindestbetrag, Minimum, Masse salariale, Somme assurée, Massa salariale, Somma assicurata]

# A document that says in words it charges no Swiss VAT (a sale abroad, an exempt premium, a foreign
# supplier's reverse charge): read as «keine CH-MWST» only when no Swiss rate, rate group or Swiss VAT
# number stands on it (receipt-text.ts textFacts noSwissVat): «Total ohne MWST» beside «MWST 8.1 %» says nothing.
noVat: [nicht der schweizerischen MWST unterstellt, nicht der MWST unterstellt, nicht MWST-pflichtig, not subject to Swiss VAT, non assujetti à la TVA, non assoggettato all'IVA, von der MWST ausgenommen, unterliegen nicht der MWST, unterliegt nicht der MWST, keine schweizerische MWST, not registered for VAT in Switzerland, no Swiss VAT, no VAT charged, no sales tax or VAT charged, reverse charge, Steuerschuldnerschaft des Leistungsempfängers, exonéré de la TVA, exonérée de la TVA, hors du champ de la TVA suisse, pas de TVA suisse, non soggetto all'IVA, non soggetta all'IVA, esente IVA, senza IVA svizzera]

supporting:
  order-confirmation: [Auftragsbestätigung, Bestellbestätigung, Bestelleingang, Order confirmation, Confirmation de commande, Confirmation d'ordre, Conferma d'ordine, Conferma dell'ordine]
  # A reminder of an invoice: its number links it to the invoice, it never is a second one to pay.
  reminder: [Zahlungserinnerung, Mahnung, Erste Mahnung, Zweite Mahnung, Letzte Mahnung, Payment reminder, Reminder, Overdue notice, Rappel, Rappel de paiement, Sommation, Sollecito, Sollecito di pagamento, Promemoria di pagamento]
  delivery-note: [Lieferschein, Delivery note, Packing slip, Bulletin de livraison, Bon de livraison, Bolla di consegna, Documento di trasporto]
  # The customs office's assessment: proof beside the carrier's invoice that the carrier is paid for, never paid on its own (customs.assessment below).
  customs-assessment: [Veranlagungsverfügung MWST, Veranlagungsverfügung Zoll, Décision de taxation TVA, Décision de taxation douane, Decisione d'imposizione IVA, Decisione d'imposizione dazio, Assessment decision VAT]
  # A balance sheet (a fiduciary's year-end or interim one): no payment belongs to it; the one of the
  # year before's last day holds the opening of the books' first year (Firma › Eröffnung, #427).
  balance-sheet: [Bilanz, Schlussbilanz, Zwischenbilanz, Jahresbilanz, Eröffnungsbilanz, Balance sheet, Interim balance sheet, Bilan, Bilan intermédiaire, Bilan de clôture, Bilancio, Bilancio intermedio, Bilancio di chiusura]

# Newsletter words count anywhere (they stand in the footer); the others where a document names
# what it is, in its first lines.
other:
  newsletter: [Abmelden, Newsletter abbestellen, vom Newsletter abmelden, im Browser ansehen, Unsubscribe, View in browser, View this email in your browser, Se désabonner, Se désinscrire, Voir dans le navigateur, Disiscriviti, Annulla l'iscrizione]
  terms: [Allgemeine Geschäftsbedingungen, AGB, Widerrufsbelehrung, Terms and conditions, Terms of service, General terms, Conditions générales, Conditions générales de vente, Condizioni generali, Condizioni generali di vendita]
  price-list: [Preisliste, Katalog, Prospekt, Broschüre, Produktbroschüre, Price list, Catalogue, Catalog, Brochure, Liste de prix, Listino prezzi, Listino]
  tracking: [Sendungsverfolgung, Sendung verfolgen, Ihr Paket ist unterwegs, Track your parcel, Track your package, Tracking number, Suivi de colis, Suivre mon colis, Tracciamento, Traccia la spedizione]
  no-receipt: [Kein Beleg, Keine Rechnung, Not a receipt, Not an invoice, Pas un justificatif, Pas une facture, Non è un giustificativo, Non è una fattura]

# A bank statement names itself in its first lines, before any receipt word (src/core/modules/words.ts
# namesStatement): «Kontoauszug», «CHF statement» of a currency account, «Relevé de compte».
statement: [Kontoauszug, Bankauszug, Account statement, Bank statement, Statement, Relevé de compte, Relevé bancaire, Extrait de compte, Estratto conto]

# A credit card's monthly statement names itself in its first lines (src/core/modules/words.ts
# namesCardStatement); with its period it is the receipt of the card's debit on the bank account:
# the app reads no card statement as a bank statement (#401, #94).
cardStatement: [Kreditkartenabrechnung, Kartenabrechnung, Monatsabrechnung Kreditkarte, Credit card statement, Card statement, Relevé de carte de crédit, Relevé de carte, Décompte de carte, Estratto conto carta di credito, Estratto conto carta, Conteggio carta]
# The card's own payment on its statement: with the balance words, a row of a card statement that
# is no merchant's line (src/books/card-lines.ts, #409).
cardPayment: [Ihre Zahlung, Zahlung erhalten, Zahlungseingang, Besten Dank für Ihre Zahlung, Your payment, Payment received, Payment - thank you, Payment – thank you, Votre paiement, Paiement reçu, Il vostro pagamento, Pagamento ricevuto]

# The columns of a statement's movements, money out and money in (src/core/modules/words.ts
# isBankStatement): a statement shows the account's IBAN or these. A supplier's «Statement» of
# its charges shows neither and stays a receipt.
movements:
  out: [Belastung, Belastungen, Lastschrift, Lastschriften, Debit, Debits, Outgoing, Paid out, Money out, Withdrawals, Débit, Débits, Addebito, Addebiti, Uscite]
  in: [Gutschrift, Gutschriften, Credit, Credits, Incoming, Paid in, Money in, Deposits, Crédit, Crédits, Accredito, Accrediti, Entrate]

# The balance lines of a statement (src/books/statement-facts.ts): with the title, an IBAN and a
# period they tell a statement among the receipts from an invoice that only mentions one.
balance: [Saldovortrag, Anfangssaldo, Schlusssaldo, Eröffnungssaldo, Endsaldo, Saldo, Opening balance, Closing balance, Balance brought forward, Balance, Solde initial, Solde final, Solde, Saldo iniziale, Saldo finale]

# The title of a credit note in its first lines (src/intake/pairing.ts paysIn): money comes back for
# it, so the matching looks for it among the money that came in.
credit: [Gutschrift, Gutschriftsanzeige, Credit note, Credit memo, Note de crédit, Nota di credito]

# The words of a bank's payment text that say only that it is a payment, how it went or what it
# refers to (src/saving/hand-rule.ts, #383): with a receipt's title and number words and the movement
# words above, a rule on them alone says nothing about what the payments are, so none is offered.
payment: [Zahlung, Zahlungen, Auftrag, Zahlungsauftrag, Dauerauftrag, Überweisung, Uebertrag, Übertrag, E-Banking, Einkauf, Karte, Kartenzahlung, Debitkarte, Kreditkarte, Bezug, Mitteilung, Referenz, Ref, Nr, Payment, Transfer, Order, Standing order, Card, Card payment, Purchase, Reference, Paiement, Virement, Ordre, Ordre permanent, Carte, Achat, Pagamento, Bonifico, Ordine, Ordine permanente, Carta, Acquisto, Riferimento]

# A cash discount (src/intake/near-pairs.ts, #397): a percentage beside one of these words is a
# discount the payment's text states («abzgl. 2% Skonto») or the invoice offers («2 % Skonto innert
# 10 Tagen»), so a payment less by exactly that pays the invoice.
discount: [Skonto, Barzahlungsskonto, Skontoabzug, Cash discount, Early payment discount, Prompt payment discount, Escompte, Sconto]
# A discount word right after one of these is none («ohne Skonto», «kein Skontoabzug»).
discountNone: [ohne, kein, keine, keinen, sans, aucun, aucune, senza, nessuno, no, without]
# The word that makes a number a count of days in payment terms («innert 30 Tagen»): only a number
# right before one of them is a term (src/intake/near-pairs.ts termsOf).
days: [Tag, Tage, Tagen, jour, jours, giorno, giorni, day, days]
# The months by number, as a payment's text names them («Miete Gerüst Juli»): a payment that names
# another month than its receipt is held back from a link by code (#397).
months:
  - [Januar, Jänner, janvier, gennaio, January]
  - [Februar, février, febbraio, February]
  - [März, mars, marzo, March]
  - [April, avril, aprile]
  - [Mai, maggio, May]
  - [Juni, juin, giugno, June]
  - [Juli, juillet, luglio, July]
  - [August, août, agosto]
  - [September, septembre, settembre]
  - [Oktober, octobre, ottobre, October]
  - [November, novembre]
  - [Dezember, décembre, dicembre, December]
# Legal forms and words of a firm's name that say nothing of who it is: a payee is never told by them.
legalForms: [GmbH, AG, SA, Sàrl, Sagl, KlG, KG, Ltd, Limited, Inc, Corp, LLC, Company, Holding, Gruppe, Group, Genossenschaft, Stiftung, Verein]

# A courier's or forwarder's customs invoice (src/booking/customs-invoice.ts): each of its read lines
# (Receipt.lineItems) is one position by its words, and the position lands on its account of the
# chart (accounts.yaml), processes/booking.guide.yaml#shape shp-zollrechnung. A line takes the
# position of its longest word; a line that names duty and import VAT both, or no position, leaves
# the invoice to the model. The carrier's own Swiss VAT on freight and fees follows the line's rate.
# Import VAT the carrier advanced is deductible only with the customs office's assessment (below),
# never on the carrier's invoice (MWSTG Art. 28 Abs. 1 lit. c, ESTV MWST-Info 09).
customs:
  positions:
    importVat:
      account: "4030"
      words: [Einfuhrsteuer, Einfuhr-MWST, Einfuhr-Mehrwertsteuer, Import-MWST, Einfuhrumsatzsteuer, EUSt, MWST bei der Einfuhr, Import VAT, Import tax, TVA à l'importation, TVA import, Impôt sur les importations, IVA all'importazione, IVA importazione, Imposta sull'importazione]
    duty:
      account: "4020"
      words: [Zoll, Zölle, Zollabgabe, Zollabgaben, Einfuhrzoll, Zollbetrag, Customs duty, Customs duties, Import duty, Duty, Duties, Droits de douane, Droit de douane, Douane, Dazio, Dazi, Dazi doganali]
    fees:
      account: "4040"
      words: [Vorlageprovision, Vorlageprovisionsgebühr, Vorlagegebühr, Vorlagekosten, Auslagenprovision, Aufwendungspauschale, Verzollung, Verzollungsgebühr, Verzollungskosten, Verzollungsspesen, Zollabfertigung, Abfertigungsgebühr, Kontoabwicklungsgebühr, Zusatzleistungen, Bearbeitungsgebühr, Gebühr, Gebühren, Disbursement fee, Advancement fee, Clearance fee, Customs clearance, Handling fee, Fee, Fees, Frais d'avance de fonds, Frais de dédouanement, Dédouanement, Frais de gestion, Frais, Spese di sdoganamento, Sdoganamento, Spese per prepagamento, Spese]
    freight:
      account: "6280"
      words: [Fracht, Frachtkosten, Transport, Transportkosten, Versand, Versandkosten, Porto, Freight, Shipping, Carriage, Fret, Frais de port, Frais de transport, Expédition, Trasporto, Spese di trasporto, Spedizione, Nolo]
  # A line that names only the tax («MWST», «MwSt / TVA / IVA») at no rate of its own: on an invoice
  # whose other lines name duty or import VAT (also lines of 0.00), or that cites a customs
  # declaration's number (assessment.number; a courier prints it as «Kosten …, Total MWST.-frei»),
  # it is the import VAT the carrier advanced. The carrier's own VAT is charged at a rate on its
  # services, never a line at 0 %; a line as much as that rate's tax on its taxed lines is its own.
  # A line that names no position but carries the carrier's Swiss rate (a printed invoice, an extra
  # service) is the carrier's own service: fees. Duty and import VAT never carry Swiss VAT.
  tax: [MWST, MwSt, Mehrwertsteuer, TVA, Taxe sur la valeur ajoutée, IVA, Imposta sul valore aggiunto, VAT, Value added tax]
  # A line of costs the carrier passed on free of VAT («MWST.-freie Kosten»), at no rate, on an
  # invoice that cites a customs declaration's number (assessment.number): what the carrier advanced
  # for the customs office there is the import VAT (Swiss industrial goods carry no duty since 2024;
  # duty lumped into it makes the line differ from the assessment, which then proves nothing). Only
  # with the number: postage and other invoices list VAT-free costs too.
  untaxed: [MWST.-freie Kosten, MWST-freie Kosten, MWST freie Kosten, MwSt.-freie Kosten, MwSt-freie Kosten]
  # The BAZG's assessment of import VAT (Veranlagungsverfügung MWST): its title, and the label of its
  # total. It proves the deduction when it names the firm's UID in its importer's block (`importer`;
  # without a UID in the settings: the firm's whole name at the start of a line of that block). Without the label, an assessment
  # whose title stands as a heading is read by its rows: each tax that is a base × a rate it states. The German words are the BAZG's
  # document; the French, Italian and English ones are its names in those languages, not yet seen
  # on a document.
  assessment:
    title: [Veranlagungsverfügung MWST, Décision de taxation TVA, Decisione d'imposizione IVA, Assessment decision VAT]
    total: [Gesamtbetrag MWST, Montant total TVA, Importo totale IVA, Total amount VAT]
    # Its number (the customs declaration's, such as 26CHEI000000004711), without the version suffix:
    # the courier's invoice cites it, two documents of one number are copies, and a payment to the
    # customs office names it in its text.
    number: '\d{2}CH[A-Z]{1,4}\d{10,14}'
    # Where a courier's invoice says how to fetch the assessment: the label of the access code that
    # comes with the declaration number (in a sentence «Zugangscode: …» or a table's column), and the
    # link beside it (processes/authorities/bazg.yaml#evv-download). Shown on the task «Veranlagungsverfügung fehlt».
    access: [Zugangscode, EVV Code, EVV-Code, eVV-Code, Code d'accès, Codice d'accesso, Access code]
    # The label of the importer's block: the firm the assessment is for is named there, on the label's
    # line after it or on the lines below it (a header printed as a column of labels and one of values).
    importer: [Importeur, Importeurin, Importateur, Importatrice, Importatore, Importer]
