# Schweizer Kontenrahmen KMU: the common accounts of classes 1-9, as a starting chart for a new
# workspace (npm run init). Public standard data, no company's numbers.
#
# Each account has a `type` (asset | liability | equity | revenue | expense | closing) and a
# `line`: the line of the balance sheet (OR 959a) or of the income statement (OR 959b, by nature
# of expense) it is shown on. `profiles` limits an account to a business profile (services,
# goods); `legalForms` limits it to a legal form; `names` renames it for a legal form. An account
# without them is in every chart. `hints` are the words a person types for an account besides its
# name («Miete», «Benzin»): an account field finds the account by them (German, as the names are).
# A name with a comma is quoted: unquoted, a flow mapping cuts it at the comma. Read by
# src/workspace/chart.ts, which checks every rule here and refuses a key it does not know.
#
# The one chart of the app: a new workspace starts from it, and every line of the casebook
# (examples/cases/) books on one of its accounts (npm run check-processes). Bank accounts by
# currency: 1020 CHF, 1021 EUR, 1022 USD; a further bank account takes the next free number.
schema: 1
name: Kontenrahmen KMU

