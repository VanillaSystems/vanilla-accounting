# Federal payroll figures of 2026 (docs/specs/payroll.md §3, §3l), maintained with each release like
# rates.yaml. Each figure: `value`, `validFrom` (a row with a later validFrom replaces it from that day),
# `source`. Rates in %, amounts in the books' currency per year unless the key says otherwise. Read by
# the payroll engine through the same valueOn as the firm's values (src/core/dated.ts). A year with
# payslips but no file here gives every payslip that needs a figure the line «unvollständig».
# Large amounts are written like registration.yaml (148.2e3 for 148,200).
year: 2026
figures:
  ahvEmployee: { value: 5.3, validFrom: 2026-01-01, source: "AHVG Art. 5, 13; IVG Art. 3; EOV Art. 36: AHV 8.7 + IV 1.4 + EO 0.5 = 10.6 %, half each (BSV, Entwicklung Beitragssätze 2026)" }
  ahvEmployer: { value: 5.3, validFrom: 2026-01-01, source: "AHVG Art. 13; IVG Art. 3; EOV Art. 36 (BSV, Entwicklung Beitragssätze 2026)" }
  alvEmployee: { value: 1.1, validFrom: 2026-01-01, source: "AVIG Art. 3 Abs. 1-2: 2.2 %, half each; no solidarity percentage since 1.1.2023" }
  alvEmployer: { value: 1.1, validFrom: 2026-01-01, source: "AVIG Art. 3 Abs. 1-2" }
  alvCeiling: { value: 148.2e3, validFrom: 2026-01-01, source: "AVIG Art. 3 Abs. 2, UVV Art. 22 Abs. 1: maximum insured earnings per year" }
  uvgCeiling: { value: 148.2e3, validFrom: 2026-01-01, source: "UVV Art. 22 Abs. 1: maximum insured earnings per year" }
  nbuMinHours: { value: 8, validFrom: 2026-01-01, source: "UVG Art. 8 Abs. 2, UVV Art. 13: non-occupational accidents insured from 8 hours a week" }
  liableFromAge: { value: 17, validFrom: 2026-01-01, source: "AHVG Art. 3 Abs. 2 lit. a: contributions from 1 January after the 17th birthday" }
  pensionerAllowance: { value: 1400, validFrom: 2026-01-01, source: "AHVV Art. 6quater: CHF 1,400 per month and employer past the reference age" }
  smallWageLimit: { value: 2500, validFrom: 2026-01-01, source: "AHVV Art. 34d Abs. 1: wages up to CHF 2,500 a year per employer only on the employee's request" }
  bvgEntryThreshold: { value: 22680, validFrom: 2026-01-01, source: "BVG Art. 2, 7; BVV 2 Art. 5 (BSV, Masszahlen 2025/2026)" }
  bvgCoordination: { value: 26460, validFrom: 2026-01-01, source: "BVG Art. 8 Abs. 1; BVV 2 Art. 5" }
  bvgMinCoordinated: { value: 3780, validFrom: 2026-01-01, source: "BVG Art. 8 Abs. 2; BVV 2 Art. 5" }
  bvgMaxCoordinated: { value: 64260, validFrom: 2026-01-01, source: "BVG Art. 8 Abs. 1; BVV 2 Art. 5 (upper limit 90,720 less the coordination)" }
  childAllowanceMin: { value: 215, validFrom: 2026-01-01, source: "FamZG Art. 5 Abs. 1, FamZV: at least CHF 215 per month from 1.1.2026" }
  educationAllowanceMin: { value: 268, validFrom: 2026-01-01, source: "FamZG Art. 5 Abs. 2, FamZV: at least CHF 268 per month from 1.1.2026" }
# The reference age (AHVG Art. 21, AHV 21): 65 for men; for women born up to 1960 64, then rising by three
# months per cohort to 65 for those born from 1964. `bornFrom` the first birth year a row holds for.
referenceAge:
  m: [{ bornFrom: 1900, years: 65, months: 0 }]
  f:
    - { bornFrom: 1900, years: 64, months: 0 }
    - { bornFrom: 1961, years: 64, months: 3 }
    - { bornFrom: 1962, years: 64, months: 6 }
    - { bornFrom: 1963, years: 64, months: 9 }
    - { bornFrom: 1964, years: 65, months: 0 }
