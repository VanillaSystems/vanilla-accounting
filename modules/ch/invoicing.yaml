# What an invoice may charge (Art. 25, 26 MWSTG): the rates a line offers, and for a line at 0 %
# the deduction box its turnover goes to, by why it carries no Swiss VAT. The code each one books
# with is asked from tax-codes.yaml by meaning.

# The first is the normal rate, a new line's default.
rates: [8.1, 2.6, 3.8, 0]

exemptions:
  abroad: "221"   # a service whose place of supply is abroad (Art. 8 MWSTG)
  export: "220"   # an export of goods (Art. 23 MWSTG)

# The countries of the VAT territory (Art. 3 MWSTG: Switzerland and Liechtenstein), by the first
# two letters of an IBAN: a customer payment in CHF from such an IBAN is proposed as a domestic
# sale at the normal rate, any other as an export (src/accounting/sales-without-vat.ts).
territory: [CH, LI]

# Words with which a sales invoice without Swiss VAT says its service is supplied abroad (Art. 8
# MWSTG), in the four languages: such a sale is booked at the abroad code (Ziffer 221), not the
# export code, which is for goods (src/accounting/sales-without-vat.ts saleCodeOf).
placeAbroad:
  - Leistungsort
  - Ort der Leistung
  - nicht der schweizerischen MWST
  - nicht der schweizerischen Mehrwertsteuer
  - Steuerschuldnerschaft des Leistungsempfängers
  - lieu de la prestation
  - non soumis à la TVA suisse
  - autoliquidation
  - luogo della prestazione
  - non soggetto all'IVA svizzera
  - inversione contabile
  - place of supply
  - not subject to Swiss VAT
  - reverse charge

# What the hand form reads off the firm's own invoice before it proposes a sale's code (#382): it
# proposes the abroad code only when the invoice names a place of supply outside the VAT territory
# after one of these labels («Leistungsort Deutschland», «Ort der Leistung: Österreich»); a label
# with a place at home or none, a statement alone, or a wording that the VAT is included asks the
# sale question instead (src/accounting/sale-document.ts).
placeOfSupply:
  - Leistungsort
  - Ort der Leistung
  - Ort der Dienstleistung
  - lieu de la prestation
  - luogo della prestazione
  - place of supply
# Wordings that a price includes the VAT: no proof of a supply abroad, whatever else the text says.
vatIncluded:
  - inkl. MWST
  - inkl. MwSt
  - inkl. Mehrwertsteuer
  - inklusive MWST
  - inklusive MwSt
  - inklusive Mehrwertsteuer
  - TVA incluse
  - TVA comprise
  - IVA inclusa
  - incl. VAT
  - including VAT
# The words that label a VAT on an invoice, in the four languages and the foreign ones a customer
# abroad reads: a percentage beside one that is no rate of the jurisdiction is a foreign VAT.
vatLabels: [MWST, MwSt, Mehrwertsteuer, USt, Umsatzsteuer, TVA, IVA, VAT]
