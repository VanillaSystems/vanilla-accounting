<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geteilte Buchhaltung · Vanilla Accounting</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="site/site.css">
</head>
<body>
<!-- Mockup of the company website's page /teilen/<id>: the page the e-mail's button opens. The key to the books is
     in the link after the #, so it never reaches the server. States by hash: #mac, #loaded, #windows, #phone, #expired,
     #withdrawn. The domain, the wordmark and the release links are stand-ins: check-public allows the company's name
     only in README.md (src/publish/leak-guard.ts IDENTITY_FILES). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="mark" viewBox="0 -1 43 33"><path d="M5.275,0.35C5.275,0.35 1.437,0.35 1.437,0.35C0.888,0.35 0.437,0.801 0.437,1.35C0.437,1.468 0.458,1.586 0.499,1.697L9.608,26.302C10.564,28.886 13.042,30.611 15.797,30.611C18.553,30.611 21.031,28.886 21.987,26.302L29.41,6.253C29.555,5.862 29.93,5.601 30.348,5.601C30.765,5.601 31.14,5.862 31.285,6.253L36.133,19.347C36.278,19.739 36.653,20 37.071,20C37.071,20 40.91,20 40.91,20C41.459,20 41.91,19.549 41.91,19C41.91,18.882 41.889,18.764 41.848,18.653L36.537,4.308C35.581,1.724 33.103,-0.001 30.348,-0.001C27.592,-0.001 25.114,1.724 24.158,4.308L16.735,24.357C16.59,24.748 16.215,25.009 15.797,25.009C15.38,25.009 15.005,24.748 14.86,24.357L6.213,1.003C6.068,0.611 5.693,0.35 5.275,0.35Z" fill="var(--logo)"/></symbol>
</svg>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="app" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#005B8C"/><path transform="translate(9.536 15.762) scale(1.06093)" d="M5.275,0.35C5.275,0.35 1.437,0.35 1.437,0.35C0.888,0.35 0.437,0.801 0.437,1.35C0.437,1.468 0.458,1.586 0.499,1.697L9.608,26.302C10.564,28.886 13.042,30.611 15.797,30.611C18.553,30.611 21.031,28.886 21.987,26.302L29.41,6.253C29.555,5.862 29.93,5.601 30.348,5.601C30.765,5.601 31.14,5.862 31.285,6.253L36.133,19.347C36.278,19.739 36.653,20 37.071,20C37.071,20 40.91,20 40.91,20C41.459,20 41.91,19.549 41.91,19C41.91,18.882 41.889,18.764 41.848,18.653L36.537,4.308C35.581,1.724 33.103,-0.001 30.348,-0.001C27.592,-0.001 25.114,1.724 24.158,4.308L16.735,24.357C16.59,24.748 16.215,25.009 15.797,25.009C15.38,25.009 15.005,24.748 14.86,24.357L6.213,1.003C6.068,0.611 5.693,0.35 5.275,0.35Z" fill="#FFFFFF"/></symbol>
  <symbol id="dl" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
</svg>

<header class="site-head">
  <div class="wrap">
    <a class="logo" href="#" aria-label="Startseite"><svg class="mark" aria-hidden="true"><use href="#mark"/></svg><span class="word">Vanilla Accounting</span></a>
    <nav class="site-nav" aria-label="Hauptnavigation"><a href="#">Angebote</a><a href="#">Über uns</a></nav>
  </div>
</header>
<main id="main"></main>
<footer class="site-foot">
  <div class="wrap">
    <span>© 2026 Vanilla Accounting</span>
    <nav aria-label="Rechtliches"><a href="#">Impressum</a><a href="#">Datenschutz</a></nav>
  </div>
</footer>

<script>
'use strict';
// The real page links the GitHub release of the app repository (github.com/<org>/vanilla-accounting/releases);
// the org's name is the company's, which check-public refuses here.
const RELEASE = '#github-releases';
const DMG = { arm: `${RELEASE}/download/v0.5.0/Vanilla.Accounting-0.5.0-arm64.dmg`, intel: `${RELEASE}/download/v0.5.0/Vanilla.Accounting-0.5.0-x64.dmg` };
const OPEN = 'vanilla-accounting://teilen/7Hq2Vx#k=Rk3pV0QmXz…';
const use = (id, cls = '') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

// Three install steps, drawn as the Mac shows them.
const ART = {
  open: `<svg viewBox="0 0 200 110" role="img" aria-label="Die geladene Datei im Ordner Downloads">
    <rect x="14" y="12" width="172" height="86" rx="7" fill="#fff" stroke="#d3d8e1"/>
    <rect x="14" y="12" width="172" height="16" rx="7" fill="#eef0f4"/><rect x="14" y="22" width="172" height="6" fill="#eef0f4"/>
    <circle cx="25" cy="20" r="3" fill="#ff5f57"/><circle cx="35" cy="20" r="3" fill="#febc2e"/><circle cx="45" cy="20" r="3" fill="#28c840"/>
    <text x="100" y="23" font-size="8" text-anchor="middle" fill="#4a5263" font-family="system-ui">Downloads</text>
    <rect x="26" y="40" width="148" height="20" rx="4" fill="#2e7d4f" fill-opacity=".12"/>
    <rect x="32" y="44" width="10" height="12" rx="2" fill="#a3a9b5"/><text x="48" y="53" font-size="8" fill="#0b1220" font-family="system-ui">Vanilla.Accounting-0.5.0-arm64.dmg</text>
    <rect x="32" y="68" width="10" height="12" rx="2" fill="#d3d8e1"/><rect x="48" y="72" width="70" height="4" rx="2" fill="#e7eaf0"/>
    <path d="M150 64l8 14 3-6 6 3z" fill="#0b1220" stroke="#fff" stroke-width="1"/></svg>`,
  drag: `<svg viewBox="0 0 200 110" role="img" aria-label="Das App-Symbol auf den Ordner Programme ziehen">
    <rect x="14" y="12" width="172" height="86" rx="7" fill="#fff" stroke="#d3d8e1"/>
    <use href="#app" x="34" y="36" width="36" height="36"/>
    <text x="52" y="86" font-size="7.5" text-anchor="middle" fill="#4a5263" font-family="system-ui">Vanilla Accounting</text>
    <path d="M80 54h36" stroke="#2e7d4f" stroke-width="2.4" stroke-dasharray="4 4"/><path d="M114 48l8 6-8 6" fill="none" stroke="#2e7d4f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M132 40h14l4 4h18a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3h-36a3 3 0 0 1-3-3V43a3 3 0 0 1 3-3z" fill="#6aa9e6"/>
    <path d="M140 52l8 8 8-8M148 46v14" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="150" y="86" font-size="7.5" text-anchor="middle" fill="#4a5263" font-family="system-ui">Programme</text></svg>`,
  start: `<svg viewBox="0 0 200 110" role="img" aria-label="Vanilla Accounting in Programme mit Doppelklick starten">
    <rect x="14" y="12" width="172" height="86" rx="7" fill="#fff" stroke="#d3d8e1"/>
    <rect x="14" y="12" width="172" height="16" rx="7" fill="#eef0f4"/><rect x="14" y="22" width="172" height="6" fill="#eef0f4"/>
    <text x="100" y="23" font-size="8" text-anchor="middle" fill="#4a5263" font-family="system-ui">Programme</text>
    <rect x="30" y="40" width="22" height="22" rx="5" fill="#e7eaf0"/><rect x="146" y="40" width="22" height="22" rx="5" fill="#e7eaf0"/>
    <rect x="82" y="34" width="36" height="46" rx="6" fill="#2e7d4f" fill-opacity=".1"/>
    <use href="#app" x="88" y="38" width="24" height="24"/>
    <text x="100" y="74" font-size="7" text-anchor="middle" fill="#0b1220" font-family="system-ui">Vanilla Accounting</text>
    <path d="M110 56l8 14 3-6 6 3z" fill="#0b1220" stroke="#fff" stroke-width="1"/>
    <text x="134" y="92" font-size="7" fill="#2e7d4f" font-family="system-ui">Doppelklick</text></svg>`,
};

const head = `
  <p class="label">Geteilte Buchhaltung</p>
  <h1>Anna Muster hat dir ihre Buchhaltung geschickt</h1>
  <p class="lead"><b>Muster Kaffee GmbH</b> · Stand 14.11.2026 · verfügbar bis 24.11.2026</p>
  <div class="msg">Hoi Papa, kannst du Q3 anschauen, bevor ich die MWST einreiche? Danke! Anna<small>Nachricht von Anna</small></div>`;
const lock = `<p class="lockline">${use('lock')}<span><b>Ende-zu-Ende verschlüsselt.</b> Der Schlüssel steht nur in deinem Link, hinter dem #, und kommt nie zu uns. Wir können den Inhalt nicht lesen.</span></p>`;

function install(done) {
  return `<ol class="install">
    <li>${ART.open}<b>Öffnen</b><span>Die geladene Datei in Downloads doppelklicken.</span></li>
    <li>${ART.drag}<b>In Programme ziehen</b><span>Das Symbol auf den Ordner Programme ziehen.</span></li>
    <li>${ART.start}<b>Starten</b><span>In Programme doppelklicken. Beim ersten Mal «Öffnen» bestätigen.</span></li>
  </ol>`;
}

function stepLoad(state) {
  if (state === 'loaded') {
    return `<section class="step done">
      <span class="n">${use('check', 'i')}</span>
      <h2>Vanilla Accounting laden</h2>
      <p class="sub ok">${use('check', 'i')}Geladen <span class="mono">Vanilla.Accounting-0.5.0-arm64.dmg · 129 MB</span></p>
      ${install(true)}
    </section>`;
  }
  return `<section class="step active">
    <span class="n">1</span>
    <h2>Vanilla Accounting laden</h2>
    <p class="sub">Die App für den Mac, gratis. Einmal installiert, öffnet sie jede Buchhaltung, die man dir schickt.</p>
    <div class="row">
      <a class="btn primary big" href="${DMG.arm}" data-go="web.html#loaded">${use('dl')}Für Mac mit Apple-Chip laden</a>
      <span class="meta">Version 0.5.0 · 129 MB · direkt von GitHub</span>
    </div>
    <div class="alt">
      <a href="${DMG.intel}">Mac mit Intel-Prozessor? Hier laden</a>
      <a href="${RELEASE}">Alle Versionen auf GitHub</a>
      <a href="#" data-go="web.html#loaded">Schon installiert? Direkt öffnen</a>
    </div>
    ${install(false)}
  </section>`;
}

function stepOpen(state) {
  const on = state === 'loaded';
  return `<section class="step ${on ? 'active' : 'later'}">
    <span class="n">2</span>
    <h2>Buchhaltung öffnen</h2>
    <p class="sub">Öffnet Annas Buchhaltung in Vanilla Accounting. Fragt der Mac, ob die Seite die App öffnen darf: «Erlauben».</p>
    <div class="row">
      <a class="btn ${on ? 'primary' : ''} big" href="${OPEN}" data-go="papa.html#open">${use('open')}Buchhaltung öffnen</a>
      ${on ? '<span class="meta">Anna sieht, dass du sie geöffnet hast.</span>' : ''}
    </div>
  </section>`;
}

function render() {
  const state = location.hash.slice(1) || 'mac';
  const main = document.getElementById('main');
  if (state === 'expired' || state === 'withdrawn') {
    main.innerHTML = `<section class="gone"><div class="wrap">
      <p class="label">Geteilte Buchhaltung</p>
      <h1>${state === 'expired' ? 'Dieser Link ist abgelaufen' : 'Anna Muster hat diesen Link zurückgezogen'}</h1>
      <p>${state === 'expired'
        ? 'Anna Muster hat ihre Buchhaltung bis 24.11.2026 geteilt. Danach ist sie bei uns gelöscht. Bitte Anna, sie dir noch einmal zu schicken.'
        : 'Die Buchhaltung ist bei uns gelöscht. Hast du sie schon in Vanilla Accounting geöffnet, ist sie dort noch, aber zurücksenden geht nicht mehr. Frag Anna, ob sie sie neu teilt.'}</p>
      <p class="lockline">${use('lock')}<span>Wir haben die Buchhaltung nie lesen können: sie war Ende-zu-Ende verschlüsselt.</span></p>
    </div></section>`;
    return;
  }
  if (state === 'windows' || state === 'phone') {
    const what = state === 'phone' ? 'auf dem Handy' : 'unter Windows';
    main.innerHTML = `<section class="share"><div class="wrap">${head}
      <div class="notice">
        <h2>Vanilla Accounting gibt es zurzeit für den Mac</h2>
        <p>${what === 'auf dem Handy' ? 'Auf dem Handy' : 'Unter Windows'} kannst du die Buchhaltung im Browser ansehen, aber nicht korrigieren. Zum Korrigieren öffne diese E-Mail auf einem Mac.</p>
        <div class="row"><a class="btn primary big" href="#" data-go="papa.html#web">${use('eye')}Im Browser ansehen</a></div>
      </div>
      ${lock}
    </div></section>`;
    return;
  }
  main.innerHTML = `<section class="share"><div class="wrap">${head}
    <div class="stepbox">${stepLoad(state)}${stepOpen(state)}</div>
    ${lock}
  </div></section>`;
}

// In the story (index.html) a click moves the story; alone, the page follows the link of the mockup.
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-go]');
  if (!a) return;
  e.preventDefault();
  if (window.parent !== window) window.parent.postMessage({ shareGo: a.dataset.go }, '*');
  else location.href = a.dataset.go;
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
