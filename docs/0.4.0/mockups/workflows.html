<title>Abläufe Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Vanilla Accounting 0.4.0: how workflows look, how they are triggered, and what each step does.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: the app's own shell (list beside detail, dock at the bottom), framed on a desk with
   numbered walkthrough screens above it and English notes beside each screen.
   Tokens are the app's (src/app/styles/tokens.css), plus graph-node roles. */
:root {
  --bg: #ffffff; --ink: #0b1220; --ink-2: #4a5263; --muted: #6e7685; --faint: #a3a9b5; --date: #98a0ad; --line: #e7eaf0; --line-2: #d3d8e1;
  --accent: #0067b1; --accent-soft: #e8f1f9; --on-accent: #fff; --hover: #f4f6f9;
  --glass: rgba(255,255,255,.72); --glass-line: rgba(11,18,32,.08); --shadow: 0 10px 40px -10px rgba(11,18,32,.25);
  --warn: #9a5b00; --warn-soft: #fdf3e1; --pos: #1a7f4b; --pos-soft: #e8f5ee; --neg: #b42318; --neg-soft: #fdecea;
  --ai: #6d4fc2; --desk: #eef1f5; --note: #fffbea; --note-line: #eadfae; --code: #f6f8fb;
  --f-display: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-text: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0a0a0a; --ink: #ededed; --ink-2: #b0b0b0; --muted: #8f8f8f; --faint: #5a5a5a; --date: #6b6b6b; --line: #1f1f1f; --line-2: #2e2e2e;
  --accent: #ededed; --accent-soft: #1a1a1a; --on-accent: #0a0a0a; --hover: #131313;
  --glass: rgba(24,24,24,.72); --glass-line: rgba(255,255,255,.08); --shadow: 0 10px 40px -10px rgba(0,0,0,.8);
  --warn: #e8b04b; --warn-soft: #2c2112; --pos: #5cc790; --pos-soft: #14281d; --neg: #f2877d; --neg-soft: #2a1513;
  --ai: #b9a6f2; --desk: #050505; --note: #1c1a10; --note-line: #3a3420; --code: #111111; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0a0a0a; --ink: #ededed; --ink-2: #b0b0b0; --muted: #8f8f8f; --faint: #5a5a5a; --date: #6b6b6b; --line: #1f1f1f; --line-2: #2e2e2e;
  --accent: #ededed; --accent-soft: #1a1a1a; --on-accent: #0a0a0a; --hover: #131313;
  --glass: rgba(24,24,24,.72); --glass-line: rgba(255,255,255,.08); --shadow: 0 10px 40px -10px rgba(0,0,0,.8);
  --warn: #e8b04b; --warn-soft: #2c2112; --pos: #5cc790; --pos-soft: #14281d; --neg: #f2877d; --neg-soft: #2a1513;
  --ai: #b9a6f2; --desk: #050505; --note: #1c1a10; --note-line: #3a3420; --code: #111111; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--desk); color: var(--ink); font: 14px/1.45 var(--f-text); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
svg.i { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* walkthrough header */
.wrap { max-width: 1440px; margin: 0 auto; display: grid; gap: 14px; }
.intro { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
.intro h1 { font: 800 22px/1.1 var(--f-display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); font-size: 13px; }
.screens { display: flex; flex-wrap: wrap; gap: 6px; }
.screens button { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 6px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.screens button .n { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font: 500 11.5px var(--f-mono); background: var(--hover); color: var(--muted); }
.screens button:hover { color: var(--ink); }
.screens button.on { color: var(--ink); border-color: var(--line-2); box-shadow: var(--shadow); }
.screens button.on .n { background: var(--accent); color: var(--on-accent); }

.stage { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 14px; align-items: start; }
.notes { background: var(--note); border: 1px solid var(--note-line); border-radius: 12px; padding: 14px 16px; font-size: 13px; color: var(--ink-2); display: grid; gap: 10px; position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); }
.notes h2 { margin: 0; font: 700 11px var(--f-text); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.notes p { margin: 0; }
.notes code { font: 12px var(--f-mono); background: var(--bg); border: 1px solid var(--note-line); border-radius: 4px; padding: 0 4px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }

/* the app window */
.app { background: var(--bg); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--glass-line); overflow: clip; display: grid; grid-template-rows: 1fr auto; grid-template-columns: minmax(0, 1fr) auto; position: relative; height: max(620px, calc(100vh - 190px)); }
.main { display: grid; grid-template-columns: minmax(280px, 32%) minmax(0, 1fr); min-height: 0; }
.list { padding: 28px 22px 40px 32px; border-right: 1px solid var(--line); min-width: 0; }
.detail { padding: 28px 32px 40px; min-width: 0; }
h3.h { font: 800 30px/1.1 var(--f-display); letter-spacing: -.025em; margin: 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; text-wrap: balance; }
h3.h .period { font: 500 14px var(--f-mono); color: var(--muted); letter-spacing: 0; }
.counts { margin: 10px 0 20px; color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
.counts b { color: var(--ink); font-weight: 600; }
.counts .n { font-family: var(--f-mono); font-size: 12.5px; margin-right: 3px; }
.group { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 20px 0 6px; display: flex; justify-content: space-between; gap: 8px; }
.group:first-of-type { margin-top: 0; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 9px 12px; margin: 0 -12px; border-radius: 8px; cursor: pointer; width: calc(100% + 24px); text-align: left; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--accent-soft); }
.row .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.row .s { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.trig { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--ink-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; height: 20px; background: var(--bg); white-space: nowrap; }
.trig svg { width: 12px; height: 12px; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 10px; font: 500 11.5px var(--f-text); white-space: nowrap; }
.pill.ok { background: var(--pos-soft); color: var(--pos); }
.pill.stuck { background: var(--warn-soft); color: var(--warn); }
.pill.run { background: var(--accent-soft); color: var(--ink); }
.pill.wait { background: var(--hover); color: var(--muted); }
.pill.muted { background: var(--hover); color: var(--muted); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: block; }

/* detail */
.dhead { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.dhead h4 { font: 700 22px/1.15 var(--f-display); letter-spacing: -.015em; margin: 0; flex: 1 1 260px; text-wrap: balance; }
.dhead .path { font: 12px var(--f-mono); color: var(--faint); display: block; margin-top: 4px; font-weight: 400; letter-spacing: 0; }
.desc { color: var(--ink-2); margin: 8px 0 16px; max-width: 70ch; }
.btn { height: 32px; padding: 0 12px; border-radius: 9px; display: inline-flex; align-items: center; gap: 7px; font-size: 13px; white-space: nowrap; border: 1px solid var(--line); background: var(--bg); }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 6px 0 16px; overflow-x: auto; }
.tabs button { padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.tabs button .n { font: 11.5px var(--f-mono); color: var(--faint); margin-left: 4px; }

/* graph */
.graphbox { position: relative; border: 1px solid var(--line); border-radius: 12px; background:
  radial-gradient(circle, var(--line) 1px, transparent 1.2px) 0 0 / 18px 18px, var(--bg); overflow-x: auto; }
.graph { position: relative; }
.graph svg.edges { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.edges path { fill: none; stroke: var(--line-2); stroke-width: 1.5; }
.edges path.back { stroke-dasharray: 4 4; }
.edges path.hot { stroke: var(--accent); stroke-width: 2.2; }
.edges path.dim { opacity: .35; }
.edges marker path { fill: var(--line-2); stroke: none; }
.edges marker.hot path { fill: var(--accent); }
.elabel { position: absolute; transform: translate(-50%, -50%); font: 500 10.5px var(--f-mono); color: var(--muted); background: var(--bg); padding: 0 4px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
.elabel.hot { color: var(--ink); }
.elabel.dim { opacity: .4; }
.node { position: absolute; width: 156px; min-height: 58px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--bg); padding: 7px 10px 7px; text-align: left; display: grid; gap: 2px; align-content: start; transition: box-shadow .15s, opacity .2s; }
.node:hover { box-shadow: 0 0 0 3px var(--accent-soft); }
.node .k { font: 500 10px var(--f-mono); color: var(--faint); text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; gap: 5px; }
.node .k svg { width: 11px; height: 11px; }
.node .l { font-size: 12.5px; line-height: 1.25; font-weight: 600; }
.node.decision { border-style: solid; border-color: var(--ink-2); }
.node.effect { border-color: var(--neg); }
.node.effect .k { color: var(--neg); }
.node.human { background: var(--warn-soft); border-color: transparent; }
.node.human .k { color: var(--warn); }
.node.wait { border-style: dashed; }
.node.trigger { background: var(--ink); color: var(--bg); border-color: transparent; border-radius: 29px; padding-left: 14px; }
.node.trigger .k { color: var(--faint); }
.node.trigger.manual { background: var(--accent); color: var(--on-accent); }
.node.trigger.manual .k { color: var(--on-accent); opacity: .75; }
.node.emit { background: var(--bg); border: 1.5px dashed var(--ink-2); border-radius: 29px; padding-left: 14px; }
.node.wf { border-width: 1.5px; }
.node.wf.here { box-shadow: 0 0 0 3px var(--accent); }
.node.sel { box-shadow: 0 0 0 3px var(--accent); }
.node.done { box-shadow: inset 0 0 0 1.5px var(--pos); }
.node.done::after { content: "✓"; position: absolute; right: 8px; top: 6px; font-size: 11px; color: var(--pos); font-weight: 700; }
.node.stuckat { box-shadow: 0 0 0 3px var(--warn); }
.node.stuckat::after { content: "steckt"; position: absolute; right: 8px; top: 6px; font: 600 10px var(--f-text); color: var(--warn); }
.node.dim { opacity: .38; }
.node.muted-fx::after { content: "stumm"; position: absolute; right: 8px; top: 6px; font: 600 10px var(--f-text); color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 10px 2px 0; font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 12px; border-radius: 4px; border: 1.5px solid var(--line-2); display: block; }
.legend i.t { background: var(--ink); border-color: transparent; border-radius: 6px; }
.legend i.m { background: var(--accent); border-color: transparent; border-radius: 6px; }
.legend i.d { border-color: var(--ink-2); }
.legend i.e { border-color: var(--neg); }
.legend i.h { background: var(--warn-soft); border-color: transparent; }
.legend i.w { border-style: dashed; }
.legend .bot, .ai-mark .bot { color: var(--ai); }
svg.bot { color: var(--ai); }
.btn.primary svg.bot { color: var(--on-accent); }
.node.trigger svg.bot { color: inherit; }
.ai-mark { display: inline-flex; align-items: center; gap: 4px; font: 500 11px var(--f-text); color: var(--ai); }
.node.agent { border-color: var(--ai); }
.node.agent .k { color: var(--ai); }

/* step panel */
.panel { margin-top: 16px; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; }
.panel .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel .top b { font: 700 17px var(--f-display); letter-spacing: -.01em; }
.panel .top .mono { color: var(--faint); font-size: 12px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 7px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
.tag { font: 12px var(--f-mono); background: var(--hover); border-radius: 5px; padding: 1px 6px; }
.tag.fx { background: var(--neg-soft); color: var(--neg); }
.tag.lk { background: transparent; border: 1px solid var(--line); }
.outc { display: grid; gap: 4px; }
.outc div { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.outc .arrow { color: var(--faint); }
pre.code { margin: 0; background: var(--code); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; font: 12px/1.55 var(--f-mono); overflow-x: auto; color: var(--ink-2); }
pre.code .c { color: var(--faint); }
pre.code .k { color: var(--ink); font-weight: 500; }
.rules { display: grid; gap: 8px; }
.rule { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--hover); }
.rule .id { font: 11.5px var(--f-mono); color: var(--muted); grid-row: span 2; padding-top: 1px; }
.rule .w { color: var(--ink-2); }
.rule .w b, .rule .th b { color: var(--muted); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }
.rule.co { background: var(--accent-soft); }
.small { font-size: 12px; color: var(--muted); }

/* triggers tab */
.tlist { display: grid; gap: 10px; }
.tcard { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 4px 14px; align-items: start; }
.tcard .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--hover); grid-row: span 3; }
.tcard .ic svg { width: 18px; height: 18px; }
.tcard.manual .ic { background: var(--accent); color: var(--on-accent); }
.tcard b { font-weight: 600; }
.tcard .what { color: var(--ink-2); font-size: 13px; }
.tcard .where { font-size: 12px; color: var(--muted); grid-column: 2; }
.tcard .act { grid-row: 1 / span 2; grid-column: 3; }
.picker { grid-column: 2 / -1; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
.picker .row { grid-template-columns: 76px 1fr auto; }
.picker .row .d { color: var(--date); font: 12.5px var(--f-mono); }
.picker .row .a { font: 13px var(--f-mono); }

/* runs */
.runs .row { grid-template-columns: 70px minmax(0, 1fr) auto; }
.runs .row .d { color: var(--date); font: 12px var(--f-mono); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; font-size: 13px; margin: 0 0 14px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.info { background: var(--accent-soft); color: var(--ink); }
.banner.ok { background: var(--pos-soft); color: var(--pos); }
.banner div { min-width: 0; }
.banner b { display: block; }
.banner.err { background: var(--neg-soft); color: var(--neg); }
.timeline { display: grid; gap: 0; margin-top: 14px; }
.tl { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; }
.tl .rail { display: grid; justify-items: center; grid-template-rows: 18px 1fr; }
.tl .rail i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--bg); margin-top: 4px; }
.tl .rail b { width: 2px; background: var(--line); }
.tl.done .rail i { border-color: var(--pos); background: var(--pos); }
.tl.stuck .rail i { border-color: var(--warn); background: var(--warn); }
.tl.muted .rail i { border-color: var(--muted); border-style: dashed; }
.tl:last-child .rail b { background: transparent; }
.tl .body { padding-bottom: 14px; min-width: 0; }
.tl .body .hd { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.tl .body .hd b { font-weight: 600; }
.tl .body .hd .mono { font-size: 11.5px; color: var(--faint); }
.io { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; margin-top: 6px; }
.io > div { background: var(--hover); border-radius: 8px; padding: 7px 10px; font: 12px/1.5 var(--f-mono); color: var(--ink-2); min-width: 0; overflow-wrap: anywhere; }
.io > div small { display: block; font: 600 10.5px var(--f-text); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }

/* screen 4: other areas */
.areas4 { display: grid; gap: 16px; }
.mini { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 10px; }
.mini .hd { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.mini .hd b { font: 700 17px var(--f-display); }
.mini .hd .mono { color: var(--muted); font-size: 13px; }
.mini .area { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.from { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); }
.from svg { width: 12px; height: 12px; }
.lines { display: grid; gap: 4px; font: 13px var(--f-mono); }
.lines div { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.why { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: 10px; background: var(--hover); font-size: 13px; }
.why a, .linkbtn { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; cursor: pointer; }

/* dock */
.dock { justify-self: center; margin: 0 0 12px; display: flex; gap: 2px; padding: 6px 8px; border-radius: 20px; background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow); max-width: calc(100% - 24px); overflow: visible; }
.dock .it { position: relative; min-width: 62px; padding: 6px 6px 4px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); }
.dock .it svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.dock .it span { font: 500 10.5px var(--f-text); white-space: nowrap; }
.dock .it:hover { background: var(--hover); color: var(--ink); }
.dock .it.on { background: var(--accent-soft); color: var(--ink); }
.dock .it.on span { font-weight: 600; }
.dock .it .badge { position: absolute; top: 1px; left: 50%; margin-left: 4px; min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px; background: var(--warn); color: var(--bg); font: 600 9.5px var(--f-mono); display: grid; place-items: center; }
.dock .it.new::before { content: "neu"; position: absolute; top: -7px; right: -2px; font: 600 9px var(--f-text); background: var(--accent); color: var(--on-accent); padding: 0 5px; border-radius: 6px; }
.dock .div { width: 1px; margin: 6px 4px; background: var(--line); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }

/* ---------- graph layout: layers by longest path, back edges routed below ---------- */
function layout(nodes, edges, startIds) {
  const out = {}; nodes.forEach((n) => (out[n.id] = []));
  edges.forEach((e) => out[e.from] && out[e.from].push(e));
  const state = {}, back = new Set(), order = [];
  const dfs = (id) => { state[id] = 1; for (const e of out[id] || []) { if (state[e.to] === 1) back.add(e); else if (!state[e.to]) dfs(e.to); } state[id] = 2; order.push(id); };
  startIds.forEach((s) => !state[s] && dfs(s));
  nodes.forEach((n) => !state[n.id] && dfs(n.id));
  const topo = order.reverse();
  const layer = {}; topo.forEach((id) => (layer[id] = layer[id] ?? 0));
  topo.forEach((id) => (out[id] || []).forEach((e) => { if (!back.has(e)) layer[e.to] = Math.max(layer[e.to] ?? 0, layer[id] + 1); }));
  const row = {}, used = {};
  const firstParent = {}; topo.forEach((id) => (out[id] || []).forEach((e) => { if (!back.has(e) && firstParent[e.to] === undefined) firstParent[e.to] = id; }));
  topo.slice().sort((a, b) => layer[a] - layer[b] || topo.indexOf(a) - topo.indexOf(b)).forEach((id) => {
    const L = layer[id]; used[L] = used[L] || new Set();
    let r = firstParent[id] !== undefined ? row[firstParent[id]] : 0;
    while (used[L].has(r)) r++;
    row[id] = r; used[L].add(r);
  });
  return { layer, row, back };
}

function drawGraph(host, nodes, edges, startIds, opt = {}) {
  const W = 156, H = 62, CG = 64, RG = 30, PAD = 22;
  const { layer, row, back } = layout(nodes, edges, startIds);
  const maxL = Math.max(...nodes.map((n) => layer[n.id])), maxR = Math.max(...nodes.map((n) => row[n.id]));
  const hasBack = edges.some((e) => back.has(e));
  const width = PAD * 2 + (maxL + 1) * W + maxL * CG, height = PAD * 2 + (maxR + 1) * H + maxR * RG + (hasBack ? 40 : 0);
  const pos = {}; nodes.forEach((n) => (pos[n.id] = { x: PAD + layer[n.id] * (W + CG), y: PAD + row[n.id] * (H + RG) }));
  const g = document.createElement('div'); g.className = 'graph'; g.style.width = width + 'px'; g.style.height = height + 'px';
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('class', 'edges'); svg.setAttribute('width', width); svg.setAttribute('height', height);
  svg.innerHTML = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker><marker id="ahh" class="hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z"/></marker></defs>';
  g.appendChild(svg);
  const labels = [];
  edges.forEach((e) => {
    const a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
    let d;
    if (back.has(e)) {
      const y = height - PAD - 6, x1 = a.x + W / 2, x2 = b.x + W / 2;
      d = `M${x1} ${a.y + H} C${x1} ${y} ${x2} ${y} ${x2} ${b.y + H + 2}`;
    } else {
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x - 2, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
      d = `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`;
    }
    const p = document.createElementNS(svgNS, 'path'); p.setAttribute('d', d);
    const hot = opt.hotEdge && opt.hotEdge(e), dim = opt.dimEdge && opt.dimEdge(e);
    p.setAttribute('class', [back.has(e) ? 'back' : '', hot ? 'hot' : '', dim ? 'dim' : ''].join(' '));
    p.setAttribute('marker-end', hot ? 'url(#ahh)' : 'url(#ah)');
    svg.appendChild(p);
    if (e.label) labels.push({ p, text: e.label, hot, dim });
  });
  nodes.forEach((n) => {
    const b = document.createElement('button'); b.type = 'button';
    b.className = ['node', n.cls, opt.nodeCls ? opt.nodeCls(n) : ''].join(' ');
    b.style.left = pos[n.id].x + 'px'; b.style.top = pos[n.id].y + 'px';
    b.innerHTML = `<span class="k">${n.icon || ''}${esc(n.kindLabel || '')}</span><span class="l">${esc(n.label)}</span>`;
    if (n.title) b.title = n.title;
    if (opt.onClick) b.addEventListener('click', () => opt.onClick(n)); else b.tabIndex = -1;
    g.appendChild(b);
  });
  host.appendChild(g);
  labels.forEach(({ p, text, hot, dim }) => {
    const L = p.getTotalLength(), pt = p.getPointAtLength(L * 0.5);
    const s = document.createElement('span'); s.className = 'elabel' + (hot ? ' hot' : '') + (dim ? ' dim' : '');
    s.style.left = pt.x + 'px'; s.style.top = pt.y + 'px'; s.textContent = text; g.appendChild(s);
  });
}

function wfGraph(key, host, overlay) {
  const wf = WF[key];
  const nodes = [], edges = [];
  wf.triggers.forEach((t, i) => {
    if (t.off) return;
    const id = '$t' + i;
    nodes.push({ id, label: t.kind === 'manual' ? `Knopf «${t.label}»` : t.on, kindLabel: TRIGGER_LABEL[t.kind], icon: I[t.kind] + (hasAI(key) ? I.bot : ''), cls: 'trigger ' + t.kind, trigger: t });
    edges.push({ from: id, to: wf.start });
  });
  Object.entries(wf.steps).forEach(([id, s]) => {
    nodes.push({ id, label: s.label, kindLabel: KIND_LABEL[s.kind], icon: KIND_ICON[s.kind], cls: s.kind === 'call' ? 'step' : s.kind, step: s });
    const many = Object.keys(s.outcomes).length > 1;
    Object.entries(s.outcomes).forEach(([o, to]) => edges.push({ from: id, to, label: many ? o : '' }));
  });
  nodes.push({ id: '$end', label: wf.emits.join(', '), kindLabel: 'meldet', cls: 'emit' });
  const run = overlay && overlay.run;
  const onPath = (id) => run && (run.path.includes(id) || (S.replayed && overlay.replayPath.includes(id)));
  drawGraph(host, nodes, edges, wf.triggers.map((t, i) => (t.off ? null : '$t' + i)).filter(Boolean), {
    onClick: overlay ? null : (n) => { if (n.step) { S.step = n.id; render(); } else if (n.trigger) { S.tab = 'triggers'; render(); } },
    nodeCls: (n) => {
      if (!overlay) return n.id === S.step ? 'sel' : '';
      if (n.id.startsWith('$t')) return n.trigger.kind === 'manual' ? '' : 'dim';
      const rp = S.replayed && run.id === '1047';
      const path = rp ? overlay.replayPath : run.path;
      if (rp && n.id === 'book') return 'muted-fx';
      if (!S.replayed && n.id === run.at) return run.status === 'stuck' ? 'errat' : 'stuckat';
      if (path.includes(n.id) || (S.replayed && n.id === '$end')) return n.id === '$end' ? '' : 'done';
      return 'dim';
    },
    hotEdge: (e) => {
      if (!overlay) return false;
      const path = S.replayed ? overlay.replayPath : run.path;
      const full = ['$t1', ...path, ...(S.replayed ? ['$end'] : [])];
      for (let i = 0; i < full.length - 1; i++) if (e.from === full[i] && e.to === full[i + 1]) return true;
      return false;
    },
    dimEdge: (e) => overlay && !onPath(e.from),
  });
}

function runStrip(key, selId) {
  const all = [...S.started.filter((r) => r.wf === key), ...WF[key].runs].slice(0, 8).reverse();
  if (!all.length) return '<div class="strip empty"><span class="small">noch keine Läufe</span></div>';
  return `<div class="strip" role="list" aria-label="Letzte Läufe, ältester links"><button class="nav" data-act="older" aria-label="ältere">←</button>${all.map((r) =>
    `<button class="ri ${r.status}${r.id === selId ? ' sel' : ''}" data-run="${r.id}" title="Lauf ${r.id} · ${esc(r.item)} ${esc(r.amount)} · ${RUN_WORD[r.status]}">${RUN_ICON[r.status]}</button>`).join('')}<button class="nav" disabled aria-label="neuere">→</button></div>`;
}
function startMenu() {
  const sel = S.screen === 3;
  return `<div class="runbtn"><button class="btn primary" data-act="pick">${hasAI(S.wf) ? I.bot : I.play}Starten</button><button class="btn primary caret" data-act="menu" aria-label="Weitere Startarten" aria-expanded="${!!S.menu}">▾</button>
    ${S.menu ? `<div class="menu" role="menu">
      <button role="menuitem" data-act="m-resume"><b>Nur offene Posten fortsetzen</b><span>wartende und steckende, jeweils ab ihrem Schritt</span></button>
      <button role="menuitem" data-act="m-replay"><b>${sel ? 'Diesen Lauf' : 'Letzten Lauf'} abspielen</b><span>ohne Wirkung, mit dem aktuellen Ablauf</span></button>
      <hr>
      <button role="menuitem" data-act="pick"><b>Ablauf starten…</b><span>für eine Bewegung, wie der Knopf «Buchen»</span></button>
      <button role="menuitem" data-act="m-custom"><b>Angepasst starten…</b><span>Posten, Version, Probelauf ohne Wirkung</span></button>
      <p>Nichts wird doppelt gebucht: eine Wirkung, die ein Lauf schon hatte, wird beim Wiederholen übersprungen.</p>
    </div>` : ''}</div>`;
}
function customPanel() {
  if (!S.custom) return '';
  return `<section class="panel custom"><div class="top"><b>Angepasst starten</b><span style="flex:1"></span><button class="btn" data-act="m-custom">Schliessen</button></div>
    <dl class="kv">
      <dt>Für</dt><dd><select id="c-item"><option>14.10. · FedEx Express · 412.35</option><option>13.10. · Digitec Galaxus · 129.00</option><option>alle offenen Bewegungen im Q4 (6)</option></select></dd>
      <dt>Version</dt><dd class="opts"><label><input type="radio" name="c-ver" id="c-ver-1" checked> aktuell</label><label><input type="radio" name="c-ver" id="c-ver-2"> Entwurf «Lagergebühr-Regel» (noch nicht eingeschaltet)</label></dd>
      <dt>Wirkung</dt><dd class="opts"><label><input type="radio" name="c-fx" id="c-fx-1" checked> Probelauf: zeigt, was gebucht würde</label><label><input type="radio" name="c-fx" id="c-fx-2"> echt: bucht</label></dd>

}
function detailHTML() {
  const wf = WF[S.wf], runCount = wf.runs.length + S.started.filter((r) => r.wf === S.wf).length;
  const manual = wf.triggers.find((t) => t.kind === 'manual');

function stepPanel() {
  const s = WF[S.wf].steps[S.step]; if (!s) return '';
  const outc = Object.entries(s.outcomes).map(([o, t]) => `<div><span class="tag">${esc(o)}</span><span class="arrow">→</span>${t === '$end' ? '<span class="small">Ende, meldet ' + esc(WF[S.wf].emits.join(', ')) + '</span>' : `<button class="linkbtn" data-step="${t}">${esc(WF[S.wf].steps[t].label)}</button>`}</div>`).join('');
  const rules = s.guide ? `<div><div class="small" style="margin-bottom:6px">Regeln aus <span class="mono">processes/${esc(WF[S.wf].guide)}#${esc(s.guide)}</span> (App) und <span class="mono">knowledge/rules/…</span> (Firma), in dieser Reihenfolge:</div>
    <div class="rules">${[...GUIDE_RULES[s.guide], ...(COMPANY_RULES[s.guide] || [])].map((r) => `<div class="rule${r.co ? ' co' : ''}"><span class="id">${esc(r.id)}</span><span class="w"><b>wenn</b>${esc(r.when)}</span><span class="th"><b>dann</b>${esc(r.then)}</span></div>`).join('')}</div></div>` : '';
  const code = s.code ? `<pre class="code">${esc(s.code)}</pre>` : s.uses ? `<p class="small" style="margin:0">Dieser Schritt hat keinen eigenen Code. Er ruft die Aktion <span class="tag">${esc(s.uses)}</span> auf, die auch andere Abläufe nutzen. Ein Fehler dort wird einmal behoben, für alle.</p>` : s.calls ? `<p class="small" style="margin:0">Ruft den Ablauf <button class="linkbtn" data-wf="${esc(s.calls)}">${esc(WF[s.calls].label)}</button> auf und wartet, bis er fertig ist.</p>` : `<p class="small" style="margin:0">Eine Person erledigt diesen Schritt in ihrer Inbox. Der Lauf wartet so lange.</p>`;
  return `<section class="panel" aria-label="Schritt">
    <div class="top"><b>${esc(s.label)}</b><span class="pill muted">${s.kind === 'agent' ? I.bot : ''}${esc(KIND_LABEL[s.kind])}</span><span class="mono">${esc(S.step)}/</span><span style="flex:1"></span><button class="btn" data-act="closestep">Schliessen</button></div>
    <dl class="kv">
      <dt>liest</dt><dd>${s.reads.map((r) => `<span class="tag">${esc(r)}</span>`).join('') || '<span class="small">nichts</span>'}</dd>
      <dt>gibt zurück</dt><dd>${s.emits.map((r) => `<span class="tag">${esc(r)}</span>`).join('') || '<span class="small">nur ein Ergebnis</span>'}</dd>
      <dt>Ergebnisse</dt><dd class="outc">${outc}</dd>
      ${s.kind === 'agent' ? `<dt>KI</dt><dd><span class="ai-mark">${I.bot}Ein Modell entscheidet, an die Regeln gebunden.</span><span class="small">Beim Abspielen gilt seine aufgezeichnete Antwort (D9).</span></dd>` : ''}
      <dt>Wirkung</dt><dd>${s.effects.length ? s.effects.map((e) => `<span class="tag fx">${esc(e)}</span>`).join('') + '<span class="small">beim Abspielen stumm</span>' : '<span class="small">keine: ändert nichts ausserhalb des Laufs</span>'}</dd>
      ${s.knowledge ? `<dt>Wissen</dt><dd>${s.knowledge.map((k) => `<span class="tag lk">knowledge/${esc(k)}</span>`).join('')}<span class="small">nur der Geschäftspartner dieses Postens</span></dd>` : ''}
    </dl>
    ${rules}
    <div><div class="small" style="margin-bottom:6px">Was er tut</div>${code}</div>
    <div><div class="small" style="margin-bottom:6px">Die Datei, aus der Bild und Lauf entstehen</div><pre class="code">${yamlOfStep(S.step, s)}</pre></div>
  </section>`;
}

function triggersHTML() {
  const wf = WF[S.wf];
  return `<div class="tlist">${wf.triggers.map((t, i) => `<div class="tcard ${t.kind}${t.off ? ' off' : ''}">
      <span class="ic">${I[t.kind]}</span>
      <div><span class="small">${esc(TRIGGER_LABEL[t.kind])} · <span class="mono">${esc(t.on)}</span></span><br><b>${esc(t.title)}</b>${t.off ? ' <span class="pill muted">aus</span>' : hasAI(S.wf) ? ` <span class="ai-mark">${I.bot}startet KI</span>` : ''}</div>
      <div class="act"><button class="btn${t.kind === 'manual' ? ' primary' : ''}" data-trig="${i}">${hasAI(S.wf) && t.kind !== 'event' ? I.bot : t.kind === 'event' ? I.replay : I.play}${esc(t.act)}</button></div>
      <div class="where">${esc(t.from)}</div>
      ${S.picking === i ? pickerHTML() : ''}
    </div>`).join('')}</div>
    <p class="small" style="margin-top:14px">Ein Ablauf hat einen oder mehrere Auslöser. Ein Knopf existiert nur, weil ein Ablauf ihn deklariert: wird der Ablauf entfernt, verschwindet auch der Knopf.</p>`;
}
function pickerHTML() {
  const items = S.wf === 'vat-filing' ? [['Q3', '2026-Q3', 'zu Ende']] : S.wf === 'receipt-collection' ? [['', 'Alle Mailboxen und Portale', '']] :
    [['14.10.', 'FedEx Express', '412.35'], ['14.10.', 'Migros Bank Zins', '0.85'], ['13.10.', 'Digitec Galaxus', '129.00']];
  return `<div class="picker"><span class="small">Starten für:</span>${items.map((it, i) => `<button class="row" data-start="${i}"><span class="d">${esc(it[0])}</span><span class="t">${esc(it[1])}</span><span class="a">${esc(it[2])}</span></button>`).join('')}</div>`;
}

function runsHTML() {
  const wf = WF[S.wf], started = S.started.filter((r) => r.wf === S.wf);
  const rows = [...started, ...wf.runs];
  if (!rows.length) return '<p class="small">Noch keine Läufe in diesem Quartal.</p>';
  return `<div class="runs">${rows.map((r) => `<button class="row" data-run="${r.id}"><span class="d">${esc(r.date)}</span><span class="t">${esc(r.item)} <small class="mono" style="color:var(--muted)">${esc(r.amount)}</small></span>${statusPill(r.status)}</button>`).join('')}</div>
  <p class="small" style="margin-top:12px">Ein Lauf ist eine Ausführung für einen Posten: eine Bewegung, ein Beleg, ein Quartal. Ein Lauf schlägt nie fehl. Er steckt, bis ihn jemand löst.</p>`;
}

function screenArea() {
  return `<div class="main"><div class="list" id="list">${listHTML()}</div><div class="detail" id="detail">${detailHTML()}</div></div>`;
}
function fillArea() {
  const body = $('#tabbody');
  if (S.tab === 'graph') {
    body.innerHTML = `<div class="graphbox" id="gbox"></div>
      <div class="legend"><span><i class="t"></i>Ereignis</span><span><i class="m"></i>Knopf</span><span><i></i>Schritt</span><span><i class="d"></i>Entscheid</span><span><i class="e"></i>Wirkung</span><span><i class="h"></i>Person</span><span><i class="w"></i>wartet</span><span>${I.bot}KI entscheidet</span><span>Schritt anklicken für Details</span></div>${stepPanel()}`;
    wfGraph(S.wf, $('#gbox'));
  } else if (S.tab === 'triggers') body.innerHTML = triggersHTML();
  else if (S.tab === 'runs') body.innerHTML = runsHTML();
  else body.innerHTML = `<pre class="code">${yamlOfWorkflow(S.wf)}</pre><p class="small" style="margin:14px 0 6px">Ordner</p><pre class="code">${esc(WF[S.wf].folder)}/\n  workflow.yaml\n${Object.entries(WF[S.wf].steps).map(([id, s]) => `  ${id}/\n    step.yaml${s.code ? '\n    run.ts' : ''}`).join('\n')}</pre>`;
}

/* ---------- screen 2: process map (level 0) ---------- */
function screenMap() {
  const views = [['phases', 'Phasen'], ['graph', 'Ereignisse']];
  const sub = { phases: 'Spalten aus <span class="mono">phase:</span>, Pfeile aus <span class="mono">on:</span> und <span class="mono">emits:</span> jeder workflow.yaml', graph: 'gezeichnet aus den Auslösern und Meldungen aller workflow.yaml' }[S.mapView];
  return `<div class="detail" style="padding-bottom:28px"><div class="dhead"><h4>Prozesskarte<span class="path">${sub}</span></h4>
      <div class="seg" role="tablist">${views.map(([k, l]) => `<button class="${S.mapView === k ? 'on' : ''}" data-mv="${k}">${l}</button>`).join('')}</div></div>
    <p class="desc">${{ phases: 'Die Buchhaltung eines Jahres in vier Phasen, in ihrer Reihenfolge. Jede Phase sagt, wie oft sie dran ist. Ein Ablauf anklicken öffnet ihn.',
      graph: 'Alle Abläufe und die Ereignisse dazwischen, ohne Zeit. Niemand zeichnet diese Karte: sie entsteht aus dem, worauf jeder Ablauf hört und was er meldet.' }[S.mapView]}</p>
    ${S.mapView === 'phases' ? '<div class="board" id="board"></div>' : '<div class="graphbox" id="mbox"></div>'}
    <div class="legend">${`<span><i class="t"></i>von aussen / Zeitplan</span><span><i class="m"></i>Knopf</span><span><i></i>Ablauf</span><span>${I.bot}mit KI-Schritt</span><span>Pfeile: Ereignisse</span>`}</div></div>`;
}
function mapEdges() {
  const edges = [];
  Object.entries(WF).forEach(([k, w]) => w.triggers.forEach((t) => {
    if (t.kind !== 'event' || t.off) return;
    const src = Object.keys(WF).find((o) => WF[o].emits.includes(t.on));
    if (src) edges.push({ from: src, to: k, label: t.on });
  }));
  edges.push({ from: 'receipt-collection', to: 'receipt-intake', label: 'file.staged' });
  return edges;
}
function fillPhases() {
  const board = $('#board');
  board.innerHTML = `<svg class="arrows" aria-hidden="true"><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z"/></marker></defs></svg>` +
    PHASES.map((p) => `<section class="phase" data-ph="${p.id}">
      <header><span class="pn">${p.n}</span><div><b>${esc(p.label)}</b><span class="cad">${esc(p.cadence)}</span></div></header>
      <p class="when">${esc(p.when)}</p><span class="now">${esc(p.now)}</span>
      <div class="cards">${WF_ORDER.filter((k) => WF[k].phase === p.id).map((k) => {
        const w = WF[k], st = w.runs.filter(isOpen).length;
        const listens = w.triggers.filter((t) => !t.off).map((t) => t.kind === 'event' ? t.on : t.kind === 'manual' ? `Knopf «${t.label}»` : t.kind === 'schedule' ? t.on : 'Datei von aussen');
        return `<button class="card${st ? ' stuck' : ''}" data-wf="${k}" id="c-${k}"><span class="ct">${esc(w.label)}${hasAI(k) ? I.bot : ''}</span>
          <span class="cc">${esc(w.cadence)}</span>
          <span class="cl"><span>startet bei</span> ${listens.map(esc).join(', ')}</span>
          <span class="cl"><span>meldet</span> ${w.emits.map(esc).join(', ')}</span>
          ${st ? `<span class="pill stuck"><i></i>${st} steckt</span>` : ''}</button>`;
      }).join('')}</div>
      ${p.id === 'year' ? '<span class="loop">↩ eröffnet das neue Jahr: zurück zu 1</span>' : ''}
    </section>`).join('');
  drawArrows();
}
function drawArrows() {
  const board = $('#board'); if (!board) return;
  const svg = board.querySelector('svg.arrows'); svg.querySelectorAll('path.a, text').forEach((n) => n.remove());
  board.querySelectorAll('.alabel').forEach((n) => n.remove());
  const B = board.getBoundingClientRect(); svg.setAttribute('width', B.width); svg.setAttribute('height', B.height);
  const stacked = board.querySelector('.phase:nth-child(3)').getBoundingClientRect().top > board.querySelector('.phase:nth-child(2)').getBoundingClientRect().top + 20;
  mapEdges().forEach((e) => {
    const a = $('#c-' + e.from), b = $('#c-' + e.to); if (!a || !b) return;
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const same = Math.abs(ra.left - rb.left) < 4;
    let d, lx, ly;
    if (same || stacked) {
      const x1 = ra.left - B.left + 18, y1 = ra.bottom - B.top, x2 = rb.left - B.left + 18, y2 = rb.top - B.top - 2;
      d = `M${x1} ${y1} L${x2} ${y2}`; lx = x1 + 8; ly = (y1 + y2) / 2;
    } else {
      const x1 = ra.right - B.left, y1 = ra.top - B.top + ra.height / 2, x2 = rb.left - B.left - 2, y2 = rb.top - B.top + rb.height / 2, mx = (x1 + x2) / 2;
      d = `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`; lx = mx; ly = (y1 + y2) / 2;
    }
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d); p.setAttribute('class', 'a'); p.setAttribute('marker-end', 'url(#am)'); svg.appendChild(p);
    if (!(same || stacked)) return; // across columns the card itself says what starts it
    const l = document.createElement('span'); l.className = 'alabel' + (same || stacked ? ' side' : ''); l.style.left = lx + 'px'; l.style.top = ly + 'px'; l.textContent = e.label; board.appendChild(l);
  });
}
function fillMap() {
  if (S.mapView === 'phases') return fillPhases();
  const nodes = [], edges = [], ext = {};
  Object.entries(WF).forEach(([k, w]) => {
    const st = w.runs.filter(isOpen).length;
    nodes.push({ id: k, label: w.label, kindLabel: st ? `${st} steckt` : 'Ablauf', icon: hasAI(k) ? I.bot : I.graph, cls: 'wf' + (k === S.wf ? ' here' : '') + (st ? ' human' : ''), wf: k });
    w.triggers.forEach((t) => {
      if (t.kind === 'event') {
        if (t.off) return;
        const src = Object.keys(WF).find((o) => WF[o].emits.includes(t.on));
        if (src) edges.push({ from: src, to: k, label: t.on });
      } else {
        const id = 'x-' + t.kind + '-' + k; ext[id] = 1;
        nodes.push({ id, label: t.kind === 'manual' ? `«${t.label}»` : t.title, kindLabel: TRIGGER_LABEL[t.kind], icon: I[t.kind], cls: 'trigger ' + t.kind });
        edges.push({ from: id, to: k });
      }
    });
  });
  edges.push({ from: 'receipt-collection', to: 'receipt-intake', label: 'file.staged' });
  drawGraph($('#mbox'), nodes, edges, Object.keys(ext), { onClick: (n) => { if (n.wf) { S.wf = n.wf; S.screen = 1; S.tab = 'graph'; S.step = null; render(); } } });
}

/* ---------- screen 3: one run ---------- */
function screenRun() {
  if (!WF[S.wf].runs.length && !S.started.some((x) => x.wf === S.wf)) { S.wf = 'booking'; S.run = '1047'; }
  const wf = WF[S.wf], r = [...S.started.filter((x) => x.wf === S.wf), ...wf.runs].find((x) => x.id === S.run) || wf.runs[0];
  const special = S.wf === 'booking' && r.id === '1047';
  const replayPath = ['rates', 'facts', 'classify', 'book', 'check'];
  const steps = special && S.replayed ? replayPath : (r.path || []);
  const replayIO = { classify: ['Neue Regel shp-courier-storage greift', 'Zoll 18.40 → 4020 · ausl. MWST 33.75 → 4030 · Lagergebühr 360.20 → 4040'], book: ['würde buchen: 3 Einträge, S 4020/4030/4040 / H 1020 · 412.35', 'stumm: nichts geschrieben'], check: ['Summe 412.35 = Bewegung 412.35 → stimmt'] };
  const sub = special ? 'gestartet 14.10. 09:12 durch Knopf «Buchen» · Bewegung BT-2026-10-14-03 · KI in Schritt «Konto und MWST-Code wählen»' : `${esc(wf.label)} · ${esc(r.date)} · ${r.status === 'done' ? 'gestartet durch transaction.settled' : 'gestartet durch Knopf'}`;
  let banner;
  if (special && S.replayed) banner = `<div class="banner info">${I.replay}<div><b>Abgespielt mit der Änderung, ohne Wirkung.</b>Die neue Regel aus dem Guide trifft. «Buchung schreiben» war stumm: nichts wurde in die Bücher geschrieben. Stimmt das Ergebnis, geht der echte Lauf weiter.</div></div>
      <div class="btns" style="margin-bottom:14px"><button class="btn primary" data-act="resume">${I.play}Lauf fortsetzen</button><button class="btn" data-act="keepcase">Als Testfall behalten</button><button class="btn" data-act="unreplay">Zurück</button></div>`;
  else if (r.status === 'you') banner = `<div class="banner warn">${I.person}<div><b>Wartet auf dich bei «${esc(wf.steps[r.at].label)}» seit 2 Std.</b>${esc(r.why || '')}</div></div>
      <div class="btns" style="margin-bottom:14px">${special ? '<button class="btn primary" data-act="decide">Entscheiden: Lagergebühr → 4040</button><button class="btn" data-act="replay">' + I.replay + 'Mit Änderung abspielen</button>' : ''}<button class="btn" data-act="change">${I.bot}Ablauf ändern…</button></div>`;
  else if (r.status === 'stuck') banner = `<div class="banner err">${I.code}<div><b>Steckt bei «${esc(wf.steps[r.at].label)}».</b>${esc(r.why || '')}</div></div>
      <div class="btns" style="margin-bottom:14px"><button class="btn primary" data-act="change">${I.bot}Ablauf ändern…</button><button class="btn" data-act="m-replay">${I.replay}Abspielen</button><button class="btn" data-act="skiprun">Posten von Hand buchen</button></div>`;
  else if (r.status === 'running') banner = `<div class="banner info">${I.play}<div><b>Läuft …</b>Gestartet von Hand. Die Schritte erscheinen, sobald sie fertig sind.</div></div>`;
  else banner = `<div class="banner ok">${I.play}<div><b>Fertig in ${steps.length} Schritten.</b>Eine Buchung geschrieben. Abspielen zeigt, was der heutige Ablauf mit demselben Fall täte, ohne etwas zu schreiben.</div></div>
      <div class="btns" style="margin-bottom:14px"><button class="btn" data-act="m-replay">${I.replay}Abspielen</button><button class="btn" data-act="change">${I.bot}Ablauf ändern…</button></div>`;
  return `<div class="main"><div class="list">${listHTML()}</div>
  <div class="detail">
    <div class="dhead"><h4>Lauf ${r.id} · ${esc(r.item)} <span class="mono" style="font-size:16px;color:var(--muted)">${esc(r.amount)}</span><span class="path">${sub}</span></h4><div class="hbar">${runStrip(S.wf, r.id)}${startMenu()}</div></div>
    ${banner}
    <div class="graphbox" id="rbox"></div>
    <div class="timeline">${steps.map((id) => {

  6: `<h2>Screen 6 · Changing a workflow</h2><p>You do not need Claude Code open beside the app. The app has the AI built in, scoped to the workspace's files: workflows, guides, knowledge. It works through the same command registry as the CLI and MCP (ADR 0005).</p>

  1: `<h2>The top bar</h2><p>Same behaviour as the dock, its own pin: company, search (⌘K), period, zoom, export, theme, language. Folded it is a pill «Beispiel GmbH · 2026-Q4 ▾», so the period stays visible. Separate pins because the two are used differently: the dock all the time, the top bar now and then. Search lives here; the corner keeps the AI and the status.</p><h2>Navigation at the bottom</h2><p>Collapsed, not hidden: a pill shows where you are («▴ Automatisierung» and the open count); hover or click opens the full dock. New users get it open until they have used it three times; then it folds once, with a tip and «Immer zeigen». A pin with a checkbox at the right end of the dock keeps it open (ticked) or lets it fold (unticked); hovering it explains both. With the AI sidebar open, the dock stays centred on the page; the sidebar is now a separate card, so that reads as intended. Try the switch «Leiste unten» at the top.</p><h2>Context for the AI</h2><p>A reference, not a screenshot: the AI gets <i>what</i> you look at and reads the real record itself. The dashed chip «Ansicht: …» follows you until you send, then stays with the conversation; × sends without it. Type @ for a run, booking, receipt, workflow, file or period; + offers «Diese Ansicht», selected rows, search, a file. «Mit KI ändern…» on an object adds it.</p><h2>KI, as a sidebar</h2><p>${I.bot} top right, or ⌘J, opens and closes the AI on the right; the page gets narrower, nothing is covered. It lists past conversations; a click continues one. At the bottom the composer: a tip, the context as chips, the text, mode «Ändern» or «Nur fragen», model «Auto», send; underneath where it runs and what it may do. «Mit KI ändern…» anywhere opens it with that context. ⌘K is search only.</p><h2>Status, top right</h2><p>No title bar. Top right: a spinner with the number of runs while something runs; an amber dot with a count when nothing runs but something waits for you; nothing when all is quiet. A click opens a panel that updates live: what runs (with bars), how many are queued, what waits for you, what finished last; «Warteschlange öffnen», «Aufgaben». The magnifier beside it is ⌘K.</p><h2>Screen 1 · The Automatisierung area</h2>
    <p>A new area in the dock, named for what people look for there: automation and AI. Its items are still called Abläufe (workflows). Left: every workflow, grouped by process, with its triggers as chips and a warning when a run is stuck. Right: the selected workflow.</p>
    <ul><li><b>Ablauf</b>: the graph, drawn from <code>workflow.yaml</code> and the <code>step.yaml</code> files. Click a step to see what it reads, returns, its outcomes, its effects, the guide rules it applies, and the file itself.</li>
