task: {"title": {"de": "{source}: Mail-Programm prüfen", "en": "{source}: check the Mail app", "fr": "{source} : vérifier l’app Mail", "it": "{source}: controllare l’app Mail"}, "why": {"de": "Die App konnte das Mail-Programm dieses Macs nicht lesen: Mail ist nicht offen, die Erlaubnis «Mail steuern» fehlt (Systemeinstellungen › Datenschutz & Sicherheit › Automation), oder das Konto heisst in Mail nicht mehr so. Danach «Erledigt», und die Quelle holt weiter, wo sie stand.", "en": "The app could not read this Mac's Mail app: Mail is not open, the permission to control Mail is missing (System Settings › Privacy & Security › Automation), or the account has another name in Mail now. Then «Done», and the source goes on where it stopped.", "fr": "L’app n’a pas pu lire l’app Mail de ce Mac : Mail n’est pas ouvert, l’autorisation de contrôler Mail manque (Réglages Système › Confidentialité et sécurité › Automatisation), ou le compte porte un autre nom dans Mail. Ensuite «Terminé», et la source reprend là où elle s’était arrêtée.", "it": "L’app non ha potuto leggere l’app Mail di questo Mac: Mail non è aperta, manca il permesso di controllare Mail (Impostazioni di Sistema › Privacy e sicurezza › Automazione), oppure l’account in Mail ha un altro nome. Poi «Fatto», e la fonte riprende da dove si era fermata."}}
