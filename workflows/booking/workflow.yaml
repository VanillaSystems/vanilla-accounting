# The pilot of migration step 9 (docs/0.4.0/workflows.md): booking one bank transaction, run by
# src/workflows/runner.ts. processes/booking.flow.yaml still describes the whole process; this
# folder is the part that runs.
label: Book a transaction
for: transaction
on:
  manual: { label: Buchen }
  event: { name: transaction.settled, off: true }
emits: [entry.booked]
start: open
steps: [open, classify, book]
guide: booking.guide.yaml
