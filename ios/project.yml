name: Belege
options:
  bundleIdPrefix: com.belege
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Belege:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Belege
        excludes:
          - Info.plist
    info:
      path: Belege/Info.plist
      properties:
        NSCameraUsageDescription: "Zum Fotografieren von Belegen und zum Scannen des Koppel-Codes, den der Mac zeigt"
        NSLocalNetworkUsageDescription: "Um den Mac im lokalen Netzwerk zu finden und ihm die Belege zu senden"
        NSBonjourServices:
          - "_http._tcp"
        # Short enough not to be squeezed under the home screen icon; the App Store name can stay «Vanilla Belege».
        CFBundleDisplayName: "Belege"
        # Stand-in until the branding repo delivers the launch image (see docs/0.4.0/mockups/phone-app/NOTES.md).
        UILaunchScreen:
          UIColorName: LaunchBlue
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.belege.receipts
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
