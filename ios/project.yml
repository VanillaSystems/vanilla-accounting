name: Belege
options:
  bundleIdPrefix: com.belege
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Belege:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Belege
        excludes:
          - Info.plist
    info:
      path: Belege/Info.plist
      properties:
        NSCameraUsageDescription: "Used to photograph receipts and to scan the pairing code the Mac shows"
        NSLocalNetworkUsageDescription: "Used to find and connect to the Belege server on your local network"
        NSBonjourServices:
          - "_http._tcp"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.belege.receipts
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
